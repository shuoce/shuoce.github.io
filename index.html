
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>网站导航管理 · 硕策</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-soft: rgba(99, 102, 241, .12);
            --primary-glow: rgba(99, 102, 241, .22);
            --success: #10b981;
            --danger: #ef4444;
            --danger-soft: #fef2f2;
            --warning: #f59e0b;
            --bg: #f4f6fb;
            --bg-grad:
                radial-gradient(1200px 600px at 88% -15%, rgba(99, 102, 241, .08), transparent),
                radial-gradient(900px 500px at -8% 25%, rgba(139, 92, 246, .05), transparent);
            --card-bg: #ffffff;
            --card-border: #e6eaf0;
            --card-shadow:
                0 1px 2px rgba(15, 23, 42, .04),
                0 4px 14px rgba(15, 23, 42, .04);
            --card-shadow-hover:
                0 4px 14px rgba(15, 23, 42, .07),
                0 14px 34px rgba(15, 23, 42, .08);
            --text-1: #0f172a;
            --text-2: #475569;
            --text-3: #94a3b8;
            --border: #e8ecf1;
            --input-bg: #f8fafc;
            --sidebar-bg: #0c1424;
            --sidebar-text: #7c8ba1;
            --sidebar-active: rgba(99, 102, 241, .22);
            --sidebar-hover: rgba(255, 255, 255, .05);
            --radius: 16px;
            --radius-sm: 9px;
            --trans: all .25s cubic-bezier(.4, 0, .2, 1);
            --glass: rgba(255, 255, 255, .72);
        }

        [data-theme="dark"] {
            --bg: #0b1120;
            --bg-grad:
                radial-gradient(1200px 600px at 88% -15%, rgba(99, 102, 241, .12), transparent),
                radial-gradient(900px 500px at -8% 25%, rgba(139, 92, 246, .08), transparent);
            --card-bg: #151e2e;
            --card-border: rgba(148, 163, 184, .14);
            --card-shadow:
                0 1px 2px rgba(0, 0, 0, .25),
                0 4px 16px rgba(0, 0, 0, .18);
            --card-shadow-hover:
                0 6px 18px rgba(0, 0, 0, .4),
                0 16px 40px rgba(0, 0, 0, .3);
            --text-1: #e2e8f0;
            --text-2: #94a3b8;
            --text-3: #64748b;
            --border: #1e2a3a;
            --input-bg: #0f172a;
            --sidebar-bg: #080d18;
            --sidebar-text: #5b6b82;
            --sidebar-active: rgba(99, 102, 241, .25);
            --sidebar-hover: rgba(255, 255, 255, .04);
            --glass: rgba(15, 23, 42, .72);
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            background-image: var(--bg-grad);
            color: var(--text-1);
            font-family:
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                system-ui,
                -apple-system,
                sans-serif;
            line-height: 1.6;
            transition: background .3s;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 9px 14px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            background: none;
            color: var(--text-2);
            cursor: pointer;
            font-family: inherit;
            font-size: .83rem;
            font-weight: 500;
            transition: var(--trans);
            white-space: nowrap;
        }

        button:active {
            transform: scale(.95);
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            box-shadow: 0 4px 18px var(--primary-glow);
        }

        .btn-outline {
            border-color: var(--border);
            background: var(--card-bg);
            color: var(--text-2);
            box-shadow: 0 1px 2px rgba(0, 0, 0, .03);
        }

        .btn-outline:hover {
            border-color: #c7d2fe;
            background: var(--primary-soft);
            color: var(--text-1);
        }

        .btn-danger-soft {
            border-color: #fecaca;
            background: var(--danger-soft);
            color: #dc2626;
        }

        .btn-danger-soft:hover {
            background: #fee2e2;
        }

        .btn-sm {
            padding: 5px 10px;
            border-radius: 7px;
            font-size: .75rem;
        }

        .btn-block {
            width: 100%;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            position: sticky;
            top: 0;
            z-index: 60;
            display: flex;
            flex-shrink: 0;
            flex-direction: column;
            gap: 14px;
            width: 262px;
            height: 100vh;
            padding: 18px 14px;
            overflow-y: auto;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            transition: width .3s, background .3s;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            border-radius: 4px;
            background: rgba(255, 255, 255, .12);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 4px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
        }

        .brand-logo {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            overflow: hidden;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 4px 16px rgba(99, 102, 241, .4);
            font-size: 25px;
        }

        .brand-avatar {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text {
            color: #fff;
            font-size: 1rem;
            font-weight: 650;
            line-height: 1.3;
        }

        .brand-text small {
            display: block;
            color: var(--sidebar-text);
            font-size: .7rem;
            font-weight: 400;
            letter-spacing: .05em;
            opacity: .7;
        }

        .sidebar-title {
            padding: 0 4px;
            color: var(--sidebar-text);
            font-size: .7rem;
            letter-spacing: .08em;
            opacity: .7;
            text-transform: uppercase;
        }

        .category-list {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 4px;
            min-height: 60px;
            overflow-y: auto;
        }

        .category-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: background .15s, border-color .15s;
        }

        .category-item:hover {
            background: var(--sidebar-hover);
        }

        .category-item.active {
            border-color: rgba(99, 102, 241, .4);
            background: var(--sidebar-active);
            color: #fff;
        }

        .category-item.dragging {
            opacity: .5;
            background: var(--sidebar-active);
        }

        .category-item .name {
            flex: 1;
            overflow: hidden;
            color: inherit;
            font-size: .86rem;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .category-item .count {
            flex-shrink: 0;
            padding: 2px 7px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .1);
            color: var(--sidebar-text);
            font-size: .68rem;
        }

        .category-item.active .count {
            background: rgba(255, 255, 255, .15);
            color: #fff;
        }

        .move-btn {
            padding: 2px 4px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--sidebar-text);
            cursor: pointer;
            font-size: .75rem;
            line-height: 1;
            opacity: 0;
        }

        .category-item:hover .move-btn,
        .category-item.active .move-btn {
            opacity: .7;
        }

        .move-btn:hover {
            background: rgba(255, 255, 255, .2);
            opacity: 1 !important;
        }

        .sidebar-footer {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, .08);
        }

        .sidebar-footer .f-row {
            display: flex;
            gap: 6px;
        }

        .sidebar-footer .f-row button {
            flex: 1;
            padding: 7px;
            border: 1px solid rgba(255, 255, 255, .08);
            background: rgba(255, 255, 255, .06);
            color: var(--sidebar-text);
            font-size: .75rem;
        }

        .sidebar-footer .f-row button:hover {
            background: rgba(255, 255, 255, .12);
            color: #fff;
        }

        /* 主区域 */
        .main {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--glass);
            backdrop-filter: blur(12px);
        }

        .search-wrap {
            position: relative;
            flex: 1;
            max-width: 420px;
        }

        .search-wrap::before {
            position: absolute;
            top: 50%;
            left: 11px;
            z-index: 1;
            content: "🔍";
            transform: translateY(-50%);
            font-size: .82rem;
            opacity: .5;
            pointer-events: none;
        }

        .search-wrap input {
            width: 100%;
            padding: 9px 12px 9px 34px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: var(--input-bg);
            color: var(--text-1);
            font-size: .85rem;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        .search-wrap input:focus {
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .search-wrap input::placeholder {
            color: var(--text-3);
        }

        .topbar-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-left: auto;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 9px;
            font-size: .9rem;
        }

        /* 内容区 */
        .content {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1320px;
            margin: 0 auto;
            padding: 24px;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-header h2 {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-1);
            font-size: 1.4rem;
            font-weight: 700;
        }

        .page-header .meta {
            margin-top: 2px;
            color: var(--text-3);
            font-size: .8rem;
        }

        .page-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* 网站卡片 */
        .website-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            align-content: start;
            gap: 14px;
        }

        .website-card {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
            padding: 20px 16px 14px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            cursor: pointer;
            user-select: none;
            transition: var(--trans);
        }

        .website-card::before {
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 3px;
            content: "";
            background: linear-gradient(90deg, var(--primary), #8b5cf6);
            opacity: 0;
            transition: opacity .25s;
        }

        .website-card:hover {
            border-color: #c7d2fe;
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-4px);
        }

        .website-card:hover::before,
        .website-card.selected::before {
            opacity: 1;
        }

        .website-card.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-soft);
        }

        .website-card.dragging {
            opacity: .4;
            transform: scale(.97);
        }

        .card-favicon {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--input-bg);
            font-size: 18px;
        }

        .card-favicon img {
            display: block;
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .card-title {
            display: -webkit-box;
            overflow: hidden;
            color: var(--text-1);
            font-size: .9rem;
            font-weight: 600;
            line-height: 1.3;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .card-url {
            overflow: hidden;
            color: var(--text-3);
            font-size: .72rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-desc {
            display: -webkit-box;
            overflow: hidden;
            min-height: 0;
            color: var(--text-2);
            font-size: .76rem;
            line-height: 1.4;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .card-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 4px;
            margin-top: auto;
            opacity: 0;
            transition: opacity .2s;
        }

        .website-card:hover .card-actions {
            opacity: 1;
        }

        .website-card .check {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            color: transparent;
            font-size: 11px;
            transition: var(--trans);
        }

        .website-card:hover .check {
            border-color: var(--primary);
        }

        .website-card.selected .check {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 60px 20px;
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            background: var(--card-bg);
            color: var(--text-3);
            font-size: .9rem;
            text-align: center;
        }

        .empty-state .emoji {
            display: block;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        /* 快速添加 */
        .quick-add {
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
        }

        .quick-add h3 {
            margin-bottom: 10px;
            color: var(--text-2);
            font-size: .9rem;
            font-weight: 600;
        }

        .quick-form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-form input {
            flex: 1;
            min-width: 140px;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            background: var(--input-bg);
            color: var(--text-1);
            font-size: .85rem;
        }

        .quick-form input:focus {
            border-color: var(--primary);
            background: var(--card-bg);
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, .55);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all .25s;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px;
            border-radius: var(--radius);
            background: var(--card-bg);
            box-shadow: 0 24px 64px rgba(0, 0, 0, .2);
            transform: translateY(16px) scale(.98);
            transition: transform .25s;
        }

        .modal-overlay.open .modal {
            transform: translateY(0) scale(1);
        }

        .modal h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            color: var(--text-1);
            font-size: 1.1rem;
        }

        .modal label {
            display: block;
            margin: 12px 0 6px;
            color: var(--text-2);
            font-size: .8rem;
            font-weight: 550;
        }

        .modal input,
        .modal select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            background: var(--input-bg);
            color: var(--text-1);
            font-size: .9rem;
        }

        .modal input:focus,
        .modal select:focus {
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .modal .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 22px;
        }

        .modal-hint {
            margin-bottom: 12px;
            color: var(--text-3);
            font-size: .82rem;
            line-height: 1.4;
        }

        /* 提示 */
        #toast-container {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 360px;
            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 10px;
            background: var(--card-bg);
            box-shadow: 0 8px 28px rgba(0, 0, 0, .12);
            font-size: .84rem;
            animation: slideIn .3s ease;
            pointer-events: auto;
        }

        .toast.success {
            border-left-color: var(--success);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        .toast.warning {
            border-left-color: var(--warning);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            border-radius: 8px;
            background: var(--text-3);
        }

        @media (max-width: 900px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                padding: 12px 14px;
            }

            .category-list {
                flex-direction: row;
                padding-bottom: 4px;
                overflow-x: auto;
            }

            .category-item {
                flex-shrink: 0;
                padding: 7px 12px;
                background: rgba(255, 255, 255, .04);
            }

            .category-item .count {
                display: none;
            }

            .sidebar-footer {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .sidebar-footer .f-row {
                flex: 1;
            }

            .topbar {
                flex-wrap: wrap;
                padding: 10px 14px;
            }

            .search-wrap {
                order: 3;
                flex-basis: 100%;
                max-width: none;
            }

            .content {
                padding: 14px;
            }

            .website-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }

            .card-actions {
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .website-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }

            .topbar-actions .btn-outline span {
                display: none;
            }
        }
    </style>
</head>

<body>

        <aside class="sidebar">
            <div class="brand">
                <div class="brand-logo">
                    <img
                        class="brand-avatar"
                        src="https://img.baidu.re/i/2026/08/r74wr4.jpg"
                        alt="头像"
                        onerror="this.outerHTML='🧭'"
                    >
                </div>

                <div class="brand-text">

</aside>



        <main class="main">
            <header class="topbar">
