    <div id="toast-container"></div>

    <script>
        (() => {
            "use strict";

            const API_BASE =
                "https://proxyd.picpi.top/https://shuoce-navigation.2765414002jin.workers.dev";

            const STORAGE_KEY = "shuoce_admin_token";
            const BACKUP_KEY = "shuoce_navigation_backup";
            const THEME_KEY = "shuoce_theme";

            const state = {
                data: null,
                currentCategoryId: null,
                token: sessionStorage.getItem(STORAGE_KEY) || "",
                editingWebsiteIndex: -1,
                editingCategoryId: null,
                selectedWebsites: new Set(),
                searchQuery: "",
                isDirty: false,
                dragSource: null,
                currentTheme: localStorage.getItem(THEME_KEY) || "light"
            };

            const $ = id => document.getElementById(id);

            const dom = {
                categoryList: $("categoryList"),
                categoryCount: $("categoryCount"),
                websiteGrid: $("websiteGrid"),
                searchInput: $("searchInput"),
                clearSearchBtn: $("clearSearchBtn"),
                newTitle: $("newTitle"),
                newUrl: $("newUrl"),
                addWebsiteBtn: $("addWebsiteBtn"),
                addCategorySidebarBtn: $("addCategorySidebarBtn"),
                editCategorySidebarBtn: $("editCategorySidebarBtn"),
                deleteCategorySidebarBtn: $("deleteCategorySidebarBtn"),
                saveBtn: $("saveBtn"),
                clearTokenBtn: $("clearTokenBtn"),
                batchDeleteBtn: $("batchDeleteBtn"),
                batchMoveBtn: $("batchMoveBtn"),
                importBtn: $("importBtn"),
                exportBtn: $("exportBtn"),
                importFile: $("importFile"),
                currentCategoryTitle: $("currentCategoryTitle"),
                currentCategoryMeta: $("currentCategoryMeta"),
                websiteModal: $("websiteModal"),
                editTitle: $("editTitle"),
                editUrl: $("editUrl"),
                editDesc: $("editDesc"),
                saveWebsite: $("saveWebsite"),
                cancelWebsite: $("cancelWebsite"),
                categoryModal: $("categoryModal"),
                editCatTitle: $("editCatTitle"),
                saveCategory: $("saveCategory"),
                cancelCategory: $("cancelCategory"),
                authModal: $("authModal"),
                authToken: $("authToken"),
                confirmAuth: $("confirmAuth"),
                cancelAuth: $("cancelAuth"),
                moveModal: $("moveModal"),
                moveTargetCategory: $("moveTargetCategory"),
                moveCount: $("moveCount"),
                confirmMove: $("confirmMove"),
                cancelMove: $("cancelMove"),
                themeToggleBtn: $("themeToggleBtn"),
                restoreBackupBtn: $("restoreBackupBtn"),
                backupNowBtn: $("backupNowBtn")
            };

            function toast(message, type = "info", duration = 2800) {
                const el = document.createElement("div");
                const icon = {
                    success: "✅",
                    error: "❌",
                    warning: "⚠️",
                    info: "ℹ️"
                };

                el.className = `toast ${type}`;
                el.innerHTML = `
                    <span>${icon[type] || icon.info}</span>
                    <span></span>
                `;

                el.querySelector("span:last-child").textContent = message;
                $("toast-container").appendChild(el);

                setTimeout(() => {
                    el.style.transition = "opacity .4s, transform .4s";
                    el.style.opacity = "0";
                    el.style.transform = "translateX(20px)";

                    setTimeout(() => el.remove(), 400);
                }, duration);
            }

            function debounce(fn, ms = 250) {
                let timer;

                return (...args) => {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn(...args), ms);
                };
            }

            function escapeHtml(value) {
                return String(value ?? "").replace(/[&<>"']/g, char => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char]));
            }

            function slugify(value) {
                return String(value)
                    .toLowerCase()
                    .trim()
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/^-+|-+$/g, "")
                    || `cat-${Date.now()}`;
            }

            function normalizeUrl(value) {
                let url = String(value || "").trim();

                if (!url) return "";

                if (!/^https?:\/\//i.test(url)) {
                    url = "https://" + url;
                }

                return url;
            }

            /*
             * 获取网站真实图标地址。
             *
             * 这里保存的是图片 URL，而不是 bi-globe 之类的图标类名。
             * 后台页面以及后续前台页面都可以直接读取 iconUrl。
             */
            function getFavicon(url, size = 64) {
                try {
                    const normalizedUrl = normalizeUrl(url);

                    if (!normalizedUrl) return "";

                    const hostname = new URL(normalizedUrl).hostname;

                    return (
                        "https://www.google.com/s2/favicons" +
                        `?domain=${encodeURIComponent(hostname)}&sz=${size}`
                    );
                } catch {
                    return "";
                }
            }

            /*
             * 兼容旧数据并自动修复图标。
             *
             * 旧数据中的 icon 可能是：
             * bi-globe
             * globe
             * 🌐
             * 空值
             *
             * 这些都会根据网址自动替换为真实图标 URL。
             */
            function repairWebsiteIcons(data) {
                if (!data || !Array.isArray(data.categories)) {
                    return data;
                }

                data.categories.forEach(category => {
                    if (!Array.isArray(category.cards)) {
                        category.cards = [];
                        return;
                    }

                    category.cards.forEach(card => {
                        if (!card || !card.url) return;

                        const oldIcon = String(card.icon || "").trim();
                        const oldIconUrl = String(card.iconUrl || "").trim();

                        const hasValidIconUrl =
                            /^https?:\/\//i.test(oldIconUrl);

                        const hasValidIconInOldField =
                            /^https?:\/\//i.test(oldIcon);

                        const isDefaultIcon =
                            !oldIcon ||
                            oldIcon === "bi-globe" ||
                            oldIcon === "globe" ||
                            oldIcon === "🌐" ||
                            !hasValidIconInOldField;

                        if (hasValidIconUrl) {
                            card.iconUrl = oldIconUrl;
                            card.icon = oldIconUrl;
                            return;
                        }

                        if (hasValidIconInOldField && !isDefaultIcon) {
                            card.iconUrl = oldIcon;
                            card.icon = oldIcon;
                            return;
                        }

                        const iconUrl = getFavicon(card.url, 64);

                        card.iconUrl = iconUrl;
                        card.icon = iconUrl;
                    });
                });

                return data;
            }

            function getCardKey(card) {
                return card.id || card.url || card.title;
            }

            function getCurrentCategory() {
                return state.data?.categories?.find(
                    category => category.id === state.currentCategoryId
                ) || null;
            }

            function markDirty() {
                state.isDirty = true;
                backupToLocal();
                window.addEventListener("beforeunload", beforeUnload);
            }

            function markClean() {
                state.isDirty = false;
                window.removeEventListener("beforeunload", beforeUnload);
            }

            function beforeUnload(event) {
                if (!state.isDirty) return;

                event.preventDefault();
                event.returnValue = "";
            }

            function backupToLocal() {
                if (!state.data) return;

                try {
                    localStorage.setItem(
                        BACKUP_KEY,
                        JSON.stringify({
                            data: state.data,
                            time: Date.now()
                        })
                    );
                } catch {
                    // 忽略本地存储异常
                }
            }

            function restoreFromLocal() {
                try {
                    const raw = localStorage.getItem(BACKUP_KEY);

                    if (!raw) {
                        toast("没有找到本地备份", "warning");
                        return;
                    }

                    const backup = JSON.parse(raw);

                    if (!backup?.data?.categories) {
                        toast("备份数据格式无效", "error");
                        return;
                    }

                    const time = backup.time
                        ? new Date(backup.time).toLocaleString()
                        : "未知时间";

                    if (!confirm(
                        `确定从本地备份恢复吗？\n` +
                        `备份时间：${time}\n` +
                        `当前未保存的修改将丢失！`
                    )) {
                        return;
                    }

                    repairWebsiteIcons(backup.data);

                    state.data = backup.data;
                    state.currentCategoryId =
                        state.data.categories?.[0]?.id || null;
                    state.selectedWebsites.clear();

                    renderCategories();
                    renderWebsiteGrid();
                    markDirty();

                    toast("已从本地备份恢复", "success");
                } catch (error) {
                    toast("备份恢复失败：" + error.message, "error");
                }
            }

            function applyTheme() {
                document.documentElement.setAttribute(
                    "data-theme",
                    state.currentTheme
                );

                dom.themeToggleBtn.textContent =
                    state.currentTheme === "dark" ? "☀️" : "🌙";

                localStorage.setItem(THEME_KEY, state.currentTheme);
            }

            function toggleTheme() {
                state.currentTheme =
                    state.currentTheme === "dark" ? "light" : "dark";

                applyTheme();

                toast(
                    state.currentTheme === "dark"
                        ? "暗色主题已启用"
                        : "亮色主题已启用",
                    "info",
                    1500
                );
            }

            function openModal(modal) {
                modal.classList.add("open");
            }

            function closeModal(modal) {
                modal.classList.remove("open");
            }

            function renderCategories() {
                const categories = state.data?.categories || [];

                dom.categoryList.innerHTML = "";
                dom.categoryCount.textContent = categories.length;

                if (!categories.length) {
                    dom.categoryList.innerHTML = `
                        <div style="
                            padding:14px;
                            color:var(--sidebar-text);
                            font-size:.8rem;
                            text-align:center;
                            opacity:.6
                        ">
                            暂无分类，点击「新建分类」创建
                        </div>
                    `;
                    return;
                }

                if (
                    !state.currentCategoryId ||
                    !categories.some(
                        category => category.id === state.currentCategoryId
                    )
                ) {
                    state.currentCategoryId = categories[0].id;
                }

                categories.forEach((category, index) => {
                    const item = document.createElement("div");

                    item.className =
                        "category-item" +
                        (
                            category.id === state.currentCategoryId
                                ? " active"
                                : ""
                        );

                    item.draggable = true;
                    item.dataset.index = index;
                    item.dataset.id = category.id;

                    const name = document.createElement("span");
                    name.className = "name";
                    name.textContent = category.title || category.id;

                    const count = document.createElement("span");
                    count.className = "count";
                    count.textContent = (category.cards || []).length;

                    const up = document.createElement("button");
                    up.className = "move-btn";
                    up.textContent = "▲";
                    up.title = "上移";

                    up.addEventListener("click", event => {
                        event.stopPropagation();
                        moveCategory(index, -1);
                    });

                    const down = document.createElement("button");
                    down.className = "move-btn";
                    down.textContent = "▼";
                    down.title = "下移";

                    down.addEventListener("click", event => {
                        event.stopPropagation();
                        moveCategory(index, 1);
                    });

                    item.append(name, count, up, down);

                    item.addEventListener("click", event => {
                        if (event.target.closest(".move-btn")) return;

                        state.currentCategoryId = category.id;
                        state.selectedWebsites.clear();

                        renderCategories();
                        renderWebsiteGrid();
                    });

                    item.addEventListener("dragstart", event => {
                        state.dragSource = item;
                        item.classList.add("dragging");
                        event.dataTransfer.effectAllowed = "move";
                        event.dataTransfer.setData(
                            "text/plain",
                            category.id
                        );
                    });

                    item.addEventListener("dragover", event => {
                        event.preventDefault();

                        const target = event.currentTarget;

                        if (
                            !state.dragSource ||
                            target === state.dragSource
                        ) {
                            return;
                        }

                        const rect = target.getBoundingClientRect();
                        const after =
                            event.clientY >
                            rect.top + rect.height / 2;

                        document
                            .querySelectorAll(".category-item")
                            .forEach(element => {
                                element.style.borderTop = "";
                                element.style.borderBottom = "";
                            });

                        if (after) {
                            target.style.borderBottom =
                                "2px solid var(--primary)";
                        } else {
                            target.style.borderTop =
                                "2px solid var(--primary)";
                        }
                    });

                    item.addEventListener("drop", event => {
                        event.preventDefault();

                        const source = state.dragSource;
                        const target = event.currentTarget;

                        if (!source || source === target) return;

                        const categories = state.data.categories;
                        const sourceId = source.dataset.id;
                        const targetId = target.dataset.id;

                        const fromIndex = categories.findIndex(
                            category => category.id === sourceId
                        );

                        const toIndex = categories.findIndex(
                            category => category.id === targetId
                        );

                        if (fromIndex < 0 || toIndex < 0) return;

                        const rect = target.getBoundingClientRect();
                        const after =
                            event.clientY >
                            rect.top + rect.height / 2;

                        const [moved] = categories.splice(fromIndex, 1);

                        let insertIndex = toIndex;

                        if (after) {
                            insertIndex++;
                        }

                        if (fromIndex < insertIndex) {
                            insertIndex--;
                        }

                        categories.splice(insertIndex, 0, moved);

                        state.dragSource = null;
                        renderCategories();
                        markDirty();

                        toast("分类顺序已更新", "success");
                    });

                    item.addEventListener("dragend", () => {
                        state.dragSource = null;

                        document
                            .querySelectorAll(".category-item")
                            .forEach(element => {
                                element.classList.remove("dragging");
                                element.style.borderTop = "";
                                element.style.borderBottom = "";
                            });
                    });

                    dom.categoryList.appendChild(item);
                });
            }

            function moveCategory(index, direction) {
                const categories = state.data?.categories;

                if (!categories) return;

                const targetIndex = index + direction;

                if (
                    targetIndex < 0 ||
                    targetIndex >= categories.length
                ) {
                    return;
                }

                const [moved] = categories.splice(index, 1);

                categories.splice(targetIndex, 0, moved);

                renderCategories();
                markDirty();

                toast("分类顺序已调整", "success");
            }

            function getSafeIcon(card) {
                const iconUrl =
                    card.iconUrl ||
                    (
                        /^https?:\/\//i.test(card.icon || "")
                            ? card.icon
                            : ""
                    ) ||
                    getFavicon(card.url, 64);

                return iconUrl;
            }

            function renderWebsiteGrid() {
                const category = getCurrentCategory();

                dom.websiteGrid.innerHTML = "";

                if (!state.data) {
                    dom.currentCategoryTitle.textContent = "请先读取导航";
                    dom.currentCategoryMeta.textContent = "";

                    showEmpty("🔐", "请先点击「读取导航」加载数据");
                    return;
                }

                if (!category) {
                    dom.currentCategoryTitle.textContent = "请选择分类";
                    dom.currentCategoryMeta.textContent = "共 0 个网站";

                    showEmpty("🗂️", "在左侧选择一个分类");
                    return;
                }

                if (!Array.isArray(category.cards)) {
                    category.cards = [];
                }

                dom.currentCategoryTitle.textContent =
                    category.title || category.id;

                dom.currentCategoryMeta.textContent =
                    `共 ${category.cards.length} 个网站`;

                const query = state.searchQuery.toLowerCase();

                const cards = category.cards.filter(card => {
                    return (
                        !query ||
                        String(card.title || "")
                            .toLowerCase()
                            .includes(query) ||
                        String(card.url || "")
                            .toLowerCase()
                            .includes(query) ||
                        String(card.description || "")
                            .toLowerCase()
                            .includes(query)
                    );
                });

                if (!cards.length) {
                    showEmpty(
                        query ? "🔍" : "📭",
                        query
                            ? `未找到「${state.searchQuery}」`
                            : "该分类暂无网站，使用下方表单添加"
                    );
                    return;
                }

                cards.forEach(card => {
                    const key = getCardKey(card);
                    const selected = state.selectedWebsites.has(key);
                    const favicon = getSafeIcon(card);

                    const element = document.createElement("div");

                    element.className =
                        "website-card" +
                        (selected ? " selected" : "");

                    element.draggable = !query;
                    element.dataset.cardKey = key;

                    element.innerHTML = `
                        <div class="check">✓</div>

                        <div class="card-favicon">
                            ${
                                favicon
                                    ? `
                                        <img
                                            src="${escapeHtml(favicon)}"
                                            alt="${escapeHtml(card.title || "网站图标")}"
                                        >
                                    `
                                    : "🌐"
                            }
                        </div>

                        <div class="card-title">
                            ${escapeHtml(card.title || "未命名")}
                        </div>

                        <div
                            class="card-url"
                            title="${escapeHtml(card.url || "")}"
                        >
                            ${escapeHtml(card.url || "无地址")}
                        </div>

                        ${
                            card.description
                                ? `
                                    <div class="card-desc">
                                        ${escapeHtml(card.description)}
                                    </div>
                                `
                                : ""
                        }

                        <div class="card-actions">
                            ${
                                !query
                                    ? `
                                        <button
                                            class="btn-outline btn-sm"
                                            data-action="move-up"
                                            title="上移"
                                        >↑</button>
<!---->
                                        <button
                                            class="btn-outline btn-sm"
                                            data-action="move-down"
                                            title="下移"
                                        >↓</button>
                                    `
                                    : ""
                            }
<!---->
                            <button
                                class="btn-outline btn-sm"
                                data-action="copy"
                                title="复制链接"
                            >📋</button>
<!---->
                            <button
                                class="btn-outline btn-sm"
                                data-action="visit"
                                title="在新窗口打开"
                            >↗</button>
<!---->
                            <button
                                class="btn-outline btn-sm"
                                data-action="edit"
                                title="编辑"
                            >✏️</button>
<!---->
                            <button
                                class="btn-danger-soft btn-sm"
                                data-action="delete"
                                title="删除"
                            >🗑️</button>
                        
</div>


                    `;

                    const image = element.querySelector(".card-favicon img");

                    if (image) {
                        image.addEventListener("error", () => {
                            image.parentElement.textContent = "🌐";
                        });
                    }

                    element.querySelector(".check").addEventListener(
                        "click",
                        event => {
                            event.stopPropagation();

                            if (state.selectedWebsites.has(key)) {
                                state.selectedWebsites.delete(key);
                                element.classList.remove("selected");
                            } else {
                                state.selectedWebsites.add(key);
                                element.classList.add("selected");
                            }

                            updateBatchButtons();
                        }
                    );

                    element.addEventListener("click", event => {
                        const action =
                            event.target.closest("[data-action]")
                                ?.dataset.action;

                        if (action === "move-up") {
                            event.stopPropagation();
                            moveWebsite(card, -1);
                            return;
                        }

                        if (action === "move-down") {
                            event.stopPropagation();
                            moveWebsite(card, 1);
                            return;
                        }

                        if (action === "copy") {
                            event.stopPropagation();
                            copyLink(card.url);
                            return;
                        }

                        if (action === "visit") {
                            event.stopPropagation();

                            if (card.url) {
                                window.open(
                                    normalizeUrl(card.url),
                                    "_blank",
                                    "noopener,noreferrer"
                                );
                            }

                            return;
                        }

                        if (action === "edit") {
                            event.stopPropagation();
                            openWebsiteModal(card);
                            return;
                        }

                        if (action === "delete") {
                            event.stopPropagation();
                            deleteWebsite(card);
                            return;
                        }

                        if (
                            event.target === element ||
                            event.target.closest(".card-favicon") ||
                            event.target.closest(".card-title")
                        ) {
                            if (card.url) {
                                window.open(
                                    normalizeUrl(card.url),
                                    "_blank",
                                    "noopener,noreferrer"
                                );
                            }
                        }
                    });

                    if (!query) {
                        element.addEventListener("dragstart", event => {
                            state.dragSource = element;
                            element.classList.add("dragging");
                            event.dataTransfer.effectAllowed = "move";
                            event.dataTransfer.setData(
                                "text/plain",
                                key
                            );
                        });

                        element.addEventListener("dragover", event => {
                            event.preventDefault();

                            const source = state.dragSource;
                            const target = event.currentTarget;

                            if (!source || source === target) return;

                            const rect = target.getBoundingClientRect();
                            const after =
                                event.clientY >
                                    rect.top + rect.height / 2 ||
                                event.clientX >
                                    rect.left + rect.width / 2;

                            if (after) {
                                target.parentNode.insertBefore(
                                    source,
                                    target.nextSibling
                                );
                            } else {
                                target.parentNode.insertBefore(
                                    source,
                                    target
                                );
                            }
                        });

                        element.addEventListener("dragend", () => {
                            const currentCategory = getCurrentCategory();

                            if (!currentCategory || !state.dragSource) {
                                state.dragSource = null;
                                return;
                            }

                            const order = Array.from(
                                dom.websiteGrid.querySelectorAll(
                                    ".website-card"
                                )
                            );

                            const cardMap = new Map(
                                currentCategory.cards.map(item => [
                                    getCardKey(item),
                                    item
                                ])
                            );

                            const newCards = order
                                .map(item => cardMap.get(item.dataset.cardKey))
                                .filter(Boolean);

                            if (
                                newCards.length ===
                                currentCategory.cards.length
                            ) {
                                currentCategory.cards = newCards;
                                markDirty();
                                toast("网站顺序已更新", "success");
                            }

                            state.dragSource = null;
                            element.classList.remove("dragging");
                        });
                    }

                    dom.websiteGrid.appendChild(element);
                });

                updateBatchButtons();
            }

            function showEmpty(emoji, message) {
                dom.websiteGrid.innerHTML = `
                    <div class="empty-state">
                        <span class="emoji">${emoji}</span>
                        ${escapeHtml(message)}
                    </div>
                `;

                updateBatchButtons();
            }

            function updateBatchButtons() {
                const count = state.selectedWebsites.size;

                dom.batchDeleteBtn.style.display =
                    count ? "inline-flex" : "none";

                dom.batchMoveBtn.style.display =
                    count ? "inline-flex" : "none";

                dom.batchDeleteBtn.textContent =
                    `🗑️ 批量删除 (${count})`;

                dom.batchMoveBtn.textContent =
                    `📁 批量移动 (${count})`;
            }

            function moveWebsite(card, direction) {
                const category = getCurrentCategory();

                if (!category) return;

                const cards = category.cards || [];
                const index = cards.indexOf(card);
                const targetIndex = index + direction;

                if (
                    index < 0 ||
                    targetIndex < 0 ||
                    targetIndex >= cards.length
                ) {
                    return;
                }

                const [moved] = cards.splice(index, 1);
                cards.splice(targetIndex, 0, moved);

                renderWebsiteGrid();
                markDirty();

                toast("网站顺序已调整", "success");
            }

            async function copyLink(url) {
                if (!url) {
                    toast("无法复制：无网址", "warning");
                    return;
                }

                try {
                    await navigator.clipboard.writeText(url);
                    toast("链接已复制到剪贴板", "success");
                } catch {
                    const textarea = document.createElement("textarea");

                    textarea.value = url;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand("copy");
                    textarea.remove();

                    toast("链接已复制到剪贴板", "success");
                }
            }

            function addWebsite() {
                const category = getCurrentCategory();

                if (!category) {
                    toast("请先在左侧创建分类", "warning");
                    return;
                }

                let title = dom.newTitle.value.trim();
                let url = dom.newUrl.value.trim();

                if (!url) {
                    toast("请输入网址", "warning");
                    return;
                }

                url = normalizeUrl(url);

                try {
                    new URL(url);
                } catch {
                    toast("网址格式不正确", "warning");
                    return;
                }

                if (!title) {
                    try {
                        title = new URL(url).hostname
                            .replace(/^www\./i, "");
                    } catch {
                        toast("请输入网站名称", "warning");
                        return;
                    }
                }

                if (!Array.isArray(category.cards)) {
                    category.cards = [];
                }

                const exists = category.cards.some(card => {
                    return normalizeUrl(card.url) === url;
                });

                if (exists) {
                    toast("该网址已存在", "warning");
                    return;
                }

                const iconUrl = getFavicon(url, 64);

                category.cards.push({
                    className: "",
                    title,
                    description: "",
                    url,
                    id: "card-" + Date.now(),
                    icon: iconUrl,
                    iconUrl
                });

                dom.newTitle.value = "";
                dom.newUrl.value = "";

                renderWebsiteGrid();
                renderCategories();
                markDirty();

                toast("网站已添加，真实图标已保存", "success");
                dom.newTitle.focus();
            }

            function deleteWebsite(card) {
                const category = getCurrentCategory();

                if (!category) return;

                if (!confirm(`确定删除「${card.title}」吗？`)) {
                    return;
                }

                category.cards = (category.cards || []).filter(
                    item => item !== card
                );

                state.selectedWebsites.delete(getCardKey(card));

                renderWebsiteGrid();
                renderCategories();
                markDirty();

                toast("网站已删除", "success");
            }

            function addCategory() {
                if (!state.data) {
                    toast("请先读取导航", "warning");
                    return;
                }

                const name = prompt("请输入新分类名称");

                if (!name?.trim()) return;

                const title = name.trim();
                const id = slugify(title);

                if (
                    state.data.categories.some(
                        category => category.id === id
                    )
                ) {
                    toast("该分类已存在", "warning");
                    return;
                }

                state.data.categories.push({
                    id,
                    title,
                    cards: []
                });

                state.currentCategoryId = id;

                renderCategories();
                renderWebsiteGrid();
                markDirty();

                toast("分类已创建", "success");
            }

            function openWebsiteModal(card) {
                dom.editTitle.value = card.title || "";
                dom.editUrl.value = card.url || "";
                dom.editDesc.value = card.description || "";

                state.editingWebsiteIndex =
                    (getCurrentCategory()?.cards || []).indexOf(card);

                openModal(dom.websiteModal);

                setTimeout(() => dom.editTitle.focus(), 100);
            }

            function saveWebsiteModal() {
                const category = getCurrentCategory();
                const card = category?.cards?.[state.editingWebsiteIndex];

                if (!card) {
                    closeModal(dom.websiteModal);
                    return;
                }

                const title = dom.editTitle.value.trim();
                const url = normalizeUrl(dom.editUrl.value);
                const description = dom.editDesc.value.trim();

                if (!title) {
                    toast("请输入网站名称", "warning");
                    return;
                }

                try {
                    new URL(url);
                } catch {
                    toast("网址格式不正确", "warning");
                    return;
                }

                const duplicated = (category.cards || []).some(item => {
                    return (
                        item !== card &&
                        normalizeUrl(item.url) === url
                    );
                });

                if (duplicated) {
                    toast("该网址已存在", "warning");
                    return;
                }

                const iconUrl = getFavicon(url, 64);

                card.title = title;
                card.url = url;
                card.description = description;

                // 编辑网址时同步更新真实图标
                card.icon = iconUrl;
                card.iconUrl = iconUrl;

                closeModal(dom.websiteModal);
                renderWebsiteGrid();
                markDirty();

                toast("网站已更新，真实图标已同步", "success");
            }

            function openCategoryModal() {
                const category = getCurrentCategory();

                if (!category) {
                    toast("请选择分类", "warning");
                    return;
                }

                state.editingCategoryId = category.id;
                dom.editCatTitle.value = category.title || "";

                openModal(dom.categoryModal);

                setTimeout(() => dom.editCatTitle.focus(), 100);
            }

            function saveCategoryModal() {
                const category = state.data?.categories?.find(
                    item => item.id === state.editingCategoryId
                );

                if (!category) {
                    closeModal(dom.categoryModal);
                    return;
                }

                const title = dom.editCatTitle.value.trim();

                if (!title) {
                    toast("请输入分类名称", "warning");
                    return;
                }

                const duplicated = state.data.categories.some(item => {
                    return item.id !== category.id &&
                        item.title === title;
                });

                if (duplicated) {
                    toast("已存在同名分类", "warning");
                    return;
                }

                category.title = title;

                closeModal(dom.categoryModal);
                renderCategories();
                renderWebsiteGrid();
                markDirty();

                toast("分类已更新", "success");
            }

            function deleteCategory() {
                const category = getCurrentCategory();

                if (!category) {
                    toast("请选择分类", "warning");
                    return;
                }

                const count = (category.cards || []).length;

                if (!confirm(
                    `确定删除「${category.title}」吗？` +
                    (
                        count
                            ? `\n其下 ${count} 个网站将一并删除！`
                            : ""
                    )
                )) {
                    return;
                }

                state.data.categories =
                    state.data.categories.filter(
                        item => item.id !== category.id
                    );

                state.currentCategoryId =
                    state.data.categories?.[0]?.id || null;

                state.selectedWebsites.clear();

                renderCategories();
                renderWebsiteGrid();
                markDirty();

                toast("分类已删除", "success");
            }

            function openMoveModal() {
                const count = state.selectedWebsites.size;

                if (!count) {
                    toast("请先选择网站", "warning");
                    return;
                }

                dom.moveCount.textContent = count;
                dom.moveTargetCategory.innerHTML =
                    `<option value="">请选择目标分类…</option>`;

                (state.data?.categories || []).forEach(category => {
                    if (category.id === state.currentCategoryId) {
                        return;
                    }

                    const option = document.createElement("option");

                    option.value = category.id;
                    option.textContent =
                        category.title || category.id;

                    dom.moveTargetCategory.appendChild(option);
                });

                if (dom.moveTargetCategory.options.length <= 1) {
                    toast("没有其他分类可移动", "warning");
                    return;
                }

                openModal(dom.moveModal);
            }

            function confirmMoveWebsites() {
                const targetId = dom.moveTargetCategory.value;

                if (!targetId) {
                    toast("请选择目标分类", "warning");
                    return;
                }

                const source = getCurrentCategory();
                const target = state.data?.categories?.find(
                    category => category.id === targetId
                );

                if (!source || !target) {
                    closeModal(dom.moveModal);
                    return;
                }

                const movedCards = (source.cards || []).filter(card => {
                    return state.selectedWebsites.has(getCardKey(card));
                });

                if (!movedCards.length) {
                    closeModal(dom.moveModal);
                    return;
                }

                source.cards = (source.cards || []).filter(card => {
                    return !state.selectedWebsites.has(getCardKey(card));
                });

                target.cards = target.cards || [];
                target.cards.push(...movedCards);

                state.selectedWebsites.clear();

                closeModal(dom.moveModal);
                renderCategories();
                renderWebsiteGrid();
                markDirty();

                toast(
                    `已移动 ${movedCards.length} 个网站到「${target.title}」`,
                    "success"
                );
            }

            function showAuthModal() {
                openModal(dom.authModal);

                setTimeout(() => dom.authToken.focus(), 100);
            }

            async function readNavigation(token) {
                try {
                    toast("正在读取导航…", "info", 1000);

                    const response = await fetch(
                        `${API_BASE}/api/navigation?t=${Date.now()}`,
                        {
                            method: "GET",
                            headers: {
                                Accept: "application/json"
                            },
                            cache: "no-store"
                        }
                    );

                    const text = await response.text();

                    let data;

                    try {
                        data = JSON.parse(text);
                    } catch {
                        throw new Error(
                            `接口未返回 JSON (HTTP ${response.status})`
                        );
                    }

                    if (!response.ok) {
                        throw new Error(
                            data.error ||
                            data.message ||
                            `HTTP ${response.status}`
                        );
                    }

                    if (!data?.categories) {
                        throw new Error("数据格式错误");
                    }

                    // 读取服务器数据后自动修复旧图标
                    repairWebsiteIcons(data);

                    state.data = data;
                    state.token = token;
                    state.currentCategoryId =
                        data.categories?.[0]?.id || null;
                    state.selectedWebsites.clear();

                    sessionStorage.setItem(STORAGE_KEY, token);

                    markClean();
                    backupToLocal();

                    renderCategories();
                    renderWebsiteGrid();

                    closeModal(dom.authModal);

                    toast("导航读取成功", "success");
                } catch (error) {
                    toast(`读取失败：${error.message}`, "error", 5000);

                    if (!state.data) {
                        openModal(dom.authModal);
                    }

                    throw error;
                }
            }

            async function saveData() {
                if (!state.data) {
                    toast("请先读取导航", "warning");
                    return;
                }

                if (!state.token) {
                    toast("身份验证已失效，请重新验证", "warning");
                    showAuthModal();
                    return;
                }

                dom.saveBtn.disabled = true;
                dom.saveBtn.textContent = "⏳ 保存中…";

                try {
                    // 保存前再次修复全部旧图标
                    repairWebsiteIcons(state.data);

                    const response = await fetch(
                        `${API_BASE}/api/admin/navigation`,
                        {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json",
                                Authorization: `Bearer ${state.token}`
                            },
                            body: JSON.stringify(state.data)
                        }
                    );

                    const text = await response.text();

                    let result;

                    try {
                        result = JSON.parse(text);
                    } catch {
                        throw new Error(
                            `接口未返回 JSON (HTTP ${response.status})`
                        );
                    }

                    if (!response.ok) {
                        throw new Error(
                            result.error ||
                            result.message ||
                            `HTTP ${response.status}`
                        );
                    }

                    markClean();
                    backupToLocal();

                    toast("保存成功！所有修改已生效", "success");
                } catch (error) {
                    toast(`保存失败：${error.message}`, "error", 5000);
                } finally {
                    dom.saveBtn.disabled = false;
                    dom.saveBtn.textContent = "💾 保存修改";
                }
            }

            function exportData() {
                if (!state.data) {
                    toast("没有可导出的数据", "warning");
                    return;
                }

                repairWebsiteIcons(state.data);

                const blob = new Blob(
                    [JSON.stringify(state.data, null, 2)],
                    { type: "application/json" }
                );

                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = url;
                link.download =
                    `硕策导航-备份-${new Date().toISOString().slice(0, 10)}.json`;

                document.body.appendChild(link);
                link.click();
                link.remove();

                setTimeout(() => URL.revokeObjectURL(url), 1000);

                toast("已导出 JSON 文件", "success");
            }

            function importData(file) {
                const reader = new FileReader();

                reader.onload = event => {
                    try {
                        const data = JSON.parse(event.target.result);

                        if (!data?.categories) {
                            throw new Error("结构不正确");
                        }

                        if (!confirm("导入将覆盖当前数据，是否继续？")) {
                            return;
                        }

                        // 导入时自动修复真实图标
                        repairWebsiteIcons(data);

                        state.data = data;
                        state.currentCategoryId =
                            data.categories?.[0]?.id || null;
                        state.selectedWebsites.clear();

                        renderCategories();
                        renderWebsiteGrid();
                        markDirty();

                        toast(
                            "导入成功，图标已自动修复，检查后点击保存",
                            "success"
                        );
                    } catch (error) {
                        toast(`导入失败：${error.message}`, "error");
                    }
                };

                reader.readAsText(file);
            }

            function bindEvents() {
                dom.confirmAuth.addEventListener("click", () => {
                    const token = dom.authToken.value.trim();

                    if (!token) {
                        toast("请输入密码", "warning");
                        return;
                    }

                    readNavigation(token).catch(() => {});
                });

                dom.cancelAuth.addEventListener("click", () => {
                    closeModal(dom.authModal);
                });

                dom.authToken.addEventListener("keydown", event => {
                    if (event.key === "Enter") {
                        dom.confirmAuth.click();
                    }
                });

                dom.addWebsiteBtn.addEventListener("click", addWebsite);

                dom.newUrl.addEventListener("keydown", event => {
                    if (event.key === "Enter") {
                        addWebsite();
                    }
                });

                dom.newTitle.addEventListener("keydown", event => {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        dom.newUrl.focus();
                    }
                });

                dom.addCategorySidebarBtn.addEventListener(
                    "click",
                    addCategory
                );

                dom.editCategorySidebarBtn.addEventListener(
                    "click",
                    openCategoryModal
                );

                dom.deleteCategorySidebarBtn.addEventListener(
                    "click",
                    deleteCategory
                );

                dom.saveWebsite.addEventListener(
                    "click",
                    saveWebsiteModal
                );

                dom.cancelWebsite.addEventListener("click", () => {
                    closeModal(dom.websiteModal);
                });

                dom.editUrl.addEventListener("keydown", event => {
                    if (event.key === "Enter") {
                        saveWebsiteModal();
                    }
                });

                dom.saveCategory.addEventListener(
                    "click",
                    saveCategoryModal
                );

                dom.cancelCategory.addEventListener("click", () => {
                    closeModal(dom.categoryModal);
                });

                dom.editCatTitle.addEventListener("keydown", event => {
                    if (event.key === "Enter") {
                        saveCategoryModal();
                    }
                });

                dom.batchDeleteBtn.addEventListener("click", () => {
                    const category = getCurrentCategory();
                    const count = state.selectedWebsites.size;

                    if (!category || !count) return;

                    if (!confirm(`确定删除选中的 ${count} 个网站？`)) {
                        return;
                    }

                    category.cards = (category.cards || []).filter(card => {
                        return !state.selectedWebsites.has(getCardKey(card));
                    });

                    state.selectedWebsites.clear();

                    renderCategories();
                    renderWebsiteGrid();
                    markDirty();

                    toast("已删除选中网站", "success");
                });

                dom.batchMoveBtn.addEventListener(
                    "click",
                    openMoveModal
                );

                dom.confirmMove.addEventListener(
                    "click",
                    confirmMoveWebsites
                );

                dom.cancelMove.addEventListener("click", () => {
                    closeModal(dom.moveModal);
                });

                dom.saveBtn.addEventListener("click", saveData);

                dom.clearTokenBtn.addEventListener("click", () => {
                    state.token = "";
                    sessionStorage.removeItem(STORAGE_KEY);
                    toast(
                        "已清除管理员密码，下次保存需重新验证",
                        "info"
                    );
                });

                dom.importBtn.addEventListener("click", () => {
                    dom.importFile.click();
                });

                dom.importFile.addEventListener("change", event => {
                    const file = event.target.files?.[0];

                    if (file) {
                        importData(file);
                    }

                    event.target.value = "";
                });

                dom.exportBtn.addEventListener("click", exportData);

                dom.themeToggleBtn.addEventListener(
                    "click",
                    toggleTheme
                );

                dom.restoreBackupBtn.addEventListener(
                    "click",
                    restoreFromLocal
                );

                dom.backupNowBtn.addEventListener("click", () => {
                    if (!state.data) {
                        toast("没有可备份的数据", "warning");
                        return;
                    }

                    repairWebsiteIcons(state.data);
                    backupToLocal();

                    toast("已备份到本地", "success");
                });

                dom.searchInput.addEventListener(
                    "input",
                    debounce(event => {
                        state.searchQuery =
                            event.target.value.trim();

                        dom.clearSearchBtn.style.display =
                            state.searchQuery
                                ? "inline-flex"
                                : "none";

                        renderWebsiteGrid();
                    })
                );

                dom.clearSearchBtn.addEventListener("click", () => {
                    dom.searchInput.value = "";
                    state.searchQuery = "";
                    dom.clearSearchBtn.style.display = "none";
                    renderWebsiteGrid();
                });

                [
                    dom.websiteModal,
                    dom.categoryModal,
                    dom.authModal,
                    dom.moveModal
                ].forEach(modal => {
                    modal.addEventListener("mousedown", event => {
                        if (event.target === modal) {
                            closeModal(modal);
                        }
                    });
                });

                document.addEventListener("keydown", event => {
                    if (
                        (event.ctrlKey || event.metaKey) &&
                        event.key.toLowerCase() === "s"
                    ) {
                        event.preventDefault();
                        saveData();
                    }

                    if (
                        (event.ctrlKey || event.metaKey) &&
                        event.key.toLowerCase() === "n"
                    ) {
                        event.preventDefault();
                        addCategory();
                    }

                    if (event.key === "Escape") {
                        [
                            dom.websiteModal,
                            dom.categoryModal,
                            dom.authModal,
                            dom.moveModal
                        ].forEach(closeModal);
                    }
                });

                document
                    .querySelectorAll("input, select")
                    .forEach(element => {
                        element.addEventListener("keydown", event => {
                            if (event.key === "Escape") {
                                event.stopPropagation();
                            }
                        });
                    });
            }

            function init() {
                applyTheme();
                bindEvents();
                renderCategories();
                renderWebsiteGrid();
                updateBatchButtons();

                if (state.token) {
                    readNavigation(state.token).catch(() => {
                        showAuthModal();
                    });

                    return;
                }

                const rawBackup = localStorage.getItem(BACKUP_KEY);

                if (rawBackup) {
                    try {
                        const backup = JSON.parse(rawBackup);

                        if (
                            backup.data?.categories &&
                            confirm(
                                "检测到本地备份数据，是否先载入？\n" +
                                "（也可以点击取消后输入密码在线读取）"
                            )
                        ) {
                            repairWebsiteIcons(backup.data);

                            state.data = backup.data;
                            state.currentCategoryId =
                                backup.data.categories?.[0]?.id || null;

                            renderCategories();
                            renderWebsiteGrid();

                            toast("已载入本地备份", "info");
                            return;
                        }
                    } catch {
                        // 忽略无效备份
                    }
                }

                showAuthModal();
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
