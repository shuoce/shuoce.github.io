
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网站导航管理 · 硕策</title>
<style>
:root {
  --primary:#6366f1; --primary-hover:#4f46e5; --primary-soft:rgba(99,102,241,.1);
  --sidebar-bg:#0f172a; --sidebar-text:#94a3b8; --sidebar-active-bg:rgba(99,102,241,.2); --sidebar-active-text:#fff;
  --main-bg:#f1f5f9; --card-bg:#fff; --card-border:#e2e8f0;
  --text-1:#1e293b; --text-2:#64748b; --text-3:#94a3b8;
  --danger:#ef4444; --success:#10b981;
  --radius:14px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow:0 4px 16px rgba(0,0,0,.08); --shadow-lg:0 12px 32px rgba(0,0,0,.12);
}
* { box-sizing:border-box; margin:0; padding:0 }
body {
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--main-bg); color:var(--text-1); line-height:1.6; min-height:100vh;
}
/* ── 按钮 ── */
button {
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  padding:9px 14px; border-radius:9px; font-size:.83rem; font-weight:500;
  font-family:inherit; cursor:pointer; transition:all .2s; border:1px solid transparent; white-space:nowrap;
}
button:active { transform:scale(.96) }
button:disabled { opacity:.45; cursor:not-allowed }
.btn-primary { background:var(--primary); color:#fff; box-shadow:0 2px 8px rgba(99,102,241,.25) }
.btn-primary:hover:not(:disabled) { background:var(--primary-hover) }
.btn-outline { background:#fff; border-color:var(--card-border); color:var(--text-2); box-shadow:var(--shadow-sm) }
.btn-outline:hover { border-color:#cbd5e1; color:var(--text-1); background:#f8fafc }
.btn-danger-soft { background:#fef2f2; color:#dc2626; border-color:#fecaca }
.btn-danger-soft:hover { background:#fee2e2 }
.btn-sm { padding:5px 10px; font-size:.75rem; border-radius:7px }
.btn-block { width:100% }
/* ── 侧边栏 ── */
.layout { display:flex; min-height:100vh }
.sidebar {
  width:250px; flex-shrink:0; background:var(--sidebar-bg); color:var(--sidebar-text);
  display:flex; flex-direction:column; padding:16px 12px; gap:14px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand { display:flex; align-items:center; gap:10px; padding:2px 6px 10px; border-bottom:1px solid rgba(255,255,255,.08) }
.brand-logo {
  width:42px; height:42px; border-radius:10px; background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(99,102,241,.4);
  flex-shrink:0; overflow:hidden;
}
.brand-avatar { width:100%; height:100%; object-fit:cover; display:block }
.brand-text { font-size:1rem; font-weight:600; color:#fff; line-height:1.3 }
.brand-text small { display:block; font-size:.72rem; font-weight:400; color:var(--sidebar-text); opacity:.7 }
.sidebar-title { font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--sidebar-text); opacity:.7; padding:0 6px }
.category-list { display:flex; flex-direction:column; gap:4px; flex:1; overflow-y:auto }
.category-item {
  display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:9px; cursor:pointer;
  transition:background .15s; border:1px solid transparent; user-select:none; position:relative;
  -webkit-user-select:none;
}
.category-item:hover { background:rgba(255,255,255,.06) }
.category-item.active { background:var(--sidebar-active-bg); border-color:rgba(99,102,241,.4); color:var(--sidebar-active-text) }
.category-item .name { flex:1; font-size:.86rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.category-item .count { font-size:.68rem; background:rgba(255,255,255,.12); padding:2px 7px; border-radius:20px; color:var(--sidebar-text) }
.category-item.active .count { background:rgba(255,255,255,.15); color:#fff }
.category-item .drag { cursor:grab; opacity:.5; font-size:.85rem; transition:opacity .15s; flex-shrink:0 }
.category-item:hover .drag { opacity:1 }
.sidebar-footer { display:flex; gap:8px; border-top:1px solid rgba(255,255,255,.08); padding-top:12px }
.sidebar-footer button { flex:1; background:rgba(255,255,255,.08); color:var(--sidebar-text); border:1px solid rgba(255,255,255,.1); padding:7px }
.sidebar-footer button:hover { background:rgba(255,255,255,.15) }
.sidebar-footer .danger { color:#fecaca }
/* ── 主区域 ── */
.main { flex:1; display:flex; flex-direction:column; min-width:0 }
.topbar {
  display:flex; align-items:center; gap:12px; padding:12px 24px; background:#fff;
  border-bottom:1px solid var(--card-border); position:sticky; top:0; z-index:50;
}
.search-wrap { flex:1; max-width:420px; position:relative }
.search-wrap::before {
  content:"🔍"; position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:.85rem; opacity:.5;
}
.search-wrap input {
  width:100%; padding:9px 12px 9px 34px; border:1px solid var(--card-border); border-radius:9px;
  font-size:.85rem; background:#f8fafc; outline:none; transition:border-color .2s, box-shadow .2s;
}
.search-wrap input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); background:#fff }
.topbar-actions { display:flex; gap:8px; margin-left:auto }
/* ── 内容 ── */
.content { flex:1; padding:24px; display:flex; flex-direction:column; gap:20px; max-width:1200px; width:100%; margin:0 auto }
.page-header { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap }
.page-header h2 { font-size:1.35rem; font-weight:650; color:var(--text-1) }
.page-header .meta { color:var(--text-3); font-size:.8rem; margin-top:2px }
.page-actions { display:flex; gap:8px }
/* ── 卡片网格 ── */
.website-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; align-content:start;
}
.website-card {
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius);
  padding:18px 16px 14px; cursor:pointer; transition:all .25s; position:relative; overflow:hidden;
  box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:8px;
}
.website-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); border-color:#c7d2fe }
.website-card.selected { border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft) }
.website-card.dragging { opacity:.5; transform:scale(.95) }
.card-favicon {
  width:40px; height:40px; border-radius:10px; background:#f1f5f9; display:flex; align-items:center; justify-content:center;
  font-size:18px; margin-bottom:2px; border:1px solid var(--card-border);
}
.card-favicon img { width:22px; height:22px }
.card-title { font-size:.9rem; font-weight:600; color:var(--text-1); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.card-url { font-size:.72rem; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.card-actions { display:flex; gap:4px; justify-content:flex-end; opacity:0; transition:opacity .2s; margin-top:auto }
.website-card:hover .card-actions { opacity:1 }
.website-card .check {
  position:absolute; top:10px; right:10px; width:18px; height:18px; border-radius:5px; border:2px solid var(--card-border);
  background:#fff; transition:all .15s; display:flex; align-items:center; justify-content:center; font-size:11px; color:transparent;
}
.website-card:hover .check { border-color:var(--primary) }
.website-card.selected .check { background:var(--primary); border-color:var(--primary); color:#fff }
.empty-state { grid-column:1/-1; text-align:center; padding:50px 20px; color:var(--text-3); background:#fff; border:2px dashed var(--card-border); border-radius:var(--radius) }
/* ── 快速添加 ── */
.quick-add { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-sm) }
.quick-add h3 { font-size:.9rem; color:var(--text-2); margin-bottom:10px; font-weight:600 }
.quick-form { display:flex; gap:8px; flex-wrap:wrap }
.quick-form input {
  flex:1; min-width:140px; padding:9px 12px; border:1px solid var(--card-border); border-radius:9px;
  font-size:.85rem; background:#f8fafc; outline:none; transition:border-color .2s;
}
.quick-form input:focus { border-color:var(--primary); background:#fff }
/* ── 模态框 ── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(15,23,42,.55); backdrop-filter:blur(3px); z-index:1000;
  display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; visibility:hidden; transition:all .25s;
}
.modal-overlay.open { opacity:1; visibility:visible }
.modal {
  width:100%; max-width:430px; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-lg);
  padding:26px; transform:translateY(12px); transition:transform .25s;
}
.modal-overlay.open .modal { transform:translateY(0) }
.modal h3 { font-size:1.1rem; margin-bottom:16px; display:flex; align-items:center; gap:8px }
.modal label { display:block; font-size:.8rem; font-weight:550; color:var(--text-2); margin:12px 0 6px }
.modal input {
  width:100%; padding:10px 12px; border:1px solid var(--card-border); border-radius:9px;
  font-size:.9rem; outline:none; transition:border-color .2s;
}
.modal input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft) }
.modal .btn-row { display:flex; justify-content:flex-end; gap:8px; margin-top:20px }
/* ── Toast ── */
#toast-container { position:fixed; top:70px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; max-width:360px }
.toast {
  background:#fff; border-left:4px solid var(--primary); border-radius:10px; box-shadow:var(--shadow-lg);
  padding:11px 14px; font-size:.84rem; display:flex; align-items:center; gap:8px; animation:slide .25s;
}
.toast.success { border-left-color:var(--success) }
.toast.error { border-left-color:var(--danger) }
@keyframes slide { from { transform:translateX(30px); opacity:0 } to { transform:translateX(0); opacity:1 } }
/* ── 响应式 ── */
@media (max-width:768px) {
  .layout { flex-direction:column }
  .sidebar { width:100%; height:auto; position:static; flex-direction:column; padding:10px 12px }
  .sidebar-title, .sidebar-footer { display:none }
  .category-list { flex-direction:row; overflow-x:auto; padding-bottom:4px }
  .category-item { flex-shrink:0; padding:7px 12px }
  .category-item .count, .category-item .drag { display:none }
  .topbar { padding:10px 14px; flex-wrap:wrap }
  .search-wrap { order:3; flex-basis:100%; max-width:none }
  .content { padding:14px }
}
</style>
</head>
<body>

<div class="layout">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <img class="brand-avatar" src="https://img.baidu.re/i/2026/08/r74wr4.jpg"
             alt="头像" onerror="this.outerHTML='🧭'">
      </div>

        硕策导航

    </div>
<!---->
    <button id="addCategorySidebarBtn" class="btn-primary btn-block" style="padding:10px">＋ 新建分类</button>

</aside>



  <!-- 主区域 -->
  <main class="main">

</main>

<script>
(() => {
'use strict';

/* ══════════ 配置 ══════════ */
const API_BASE = "https://proxyd.picpi.top/https://shuoce-navigation.2765414002jin.workers.dev";

/* ══════════ 状态 ══════════ */
const state = {
  data: null,
  currentCategoryId: null,
  token: sessionStorage.getItem('admin_token') || '',
  editingWebsiteIndex: -1,
  editingCategoryId: null,
  selectedWebsites: new Set(),
  dragSource: null,
  dragCategorySource: null,
  searchQuery: '',
  isDirty: false
};

/* ══════════ DOM ══════════ */
const $ = id => document.getElementById(id);
const dom = {
  categoryList: $('categoryList'),
  websiteGrid: $('websiteGrid'),
  searchInput: $('searchInput'),
  clearSearchBtn: $('clearSearchBtn'),
  newTitle: $('newTitle'),
  newUrl: $('newUrl'),
  addWebsiteBtn: $('addWebsiteBtn'),
  addCategorySidebarBtn: $('addCategorySidebarBtn'),
  editCategorySidebarBtn: $('editCategorySidebarBtn'),
  deleteCategorySidebarBtn: $('deleteCategorySidebarBtn'),
  saveBtn: $('saveBtn'),
  clearTokenBtn: $('clearTokenBtn'),
  batchDeleteBtn: $('batchDeleteBtn'),
  importBtn: $('importBtn'),
  exportBtn: $('exportBtn'),
  importFile: $('importFile'),
  currentCategoryTitle: $('currentCategoryTitle'),
  currentCategoryMeta: $('currentCategoryMeta'),
  websiteModal: $('websiteModal'), editTitle: $('editTitle'), editUrl: $('editUrl'), editDesc: $('editDesc'),
  saveWebsite: $('saveWebsite'), cancelWebsite: $('cancelWebsite'),
  categoryModal: $('categoryModal'), editCatTitle: $('editCatTitle'),
  saveCategory: $('saveCategory'), cancelCategory: $('cancelCategory'),
  authModal: $('authModal'), authToken: $('authToken'),
  confirmAuth: $('confirmAuth'), cancelAuth: $('cancelAuth')
};

/* ══════════ Toast ══════════ */
function toast(message, type = 'info', duration = 2500) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icon = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };
  el.innerHTML = `<span>${icon[type] || icon.info}</span><span>${message}</span>`;
  $('toast-container').appendChild(el);
  setTimeout(() => el.remove(), duration);
}

/* ══════════ 工具 ══════════ */
const debounce = (fn, ms = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const escapeHtml = s => String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const slugify = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || ('cat-'+Date.now());
const getFavicon = url => { try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=32`; } catch { return null; } };
const getCurrentCategory = () => state.data?.categories?.find(c => c.id === state.currentCategoryId) || null;

function markDirty() {
  state.isDirty = true;
  window.addEventListener('beforeunload', beforeUnload);
}
function markClean() {
  state.isDirty = false;
  window.removeEventListener('beforeunload', beforeUnload);
}
function beforeUnload(e) { if (state.isDirty) { e.preventDefault(); e.returnValue = ''; } }

/* ══════════ 渲染分类 ══════════ */
function renderCategories() {
  const cats = state.data?.categories || [];
  dom.categoryList.innerHTML = '';

  if (!cats.length) {
    dom.categoryList.innerHTML = '<div style="padding:10px;font-size:.8rem;text-align:center">暂无分类</div>';
    return;
  }

  cats.forEach((cat, i) => {
    const el = document.createElement('div');
    el.className = `category-item${cat.id === state.currentCategoryId ? ' active' : ''}`;
    el.dataset.index = i;
    el.draggable = true;

    el.innerHTML = `
      <span class="drag">⠿</span>
      <span class="name">${escapeHtml(cat.title || cat.id)}</span>
      <span class="count">${(cat.cards || []).length}</span>
    `;

    el.addEventListener('click', () => {
      state.currentCategoryId = cat.id;
      state.selectedWebsites.clear();
      renderCategories();
      renderWebsiteGrid();
    });

    // 拖拽分类排序
    el.addEventListener('dragstart', e => {
      state.dragCategorySource = i;
      el.classList.add('dragging');
      // 【关键修复】必须设置 data，否则浏览器不启动拖拽
      e.dataTransfer.setData('text/plain', String(i));
      e.dataTransfer.effectAllowed = 'move';
      e.stopPropagation();
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    el.addEventListener('drop', e => {
      e.preventDefault();
      const target = +el.dataset.index;
      if (state.dragCategorySource === null || state.dragCategorySource === target) return;
      const [moved] = cats.splice(state.dragCategorySource, 1);
      cats.splice(target, 0, moved);
      state.dragCategorySource = null;
      renderCategories();
      markDirty();
      toast('分类顺序已调整', 'success');
    });

    dom.categoryList.appendChild(el);
  });

  if (!state.currentCategoryId && cats.length) state.currentCategoryId = cats[0].id;
}

/* ══════════ 渲染网站 ══════════ */
function renderWebsiteGrid() {
  const cat = getCurrentCategory();
  dom.websiteGrid.innerHTML = '';

  if (!state.data) return showEmpty('请先点击「读取导航」');
  if (!cat) {
    dom.currentCategoryTitle.textContent = '请选择分类';
    dom.currentCategoryMeta.textContent = '共 0 个网站';
    return showEmpty('在左侧选择一个分类');
  }

  dom.currentCategoryTitle.textContent = cat.title || cat.id;
  dom.currentCategoryMeta.textContent = `共 ${(cat.cards || []).length} 个网站`;

  const q = state.searchQuery.toLowerCase();
  const cards = (cat.cards || []).filter(c =>
    !q || (c.title || '').toLowerCase().includes(q) || (c.url || '').toLowerCase().includes(q)
  );

  if (!cards.length) {
    return showEmpty(q ? `未找到「${state.searchQuery}」` : '该分类暂无网站，使用下方表单添加');
  }

  cards.forEach(card => {
    const el = document.createElement('div');
    const key = card.id || card.url || card.title;
    const selected = state.selectedWebsites.has(key);
    const favicon = getFavicon(card.url);
    el.className = `website-card${selected ? ' selected' : ''}`;
    el.draggable = !q;

    el.innerHTML = `
      <div class="check">✓</div>
      <div class="card-favicon">${favicon ? `<img src="${favicon}" onerror="this.remove()">` : '🌐'}</div>
      <div class="card-title">${escapeHtml(card.title || '未命名')}</div>
      <div class="card-url" title="${escapeHtml(card.url || '')}">${escapeHtml(card.url || '无地址')}</div>
      <div class="card-actions">
        <button class="btn-outline btn-sm" data-action="visit">打开</button>
        <button class="btn-outline btn-sm" data-action="edit">编辑</button>
        <button class="btn-danger-soft btn-sm" data-action="delete">删除</button>
      </div>
    `;

    // 选中
    el.querySelector('.check').addEventListener('click', e => {
      e.stopPropagation();
      if (state.selectedWebsites.has(key)) { state.selectedWebsites.delete(key); el.classList.remove('selected'); }
      else { state.selectedWebsites.add(key); el.classList.add('selected'); }
      updateBatchButton();
    });

    // 卡片点击 / 按钮
    el.addEventListener('click', e => {
      const action = e.target.closest('[data-action]')?.dataset.action;
      if (action === 'edit') { e.stopPropagation(); openWebsiteModal(card); }
      else if (action === 'delete') { e.stopPropagation(); deleteWebsite(card); }
      else if (action === 'visit') { e.stopPropagation(); card.url && window.open(card.url, '_blank'); }
      else if (e.target === el || e.target.closest('.card-favicon') || e.target.closest('.card-title')) {
        card.url && window.open(card.url, '_blank');
      }
    });

    // 拖拽排序网站
    if (!q) {
      const originalIndex = cat.cards.indexOf(card);
      el.addEventListener('dragstart', e => {
        state.dragSource = originalIndex;
        el.classList.add('dragging');
        // 【关键修复】必须设置 data
        e.dataTransfer.setData('text/plain', String(originalIndex));
        e.dataTransfer.effectAllowed = 'move';
        e.stopPropagation();
      });
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      el.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
      el.addEventListener('drop', e => {
        e.preventDefault();
        const target = cat.cards.indexOf(card);
        if (state.dragSource === null || state.dragSource === target) return;
        const [moved] = cat.cards.splice(state.dragSource, 1);
        cat.cards.splice(target, 0, moved);
        state.dragSource = null;
        renderWebsiteGrid();
        markDirty();
        toast('网站顺序已调整', 'success');
      });
    }

    dom.websiteGrid.appendChild(el);
  });
}

function showEmpty(msg) {
  dom.websiteGrid.innerHTML = `<div class="empty-state">${msg}</div>`;
}

function updateBatchButton() {
  dom.batchDeleteBtn.style.display = state.selectedWebsites.size ? 'inline-flex' : 'none';
  dom.batchDeleteBtn.textContent = `批量删除 (${state.selectedWebsites.size})`;
}

/* ══════════ 添加 / 删除 ══════════ */
function addWebsite() {
  const title = dom.newTitle.value.trim();
  const url = dom.newUrl.value.trim();
  const cat = getCurrentCategory();
  if (!cat) return toast('请先在左侧创建分类', 'warning');
  if (!title) return toast('请输入网站名称', 'warning');
  if (!url || !/^https?:\/\//i.test(url)) return toast('网址需以 http(s):// 开头', 'warning');

  cat.cards = cat.cards || [];
  cat.cards.push({ className:'', icon:'bi-globe', title, description:'', url, id:'card-'+Date.now() });
  dom.newTitle.value = '';
  dom.newUrl.value = '';
  renderWebsiteGrid();
  markDirty();
  toast('网站已添加', 'success');
}

function deleteWebsite(card) {
  const cat = getCurrentCategory();
  if (!cat) return;
  if (!confirm(`确定删除「${card.title}」吗？`)) return;
  cat.cards = (cat.cards || []).filter(c => c !== card);
  state.selectedWebsites.delete(card.id || card.url || card.title);
  renderWebsiteGrid();
  updateBatchButton();
  markDirty();
  toast('网站已删除', 'success');
}

function addCategory() {
  if (!state.data) return toast('请先读取导航', 'warning');
  const name = prompt('请输入新分类名称');
  if (!name?.trim()) return;
  const id = slugify(name);
  if (state.data.categories.some(c => c.id === id)) return toast('该分类已存在', 'warning');
  state.data.categories.push({ id, title: name.trim(), cards: [] });
  state.currentCategoryId = id;
  renderCategories();
  renderWebsiteGrid();
  markDirty();
  toast('分类已创建', 'success');
}

/* ══════════ 弹窗 ══════════ */
const openModal = m => m.classList.add('open');
const closeModal = m => m.classList.remove('open');

function openWebsiteModal(card) {
  dom.editTitle.value = card.title || '';
  dom.editUrl.value = card.url || '';
  dom.editDesc.value = card.description || '';
  state.editingWebsiteIndex = (getCurrentCategory()?.cards || []).indexOf(card);
  openModal(dom.websiteModal);
  setTimeout(() => dom.editTitle.focus(), 100);
}
function saveWebsiteModal() {
  const cat = getCurrentCategory();
  const card = cat?.cards?.[state.editingWebsiteIndex];
  if (!card) return closeModal(dom.websiteModal);
  const title = dom.editTitle.value.trim();
  const url = dom.editUrl.value.trim();
  if (!title) return toast('请输入网站名称', 'warning');
  if (!url || !/^https?:\/\//i.test(url)) return toast('网址格式不正确', 'warning');
  card.title = title;
  card.url = url;
  card.description = dom.editDesc.value.trim();
  closeModal(dom.websiteModal);
  renderWebsiteGrid();
  markDirty();
  toast('网站已更新', 'success');
}

function openCategoryModal() {
  const cat = getCurrentCategory();
  if (!cat) return toast('请选择分类', 'warning');
  state.editingCategoryId = cat.id;
  dom.editCatTitle.value = cat.title || '';
  openModal(dom.categoryModal);
  setTimeout(() => dom.editCatTitle.focus(), 100);
}
function saveCategoryModal() {
  const cat = state.data?.categories?.find(c => c.id === state.editingCategoryId);
  if (!cat) return closeModal(dom.categoryModal);
  const title = dom.editCatTitle.value.trim();
  if (!title) return toast('请输入分类名称', 'warning');
  if (state.data.categories.some(c => c.id !== cat.id && c.title === title)) return toast('已存在同名分类', 'warning');
  cat.title = title;
  closeModal(dom.categoryModal);
  renderCategories();
  renderWebsiteGrid();
  markDirty();
  toast('分类已更新', 'success');
}
function deleteCategory() {
  const cat = getCurrentCategory();
  if (!cat) return toast('请选择分类', 'warning');
  const n = (cat.cards || []).length;
  if (!confirm(`确定删除「${cat.title}」吗？${n ? `\n其下 ${n} 个网站将一并删除！` : ''}`)) return;
  state.data.categories = state.data.categories.filter(c => c.id !== cat.id);
  state.currentCategoryId = null;
  renderCategories();
  renderWebsiteGrid();
  markDirty();
  toast('分类已删除', 'success');
}

/* ══════════ API ══════════ */
function showAuthModal() {
  if (state.token) readNavigation(state.token);
  else { openModal(dom.authModal); setTimeout(() => dom.authToken.focus(), 100); }
}

async function readNavigation(token) {
  try {
    toast('正在读取导航…', 'info', 1000);
    const res = await fetch(`${API_BASE}/api/navigation?t=${Date.now()}`, {
      method:'GET', headers:{ 'Accept':'application/json' }, cache:'no-store'
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { throw new Error(`接口未返回 JSON (HTTP ${res.status})`); }
    if (!res.ok) throw new Error(data.error || data.message || `HTTP ${res.status}`);
    if (!data?.categories) throw new Error('数据格式错误');

    state.data = data;
    state.token = token;
    sessionStorage.setItem('admin_token', token);
    state.currentCategoryId = data.categories?.[0]?.id || null;
    state.isDirty = false;
    markClean();
    closeModal(dom.authModal);
    renderCategories();
    renderWebsiteGrid();
    toast('导航读取成功', 'success');
  } catch (err) {
    toast(`读取失败：${err.message}`, 'error', 5000);
    if (!state.data) openModal(dom.authModal);
  }
}

async function saveData() {
  if (!state.data) return toast('请先读取导航', 'warning');
  if (!state.token) return toast('身份验证已失效，请重新读取', 'warning');

  dom.saveBtn.disabled = true;
  dom.saveBtn.textContent = '保存中…';
  try {
    const res = await fetch(`${API_BASE}/api/admin/navigation`, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${state.token}` },
      body: JSON.stringify(state.data)
    });
    const text = await res.text();
    let result;
    try { result = JSON.parse(text); } catch { throw new Error(`接口未返回 JSON (HTTP ${res.status})`); }
    if (!res.ok) throw new Error(result.error || result.message || `HTTP ${res.status}`);
    markClean();
    toast('保存成功！所有修改已生效', 'success');
  } catch (err) {
    toast(`保存失败：${err.message}`, 'error', 5000);
  } finally {
    dom.saveBtn.disabled = false;
    dom.saveBtn.textContent = '💾 保存修改';
  }
}

/* ══════════ 导入导出 ══════════ */
function exportData() {
  if (!state.data) return toast('没有可导出的数据', 'warning');
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `navigation-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 JSON', 'success');
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data?.categories) throw new Error('结构不正确');
      if (!confirm('导入将覆盖当前数据，是否继续？')) return;
      state.data = data;
      state.currentCategoryId = data.categories?.[0]?.id || null;
      state.selectedWebsites.clear();
      renderCategories();
      renderWebsiteGrid();
      markDirty();
      toast('导入成功，检查后保存', 'success');
    } catch (err) {
      toast(`导入失败：${err.message}`, 'error');
    }
  };
  reader.readAsText(file);
}

/* ══════════ 事件绑定 ══════════ */
function bindEvents() {
  // 认证弹窗
  dom.confirmAuth.addEventListener('click', () => {
    const token = dom.authToken.value.trim();
    if (!token) return toast('请输入密码', 'warning');
    readNavigation(token);
  });
  dom.cancelAuth.addEventListener('click', () => closeModal(dom.authModal));
  dom.authToken.addEventListener('keydown', e => { if (e.key === 'Enter') dom.confirmAuth.click(); });

  // 添加
  dom.addWebsiteBtn.addEventListener('click', addWebsite);
  dom.newUrl.addEventListener('keydown', e => { if (e.key === 'Enter') addWebsite(); });
  dom.addCategorySidebarBtn.addEventListener('click', addCategory);

  // 分类
  dom.editCategorySidebarBtn.addEventListener('click', openCategoryModal);
  dom.deleteCategorySidebarBtn.addEventListener('click', deleteCategory);

  // 网站弹窗
  dom.saveWebsite.addEventListener('click', saveWebsiteModal);
  dom.cancelWebsite.addEventListener('click', () => closeModal(dom.websiteModal));
  dom.editUrl.addEventListener('keydown', e => { if (e.key === 'Enter') saveWebsiteModal(); });

  // 分类弹窗
  dom.saveCategory.addEventListener('click', saveCategoryModal);
  dom.cancelCategory.addEventListener('click', () => closeModal(dom.categoryModal));
  dom.editCatTitle.addEventListener('keydown', e => { if (e.key === 'Enter') saveCategoryModal(); });

  // 保存 / Token
  dom.saveBtn.addEventListener('click', saveData);
  dom.clearTokenBtn.addEventListener('click', () => {
    state.token = '';
    sessionStorage.removeItem('admin_token');
    toast('已清除管理员密码', 'info');
  });

  // 导入导出
  dom.importBtn.addEventListener('click', () => dom.importFile.click());
  dom.importFile.addEventListener('change', e => e.target.files[0] && importData(e.target.files[0]));
  dom.exportBtn.addEventListener('click', exportData);

  // 搜索
  dom.searchInput.addEventListener('input', debounce(e => {
    state.searchQuery = e.target.value.trim();
    dom.clearSearchBtn.style.display = state.searchQuery ? 'inline-flex' : 'none';
    renderWebsiteGrid();
  }));
  dom.clearSearchBtn.addEventListener('click', () => {
    dom.searchInput.value = '';
    state.searchQuery = '';
    dom.clearSearchBtn.style.display = 'none';
    renderWebsiteGrid();
  });

  // 批量删除
  dom.batchDeleteBtn.addEventListener('click', () => {
    const cat = getCurrentCategory();
    if (!cat || !state.selectedWebsites.size) return;
    if (!confirm(`确定删除选中的 ${state.selectedWebsites.size} 个网站？`)) return;
    cat.cards = (cat.cards || []).filter(c => !state.selectedWebsites.has(c.id || c.url || c.title));
    state.selectedWebsites.clear();
    renderWebsiteGrid();
    updateBatchButton();
    markDirty();
    toast('已删除选中网站', 'success');
  });

  // 遮罩点击关闭
  [dom.websiteModal, dom.categoryModal, dom.authModal].forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) closeModal(m); });
  });

  // 快捷键
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveData(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); addCategory(); }
    if (e.key === 'Escape') [dom.websiteModal, dom.categoryModal, dom.authModal].forEach(closeModal);
  });
}

/* ══════════ 初始化 ══════════ */
window.addEventListener('load', () => {
  bindEvents();
  renderCategories();
  renderWebsiteGrid();
  if (state.token) readNavigation(state.token).catch(() => showAuthModal());
  else showAuthModal();
});

})();
</script>
</body>
