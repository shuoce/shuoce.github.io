    function showEmpty(emoji, message) {
        dom.websiteGrid.innerHTML = `
            <div class="empty-state">
                <div style="font-size:36px;margin-bottom:12px">${emoji}</div>
                <strong>${message}</strong>
                <span>可以使用搜索或下方添加表单</span>
            </div>
        `;

        updateBatchButtons();
    }

    function toggleWebsiteSelection(card, element) {
        const key =
            getCardKey(card);

        if (state.selectedWebsites.has(key)) {
            state.selectedWebsites.delete(key);
            element.classList.remove('selected');
        } else {
            state.selectedWebsites.add(key);
            element.classList.add('selected');
        }

        updateBatchButtons();
    }

    function updateBatchButtons() {
        const count =
            state.selectedWebsites.size;

        const filteredCount =
            getFilteredCards().length;

        const allSelected =
            filteredCount > 0 &&
            getFilteredCards().every(
                card => state.selectedWebsites.has(
                    getCardKey(card)
                )
            );

        dom.batchBar.classList.toggle(
            'show',
            count > 0
        );

        dom.batchInfo.textContent =
            `已选择 ${count} 个网站`;

        dom.selectAllBtn.textContent =
            allSelected ? '□ 取消全选' : '✓ 全选';

        [
            dom.batchFavoriteBtn,
            dom.batchPinBtn,
            dom.batchMoveBtn,
            dom.batchDeleteBtn
        ].forEach(button => {
            button.style.display =
                count ? 'inline-flex' : 'none';
        });

        dom.batchFavoriteBtn.textContent =
            '☆ ' +
            (getSelectedCards().every(card => card.favorite)
                ? '取消收藏'
                : '收藏');

        dom.batchPinBtn.textContent =
            '⚑ ' +
            (getSelectedCards().every(card => card.pinned)
                ? '取消置顶'
                : '置顶');
    }

    function getSelectedCards() {
        const category =
            getCurrentCategory();

        if (!category) {
            return [];
        }

        return (category.cards || []).filter(
            card => state.selectedWebsites.has(
                getCardKey(card)
            )
        );
    }

    function selectAllVisible() {
        const visible =
            getFilteredCards();

        const allSelected =
            visible.length > 0 &&
            visible.every(card =>
                state.selectedWebsites.has(
                    getCardKey(card)
                )
            );

        if (allSelected) {
            visible.forEach(card =>
                state.selectedWebsites.delete(
                    getCardKey(card)
                )
            );
        } else {
            visible.forEach(card =>
                state.selectedWebsites.add(
                    getCardKey(card)
                )
            );
        }

        renderWebsiteGrid();
    }

    function clearSelection() {
        state.selectedWebsites.clear();
        renderWebsiteGrid();
    }

    /*
     * ================================
     * 网站拖拽排序
     * ================================
     */

    function bindWebsiteDrag() {
        if (state.searchQuery) {
            return;
        }

        const cards =
            dom.websiteGrid.querySelectorAll(
                '.website-card'
            );

        cards.forEach(element => {
            element.addEventListener('dragstart', event => {
                state.dragSource = element;
                element.classList.add('dragging');

                event.dataTransfer.effectAllowed =
                    'move';

                event.dataTransfer.setData(
                    'text/plain',
                    element.dataset.cardKey
                );
            });

            element.addEventListener('dragover', event => {
                event.preventDefault();

                const target =
                    event.target.closest('.website-card');

                if (
                    !target ||
                    target === state.dragSource
                ) {
                    return;
                }

                document
                    .querySelectorAll('.website-card')
                    .forEach(item =>
                        item.classList.remove('drag-indicator')
                    );

                target.classList.add('drag-indicator');
            });

            element.addEventListener('dragleave', () => {
                element.classList.remove(
                    'drag-indicator'
                );
            });

            element.addEventListener('drop', event => {
                event.preventDefault();

                const target =
                    event.target.closest('.website-card');

                if (
                    !target ||
                    !state.dragSource ||
                    target === state.dragSource
                ) {
                    return;
                }

                const category =
                    getCurrentCategory();

                if (!category) {
                    return;
                }

                const cards =
                    category.cards || [];

                const sourceKey =
                    state.dragSource.dataset.cardKey;

                const targetKey =
                    target.dataset.cardKey;

                const sourceIndex =
                    cards.findIndex(
                        card => getCardKey(card) === sourceKey
                    );

                const targetIndex =
                    cards.findIndex(
                        card => getCardKey(card) === targetKey
                    );

                if (
                    sourceIndex < 0 ||
                    targetIndex < 0
                ) {
                    return;
                }

                const [moved] =
                    cards.splice(sourceIndex, 1);

                cards.splice(targetIndex, 0, moved);

                state.dragSource = null;

                renderWebsiteGrid();
                markDirty();
                toast('网站顺序已更新', 'success');
            });

            element.addEventListener('dragend', () => {
                state.dragSource = null;

                document
                    .querySelectorAll('.website-card')
                    .forEach(item => {
                        item.classList.remove(
                            'dragging',
                            'drag-indicator'
                        );
                    });
            });
        });
    }

    /*
     * ================================
     * 网站新增、编辑、删除
     * ================================
     */

    function addWebsite() {
        const category =
            getCurrentCategory();

        if (!category) {
            toast('请先创建或选择分类', 'warning');
            return;
        }

        let title =
            dom.newTitle.value.trim();

        let url =
            normalizeUrl(dom.newUrl.value);

        if (!url) {
            toast('请输入网址', 'warning');
            return;
        }

        const hostname =
            getHostname(url);

        if (!hostname) {
            toast('网址格式不正确', 'warning');
            return;
        }

        if (
            (category.cards || []).some(
                card => normalizeUrl(card.url) === url
            )
        ) {
            toast('该网址已存在', 'warning');
            return;
        }

        if (!title) {
            title = hostname;
        }

        category.cards =
            category.cards || [];

        category.cards.push({
            className: '',
            icon: 'bi-globe',
            title,
            description: '',
            url,
            id: `card-${Date.now()}`,
            favorite: false,
            pinned: false
        });

        dom.newTitle.value = '';
        dom.newUrl.value = '';
        dom.sitePreview.classList.remove('show');

        renderCategories();
        renderWebsiteGrid();
        markDirty();

        toast('网站已添加', 'success');
        tryParseWebsiteTitle(url);
    }

    async function tryParseWebsiteTitle(url) {
        if (!TITLE_PARSER_URL) {
            return;
        }

        const category =
            getCurrentCategory();

        if (!category) {
            return;
        }

        const card =
            category.cards[category.cards.length - 1];

        const controller =
            new AbortController();

        const timer =
            setTimeout(
                () => controller.abort(),
                TITLE_PARSER_TIMEOUT
            );

        try {
            const separator =
                TITLE_PARSER_URL.includes('?')
                    ? '&'
                    : '?';

            const response =
                await fetch(
                    `${TITLE_PARSER_URL}${separator}url=${encodeURIComponent(url)}`,
                    {
                        signal: controller.signal,
                        headers: {
                            Accept: 'application/json'
                        }
                    }
                );

            if (!response.ok) {
                return;
            }

            const result =
                await response.json();

            const parsedTitle =
                String(result.title || '').trim();

            if (!parsedTitle) {
                return;
            }

            if (card && card.url === url) {
                card.title = parsedTitle;
                renderCategories();
                renderWebsiteGrid();
                markDirty();
                toast('已自动更新网站标题', 'success');
            }
        } catch {
            // 标题解析失败不影响网站添加
        } finally {
            clearTimeout(timer);
        }
    }

    function openWebsiteModal(card) {
        dom.editTitle.value =
            card.title || '';

        dom.editUrl.value =
            card.url || '';

        dom.editDesc.value =
            card.description || '';

        state.editingWebsite =
            card;

        openModal(dom.websiteModal);

        setTimeout(() => {
            dom.editTitle.focus();
        }, 100);
    }

    function saveWebsiteModal() {
        const category =
            getCurrentCategory();

        const card =
            state.editingWebsite;

        if (!category || !card) {
            closeModal(dom.websiteModal);
            return;
        }

        const title =
            dom.editTitle.value.trim();

        const url =
            normalizeUrl(dom.editUrl.value);

        if (!title) {
            toast('请输入网站名称', 'warning');
            return;
        }

        if (!/^https?:\/\//i.test(url)) {
            toast('网址格式不正确', 'warning');
            return;
        }

        if (
            (category.cards || []).some(
                item =>
                    item !== card &&
                    normalizeUrl(item.url) === url
            )
        ) {
            toast('该网址已存在', 'warning');
            return;
        }

        card.title = title;
        card.url = url;
        card.description =
            dom.editDesc.value.trim();

        closeModal(dom.websiteModal);
        renderCategories();
        renderWebsiteGrid();
        markDirty();

        toast('网站已更新', 'success');
    }

    function deleteWebsite(card) {
        const category =
            getCurrentCategory();

        if (!category) {
            return;
        }

        if (!confirm(
            `确定删除「${card.title}」吗？`
        )) {
            return;
        }

        category.cards =
            (category.cards || []).filter(
                item => item !== card
            );

        state.selectedWebsites.delete(
            getCardKey(card)
        );

        renderCategories();
        renderWebsiteGrid();
        markDirty();

        toast('网站已删除', 'success');
    }

    /*
     * ================================
     * 收藏、置顶、批量操作
     * ================================
     */

    function toggleSelectedProperty(property) {
        const selected =
            getSelectedCards();

        if (!selected.length) {
            return;
        }

        const enabled =
            !selected.every(card => card[property]);

        selected.forEach(card => {
            card[property] = enabled;
        });

        markDirty();
        renderWebsiteGrid();

        toast(
            enabled
                ? `已${property === 'favorite' ? '收藏' : '置顶'}`
                : `已取消${property === 'favorite' ? '收藏' : '置顶'}`,
            'success'
        );
    }

    function batchDelete() {
        const selected =
            getSelectedCards();

        if (!selected.length) {
            return;
        }

        if (!confirm(
            `确定删除选中的 ${selected.length} 个网站吗？`
        )) {
            return;
        }

        const category =
            getCurrentCategory();

        category.cards =
            (category.cards || []).filter(
                card => !state.selectedWebsites.has(
                    getCardKey(card)
                )
            );

        state.selectedWebsites.clear();

        renderCategories();
        renderWebsiteGrid();
        markDirty();

        toast('已删除选中网站', 'success');
    }

    function openMoveModal() {
        const selectedCount =
            state.selectedWebsites.size;

        if (!selectedCount) {
            toast('请先选择网站', 'warning');
            return;
        }

        dom.moveCount.textContent =
            selectedCount;

        dom.moveTargetCategory.innerHTML =
            '<option value="">请选择目标分类…</option>';

        (state.data?.categories || []).forEach(category => {
            if (category.id === state.currentCategoryId) {
                return;
            }

            const option =
                document.createElement('option');

            option.value = category.id;
            option.textContent =
                category.title || category.id;

            dom.moveTargetCategory.appendChild(option);
        });

        if (
            dom.moveTargetCategory.options.length <= 1
        ) {
            toast('没有其他分类可移动', 'warning');
            return;
        }

        openModal(dom.moveModal);
    }

    function confirmMoveWebsites() {
        const targetId =
            dom.moveTargetCategory.value;

        if (!targetId) {
            toast('请选择目标分类', 'warning');
            return;
        }

        const source =
            getCurrentCategory();

        const target =
            state.data?.categories?.find(
                category => category.id === targetId
            );

        if (!source || !target) {
            return;
        }

        const moved =
            (source.cards || []).filter(
                card => state.selectedWebsites.has(
                    getCardKey(card)
                )
            );

        source.cards =
            (source.cards || []).filter(
                card => !state.selectedWebsites.has(
                    getCardKey(card)
                )
            );

        target.cards =
            target.cards || [];

        target.cards.push(...moved);

        state.selectedWebsites.clear();

        closeModal(dom.moveModal);
        renderCategories();
        renderWebsiteGrid();
        markDirty();

        toast(
            `已移动 ${moved.length} 个网站到「${target.title}」`,
            'success'
        );
    }

    /*
     * ================================
     * 搜索、复制、预览
     * ================================
     */

    function updateSitePreview() {
        const url =
            normalizeUrl(dom.newUrl.value);

        const hostname =
            getHostname(url);

        if (!hostname) {
            dom.sitePreview.classList.remove('show');
            return;
        }

        dom.sitePreview.classList.add('show');
        dom.sitePreviewIcon.src =
            getFavicon(url);

        dom.sitePreviewText.textContent =
            `默认标题：${hostname}`;
    }

    async function copyLink(url) {
        if (!url) {
            toast('无法复制：无网址', 'warning');
            return;
        }

        try {
            await navigator.clipboard.writeText(url);
        } catch {
            const textarea =
                document.createElement('textarea');

            textarea.value = url;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            textarea.remove();
        }

        toast('链接已复制到剪贴板', 'success');
    }

    /*
     * ================================
     * API
     * ================================
     */

    function showAuthModal() {
        if (state.token) {
            readNavigation(state.token).catch(() => {
                openModal(dom.authModal);
            });

            return;
        }

        openModal(dom.authModal);

        setTimeout(() => {
            dom.authToken.focus();
        }, 100);
    }

    async function readNavigation(token) {
        try {
            toast('正在读取导航…', 'info', 1000);

            const response =
                await fetch(
                    `${API_BASE}/api/navigation?t=${Date.now()}`,
                    {
                        method: 'GET',
                        headers: {
                            Accept: 'application/json'
                        },
                        cache: 'no-store'
                    }
                );

            const text =
                await response.text();

            let data;

            try {
                data = JSON.parse(text);
            } catch {
                throw new Error(
                    `接口未返回 JSON (HTTP ${response.status})`
                );
            }

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    data.message ||
                    `HTTP ${response.status}`
                );
            }

            state.data =
                normalizeData(data);

            state.token =
                token;

            sessionStorage.setItem(
                STORAGE_KEY,
                token
            );

            state.currentCategoryId =
                state.data.categories[0]?.id || null;

            state.selectedWebsites.clear();

            markClean();
            backupToLocal();

            closeModal(dom.authModal);

            renderCategories();
            renderWebsiteGrid();

            toast('导航读取成功', 'success');
        } catch (error) {
            toast(`读取失败：${error.message}`, 'error', 5000);

            if (!state.data) {
                openModal(dom.authModal);
            }

            throw error;
        }
    }

    async function saveData() {
        if (!state.data) {
            toast('请先读取导航', 'warning');
            return;
        }

        if (!state.token) {
            toast('身份验证已失效，请重新验证', 'warning');
            openModal(dom.authModal);
            return;
        }

        dom.saveBtn.disabled = true;
        dom.saveBtn.textContent = '⏳ 保存中…';

        try {
            const response =
                await fetch(
                    `${API_BASE}/api/admin/navigation`,
                    {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization:
                                `Bearer ${state.token}`
                        },
                        body: JSON.stringify(state.data)
                    }
                );

            const text =
                await response.text();

            let result;

            try {
                result = JSON.parse(text);
            } catch {
                throw new Error(
                    `接口未返回 JSON (HTTP ${response.status})`
                );
            }

            if (!response.ok) {
                throw new Error(
                    result.error ||
                    result.message ||
                    `HTTP ${response.status}`
                );
            }

            markClean();
            backupToLocal();

            toast('保存成功！所有修改已生效', 'success');
        } catch (error) {
            toast(`保存失败：${error.message}`, 'error', 5000);
        } finally {
            dom.saveBtn.disabled = false;
            dom.saveBtn.textContent = '💾 保存修改';
        }
    }

    /*
     * ================================
     * 导入导出
     * ================================
     */

    function exportData() {
        if (!state.data) {
            toast('没有可导出的数据', 'warning');
            return;
        }

        const blob =
            new Blob(
                [JSON.stringify(state.data, null, 2)],
                { type: 'application/json' }
            );

        const link =
            document.createElement('a');

        link.href =
            URL.createObjectURL(blob);

        link.download =
            `硕策导航-备份-${new Date()
                .toISOString()
                .slice(0, 10)}.json`;

        link.click();

        URL.revokeObjectURL(link.href);

        toast('已导出 JSON 文件', 'success');
    }

    function importData(file) {
        const reader =
            new FileReader();

        reader.onload = event => {
            try {
                const data =
                    normalizeData(
                        JSON.parse(event.target.result)
                    );

                if (!confirm(
                    '导入将覆盖当前数据，是否继续？'
                )) {
                    return;
                }

                state.data = data;
                state.currentCategoryId =
                    data.categories[0]?.id || null;

                state.selectedWebsites.clear();

                renderCategories();
                renderWebsiteGrid();
                markDirty();

                toast(
                    '导入成功，请检查后点击保存',
                    'success'
                );
            } catch (error) {
                toast(
                    `导入失败：${error.message}`,
                    'error'
                );
            }
        };

        reader.readAsText(file);
    }

    /*
     * ================================
     * 弹窗
     * ================================
     */

    function openModal(modal) {
        modal.classList.add('open');
    }

    function closeModal(modal) {
        modal.classList.remove('open');
    }

    /*
     * ================================
     * 事件绑定
     * ================================
     */

    function bindEvents() {
        dom.addCategorySidebarBtn.addEventListener(
            'click',
            addCategory
        );

        dom.editCategorySidebarBtn.addEventListener(
            'click',
            editCategory
        );

        dom.deleteCategorySidebarBtn.addEventListener(
            'click',
            deleteCategory
        );

        dom.saveCategory.addEventListener(
            'click',
            saveCategoryModal
        );

        dom.saveWebsite.addEventListener(
            'click',
            saveWebsiteModal
        );

        dom.addWebsiteBtn.addEventListener(
            'click',
            addWebsite
        );

        dom.newUrl.addEventListener(
            'input',
            updateSitePreview
        );

        dom.newUrl.addEventListener(
            'keydown',
            event => {
                if (event.key === 'Enter') {
                    addWebsite();
                }
            }
        );

        dom.newTitle.addEventListener(
            'keydown',
            event => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    dom.newUrl.focus();
                }
            }
        );

        dom.confirmAuth.addEventListener(
            'click',
            () => {
                const token =
                    dom.authToken.value.trim();

                if (!token) {
                    toast('请输入密码', 'warning');
                    return;
                }

                readNavigation(token).catch(() => {});
            }
        );

        dom.authToken.addEventListener(
            'keydown',
            event => {
                if (event.key === 'Enter') {
                    dom.confirmAuth.click();
                }
            }
        );

        dom.batchFavoriteBtn.addEventListener(
            'click',
            () => toggleSelectedProperty('favorite')
        );

        dom.batchPinBtn.addEventListener(
            'click',
            () => toggleSelectedProperty('pinned')
        );

        dom.batchDeleteBtn.addEventListener(
            'click',
            batchDelete
        );

        dom.batchMoveBtn.addEventListener(
            'click',
            openMoveModal
        );

        dom.confirmMove.addEventListener(
            'click',
            confirmMoveWebsites
        );

        dom.selectAllBtn.addEventListener(
            'click',
            selectAllVisible
        );

        dom.clearSelectionBtn.addEventListener(
            'click',
            clearSelection
        );

        dom.saveBtn.addEventListener(
            'click',
            saveData
        );

        dom.themeToggleBtn.addEventListener(
            'click',
            toggleTheme
        );

        dom.sidebarToggleBtn.addEventListener(
            'click',
            toggleSidebar
        );

        dom.mobileMenuBtn.addEventListener(
            'click',
            () => toggleMobileSidebar(true)
        );

        dom.mobileMask.addEventListener(
            'click',
            () => toggleMobileSidebar(false)
        );

        dom.gridViewBtn.addEventListener(
            'click',
            () => changeViewMode('grid')
        );

        dom.listViewBtn.addEventListener(
            'click',
            () => changeViewMode('list')
        );

        dom.collapseCategoryBtn.addEventListener(
            'click',
            () => {
                state.categoryCollapsed =
                    !state.categoryCollapsed;

                localStorage.setItem(
                    CATEGORY_COLLAPSED_KEY,
                    String(state.categoryCollapsed)
                );

                renderCategories();
            }
        );

        dom.clearTokenBtn.addEventListener(
            'click',
            () => {
                state.token = '';
                sessionStorage.removeItem(STORAGE_KEY);
                toast(
                    '已清除管理员密码，下次保存需重新验证',
                    'info'
                );
            }
        );

        dom.importBtn.addEventListener(
            'click',
            () => dom.importFile.click()
        );

        dom.importFile.addEventListener(
            'change',
            event => {
                if (event.target.files[0]) {
                    importData(event.target.files[0]);
                }

                event.target.value = '';
            }
        );

        dom.exportBtn.addEventListener(
            'click',
            exportData
        );

        dom.restoreBackupBtn.addEventListener(
            'click',
            restoreFromLocal
        );

        dom.backupNowBtn.addEventListener(
            'click',
            () => {
                if (!state.data) {
                    toast('没有可备份的数据', 'warning');
                    return;
                }

                backupToLocal();
                toast('已备份到本地', 'success');
            }
        );

        dom.searchInput.addEventListener(
            'input',
            debounce(event => {
                state.searchQuery =
                    event.target.value.trim();

                dom.clearSearchBtn.style.display =
                    state.searchQuery
                        ? 'inline-flex'
                        : 'none';

                renderWebsiteGrid();
            })
        );

        dom.clearSearchBtn.addEventListener(
            'click',
            () => {
                dom.searchInput.value = '';
                state.searchQuery = '';
                dom.clearSearchBtn.style.display =
                    'none';

                renderWebsiteGrid();
            }
        );

        [
            dom.websiteModal,
            dom.categoryModal,
            dom.authModal,
            dom.moveModal
        ].forEach(modal => {
            modal.addEventListener(
                'mousedown',
                event => {
                    if (event.target === modal) {
                        closeModal(modal);
                    }
                }
            );
        });

        document.querySelectorAll(
            '[data-close]'
        ).forEach(button => {
            button.addEventListener(
                'click',
                () => {
                    const modal =
                        $(button.dataset.close);

                    if (modal) {
                        closeModal(modal);
                    }
                }
            );
        });

        dom.editUrl.addEventListener(
            'keydown',
            event => {
                if (event.key === 'Enter') {
                    saveWebsiteModal();
                }
            }
        );

        dom.editCatTitle.addEventListener(
            'keydown',
            event => {
                if (event.key === 'Enter') {
                    saveCategoryModal();
                }
            }
        );

        document.addEventListener(
            'keydown',
            event => {
                const tag =
                    document.activeElement?.tagName;

                const isTyping =
                    ['INPUT', 'TEXTAREA', 'SELECT']
                        .includes(tag);

                if (
                    event.key === '/' &&
                    !isTyping
                ) {
                    event.preventDefault();
                    dom.searchInput.focus();
                }

                if (
                    (event.ctrlKey || event.metaKey) &&
                    event.key.toLowerCase() === 'k'
                ) {
                    event.preventDefault();
                    dom.searchInput.focus();
                }

                if (
                    event.key === 'Escape'
                ) {
                    [
                        dom.websiteModal,
                        dom.categoryModal,
                        dom.authModal,
                        dom.moveModal
                    ].forEach(closeModal);
                }

                if (
                    (event.ctrlKey || event.metaKey) &&
                    event.key.toLowerCase() === 's'
                ) {
                    event.preventDefault();
                    saveData();
                }

                if (
                    (event.ctrlKey || event.metaKey) &&
                    event.key.toLowerCase() === 'n'
                ) {
                    event.preventDefault();
                    addCategory();
                }
            }
        );
    }

    /*
     * ================================
     * 初始化
     * ================================
     */

    function init() {
        applyTheme();
        applySidebarState();
        applyViewMode();
        bindEvents();

        renderCategories();
        renderWebsiteGrid();
        updateBatchButtons();

        if (state.token) {
            readNavigation(state.token)
                .catch(() => showAuthModal());

            return;
        }

        const raw =
            localStorage.getItem(BACKUP_KEY);

        if (raw) {
            try {
                const backup =
                    JSON.parse(raw);

                if (
                    backup?.data?.categories &&
                    confirm(
                        '检测到本地备份数据，是否先载入？\n' +
                        '点击取消后可以在线读取导航。'
                    )
                ) {
                    state.data =
                        normalizeData(backup.data);

                    state.currentCategoryId =
                        state.data.categories[0]?.id ||
                        null;

                    renderCategories();
                    renderWebsiteGrid();

                    toast(
                        '已载入本地备份',
                        'info'
                    );

                    return;
                }
            } catch {
                // 忽略损坏的本地备份
            }
        }

        showAuthModal();
    }

    if (
        document.readyState === 'loading'
    ) {
        document.addEventListener(
            'DOMContentLoaded',
            init
        );
    } else {
        init();
    }
})();
</script>
</body>
</html>
