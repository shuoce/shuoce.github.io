<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网站导航管理 · 硕策</title>
<style>
:root {
  --bg: #0a0e1a;
  --card: rgba(16,24,48,.72);
  --card-hover: rgba(22,34,64,.9);
  --border: rgba(100,140,255,.18);
  --border-strong: rgba(100,160,255,.4);
  --text: #e8eefc;
  --text-2: #8b9dc3;
  --text-3: #5a6f96;
  --accent: #4d8cff;
  --accent-2: #6ba3ff;
  --accent-soft: rgba(77,140,255,.14);
  --danger: #ff4d6a;
  --danger-soft: rgba(255,77,106,.12);
  --success: #3dd68c;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 8px 32px rgba(0,0,0,.35);
  --font: "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --transition: .2s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);
  background-image:
    radial-gradient(ellipse 80% 50% at 20% -10%,rgba(60,100,220,.18),transparent),
    radial-gradient(ellipse 60% 40% at 90% 10%,rgba(80,60,200,.12),transparent);
  line-height:1.6;display:flex;flex-direction:column;
}
/* ── 顶部导航 ── */
.app-header{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;
  padding:14px 20px;background:rgba(10,14,26,.85);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.logo{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#4d8cff,#7b5cff);font-size:20px;box-shadow:0 4px 14px rgba(77,140,255,.35);
}
.header-title{flex:1;min-width:0}
.header-title h1{font-size:1.2rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-title p{font-size:.75rem;color:var(--text-3)}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
/* ── 按钮 ── */
button{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 15px;border:none;border-radius:var(--radius-sm);font-size:.85rem;font-weight:550;
  font-family:inherit;cursor:pointer;transition:background .2s,transform .15s,box-shadow .2s,opacity .2s;
  white-space:nowrap;background:rgba(100,120,180,.25);color:var(--text);border:1px solid var(--border);
}
button:hover:not(:disabled){background:rgba(100,140,220,.35);border-color:var(--border-strong)}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#4d8cff,#5b6cff);color:#fff;border:none;box-shadow:0 4px 14px rgba(77,140,255,.3)}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,#6ba3ff,#7b7cff);box-shadow:0 6px 18px rgba(77,140,255,.4)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border-color:rgba(255,77,106,.3)}
.btn-danger:hover:not(:disabled){background:rgba(255,77,106,.22);border-color:rgba(255,77,106,.5)}
.btn-success{background:rgba(61,214,140,.12);color:var(--success);border-color:rgba(61,214,140,.3)}
.btn-success:hover:not(:disabled){background:rgba(61,214,140,.2)}
.btn-sm{padding:5px 9px;font-size:.75rem}
/* ── 布局容器 ── */
.app-main{flex:1;display:flex;min-height:0;max-width:1200px;margin:0 auto;width:100%}
/* ── 侧边栏 ── */
.sidebar{
  width:260px;flex-shrink:0;padding:16px 10px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:10px;
}
.sidebar-title{font-size:.85rem;color:var(--text-3);padding:0 8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.sidebar-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:4px}
.sidebar-item{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;cursor:pointer;
  transition:background .2s;border:1px solid transparent;user-select:none;
}
.sidebar-item:hover{background:rgba(100,140,255,.08)}
.sidebar-item.active{background:var(--accent-soft);border-color:var(--border-strong)}
.sidebar-item.dragging{opacity:.5}
.sidebar-item .name{flex:1;font-size:.88rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-item .badge{font-size:.7rem;color:var(--text-3);background:rgba(100,140,255,.1);padding:2px 8px;border-radius:20px}
.sidebar-item .handle{cursor:grab;color:var(--text-3);font-size:.9rem;opacity:0;transition:opacity .2s}
.sidebar-item:hover .handle{opacity:1}
/* ── 主内容 ── */
.content{flex:1;padding:20px;min-width:0;display:flex;flex-direction:column;gap:16px}
/* 搜索/操作行 */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search-box{flex:1;min-width:200px;position:relative}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--text-3)}
.search-box input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border);border-radius:var(--radius-sm);background:rgba(8,12,28,.55);color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* 网站卡片网格 */
.website-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;align-content:start;overflow-y:auto}
.website-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 14px;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;
  backdrop-filter:blur(8px);
}
.website-card:hover{
  border-color:var(--border-strong);transform:translateY(-3px);box-shadow:var(--shadow);background:var(--card-hover);
}
.website-card.dragging{opacity:.5;transform:scale(.95)}
.website-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.website-card .favicon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:20px}
.website-card .favicon img{width:24px;height:24px}
.website-card .title{font-size:.9rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.website-card .url{font-size:.72rem;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:break-all}
.website-card .actions{display:flex;gap:4px;justify-content:flex-end;opacity:0;transition:opacity .2s}
.website-card:hover .actions{opacity:1}
.website-card .checkbox{
  position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:5px;border:2px solid var(--border-strong);
  background:transparent;cursor:pointer;transition:all .2s;opacity:0;display:flex;align-items:center;justify-content:center;
}
.website-card:hover .checkbox,.website-card.selected .checkbox{opacity:1}
.website-card.selected .checkbox{background:var(--accent);border-color:var(--accent)}
.website-card.selected .checkbox::after{content:"✓";color:#fff;font-size:11px;font-weight:700}
.empty-state{
  grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-3);font-size:.9rem;
  border:2px dashed var(--border);border-radius:var(--radius);
}
/* ── 表单卡片 ── */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.form-card .form-title{font-size:.9rem;font-weight:600;display:flex;align-items:center;gap:6px}
.form-grid{display:flex;gap:10px;flex-wrap:wrap}
.form-grid input{flex:1;min-width:120px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:rgba(8,12,28,.55);color:var(--text);font-size:.85rem;font-family:inherit;outline:none;transition:border-color .2s}
.form-grid input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* ── 模态框 ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,8,20,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;
}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{
  width:100%;max-width:440px;background:#10182e;border:1px solid var(--border-strong);border-radius:var(--radius);
  padding:24px 22px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:translateY(20px) scale(.97);transition:transform .25s;
}
.modal-overlay.open .modal{transform:translateY(0) scale(1)}
.modal h3{font-size:1.1rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal label{display:block;font-size:.8rem;font-weight:550;color:var(--text-2);margin:12px 0 6px}
.modal input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:rgba(8,12,28,.55);color:var(--text);font-size:.9rem;font-family:inherit;outline:none}
.modal input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.modal .btn-row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
/* ── Toast ── */
#toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{
  background:#141c36;border:1px solid var(--border-strong);border-radius:10px;padding:12px 16px;font-size:.85rem;
  box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px;animation:toastIn .3s cubic-bezier(.4,0,.2,1);
  border-left:3px solid var(--accent);
}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:#f0b032}
@keyframes toastIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.leaving{animation:toastOut .3s forwards}
@keyframes toastOut{to{transform:translateX(30px);opacity:0}}
/* ── 保存栏 ── */
.save-bar{
  position:sticky;bottom:12px;margin:0 auto;max-width:760px;width:calc(100% - 40px);padding:12px 16px;
  background:rgba(12,18,40,.94);backdrop-filter:blur(12px);border:1px solid var(--border-strong);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -4px 24px rgba(0,0,0,.35);z-index:99;
}
.save-bar .unsaved-dot{width:8px;height:8px;border-radius:50%;background:#f0b032;display:inline-block;margin-right:6px}
/* ── 响应式 ── */
@media (max-width:768px){
  .app-main{flex-direction:column}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:none}
  .sidebar-list{flex-direction:row;overflow-x:auto}
  .sidebar-item{white-space:nowrap}
  .sidebar-item .badge{display:none}
  .content{padding:12px}
  .website-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .header-actions .btn span.hide-mobile{display:none}
  .save-bar{flex-direction:column;align-items:stretch;text-align:center}
  .save-bar .hint{font-size:.75rem}
}
/* 滚动条 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(100,140,255,.25);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(100,140,255,.4)}
</style>
</head>
<body>

<!-- 顶部 -->
<header class="app-header">
  <div class="logo">🧭</div>
  <div class="header-title">
    <h1>网站导航管理</h1>
    <p>硕策 · SHUOCE Admin</p>
  </div>
  <div class="header-actions">
    <button id="importBtn" title="导入 JSON 文件">📥<span class="hide-mobile">导入</span></button>
    <button id="exportBtn" title="导出 JSON 文件">📤<span class="hide-mobile">导出</span></button>
    <input type="file" id="importFile" accept=".json" hidden>
    <button id="addCategoryBtn" class="btn-primary" title="添加快捷键：N">＋<span class="hide-mobile">新建分类</span></button>
  </div>
</header>

<!-- 主布局 -->
<div class="app-main">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-title">
      <span>分类</span>
      <span id="catCount" style="font-size:.75rem">0</span>
    </div>
    <div id="categoryList" class="sidebar-list"></div>
    <div style="display:flex;gap:8px">
      <button id="editCatBtn" class="btn-sm" style="flex:1">✏️ 改名</button>
      <button id="deleteCatBtn" class="btn-sm btn-danger" style="flex:1">🗑️ 删除</button>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="content">
    <div class="toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input id="searchInput" type="text" placeholder="搜索网站标题 / 地址...">
      </div>
      <button id="batchDeleteBtn" class="btn-sm btn-danger" style="display:none">批量删除</button>
      <button id="clearSearchBtn" class="btn-sm" style="display:none">✕</button>
    </div>
<!---->
    <div id="websiteGrid" class="website-grid"></div>
<!---->
    <!-- 快速添加 -->
    <div class="form-card">
      <div class="form-title">➕ 快速添加网站</div>
      <div class="form-grid">
        <input id="newTitle" placeholder="网站名称" maxlength="30">
        <input id="newUrl" type="url" placeholder="https://...">
        <button id="addWebsiteBtn" class="btn-primary">添加</button>
      </div>
    </div>
  
</main>


</div>

<!-- 保存栏 -->
<div class="save-bar">
  <span class="hint"><span id="unsavedDot" class="unsaved-dot" style="display:none"></span><span id="saveHint">无未保存修改</span></span>
  <div style="display:flex;gap:8px;align-items:center">
    <button id="clearTokenBtn" class="btn-sm" title="清除已保存的管理密码">🔑 清除密码</button>
    <button id="saveBtn" class="btn-primary">保存全部修改</button>
  </div>
</div>

<!-- 编辑网站模态框 -->
<div id="websiteModal" class="modal-overlay">
  <div class="modal">
    <h3>✏️ 编辑网站</h3>
    <label for="editTitle">网站名称</label>
    <input id="editTitle" placeholder="网站名称" maxlength="30">
    <label for="editUrl">网站地址</label>
    <input id="editUrl" type="url" placeholder="https://...">
    <label for="editDesc">网站描述（可选）</label>
    <input id="editDesc" placeholder="一句话描述">
    <div class="btn-row">
      <button id="cancelWebsite" class="btn-secondary">取消</button>
      <button id="saveWebsite" class="btn-primary">保存</button>
    </div>
  </div>
</div>

<!-- 编辑分类模态框 -->
<div id="categoryModal" class="modal-overlay">
  <div class="modal">
    <h3>✏️ 编辑分类</h3>
    <label for="editCatTitle">分类名称</label>
    <input id="editCatTitle" placeholder="分类名称" maxlength="20">
    <div class="btn-row">
      <button id="cancelCategory" class="btn-secondary">取消</button>
      <button id="saveCategory" class="btn-primary">保存</button>
    </div>
  </div>
</div>

<!-- 密码模态框 -->
<div id="authModal" class="modal-overlay">
  <div class="modal">
    <h3>🔑 身份验证</h3>
    <p style="font-size:.85rem;color:var(--text-2);margin-bottom:12px">输入管理员密码后即可读取当前导航配置</p>
    <label for="authToken">管理员密码</label>
    <input id="authToken" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password">
    <div class="btn-row">
      <button id="cancelAuth" class="btn-secondary">取消</button>
      <button id="confirmAuth" class="btn-primary">读取导航</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
(() => {
'use strict';

/* ══════════ 配置 ══════════ */
const API_BASE = "https://proxyd.picpi.top/https://shuoce-navigation.2765414002jin.workers.dev";

/* ══════════ 状态管理 ══════════ */
const state = {
  data: null,
  currentCategoryId: null,
  token: sessionStorage.getItem('admin_token') || '',
  editingWebsiteIndex: -1,
  editingCategoryId: null,
  selectedWebsites: new Set(),
  dragSource: null,
  dragCategorySource: null,
  searchQuery: '',
  isDirty: false
};

/* ══════════ DOM 引用 ══════════ */
const $ = id => document.getElementById(id);
const dom = {
  categoryList: $('categoryList'), catCount: $('catCount'),
  websiteGrid: $('websiteGrid'), searchInput: $('searchInput'),
  newTitle: $('newTitle'), newUrl: $('newUrl'),
  addWebsiteBtn: $('addWebsiteBtn'), addCategoryBtn: $('addCategoryBtn'),
  editCatBtn: $('editCatBtn'), deleteCatBtn: $('deleteCatBtn'),
  saveBtn: $('saveBtn'), saveHint: $('saveHint'), unsavedDot: $('unsavedDot'),
  clearTokenBtn: $('clearTokenBtn'), batchDeleteBtn: $('batchDeleteBtn'), clearSearchBtn: $('clearSearchBtn'),
  importBtn: $('importBtn'), exportBtn: $('exportBtn'), importFile: $('importFile'),
  // 编辑网站弹窗
  websiteModal: $('websiteModal'), editTitle: $('editTitle'), editUrl: $('editUrl'), editDesc: $('editDesc'),
  saveWebsite: $('saveWebsite'), cancelWebsite: $('cancelWebsite'),
  // 编辑分类弹窗
  categoryModal: $('categoryModal'), editCatTitle: $('editCatTitle'),
  saveCategory: $('saveCategory'), cancelCategory: $('cancelCategory'),
  // 认证弹窗
  authModal: $('authModal'), authToken: $('authToken'), confirmAuth: $('confirmAuth'), cancelAuth: $('cancelAuth')
};

/* ══════════ Toast 通知 ══════════ */
function toast(message, type = 'info', duration = 2500) {
  const container = $('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  el.innerHTML = `<span style="font-size:1rem">${icons[type] || icons.info}</span><span>${message}</span>`;
  container.appendChild(el);
  requestAnimationFrame(() => {
    setTimeout(() => {
      el.classList.add('leaving');
      el.addEventListener('animationend', () => el.remove());
    }, duration);
  });
}

/* ══════════ 工具函数 ══════════ */
const debounce = (fn, ms = 300) => {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
};
const escapeHtml = str => String(str || '').replace(/[&<>"']/g, m => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[m]));
const slugify = str => str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || ('cat-' + Date.now());
const getFavicon = url => {
  try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=32`; }
  catch { return null; }
};

function getCurrentCategory() {
  if (!state.data?.categories?.length) return null;
  return state.data.categories.find(c => c.id === state.currentCategoryId) || null;
}

/* ══════════ 标记脏状态 ══════════ */
function markDirty() {
  state.isDirty = true;
  dom.unsavedDot.style.display = 'inline-block';
  dom.saveHint.textContent = '有未保存的修改';
  window.addEventListener('beforeunload', beforeUnloadHandler);
}
function markClean() {
  state.isDirty = false;
  dom.unsavedDot.style.display = 'none';
  dom.saveHint.textContent = '无未保存修改';
  window.removeEventListener('beforeunload', beforeUnloadHandler);
}
function beforeUnloadHandler(e) {
  if (state.isDirty) { e.preventDefault(); e.returnValue = ''; }
}

/* ══════════ 渲染：分类侧边栏 ══════════ */
function renderCategories() {
  const cats = state.data?.categories || [];
  dom.catCount.textContent = cats.length;
  dom.categoryList.innerHTML = '';

  if (!cats.length) {
    dom.categoryList.innerHTML = '<div class="empty-state" style="padding:20px;font-size:.8rem">暂无分类<br>点击上方「新建分类」</div>';
    return;
  }

  cats.forEach((cat, i) => {
    const item = document.createElement('div');
    item.className = `sidebar-item${cat.id === state.currentCategoryId ? ' active' : ''}`;
    item.draggable = true;
    item.dataset.index = i;

    const handle = document.createElement('span');
    handle.className = 'handle';
    handle.textContent = '⠿';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = cat.title || cat.id;

    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = (cat.cards || []).length;

    item.appendChild(handle);
    item.appendChild(name);
    item.appendChild(badge);

    item.addEventListener('click', () => {
      state.currentCategoryId = cat.id;
      state.selectedWebsites.clear();
      renderCategories();
      renderWebsiteGrid();
    });

    // 拖拽排序
    item.addEventListener('dragstart', e => {
      state.dragCategorySource = i;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.stopPropagation();
    });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    item.addEventListener('dragover', e => e.preventDefault());
    item.addEventListener('drop', e => {
      e.preventDefault();
      const target = parseInt(item.dataset.index, 10);
      if (state.dragCategorySource === null || state.dragCategorySource === target) return;
      const [moved] = cats.splice(state.dragCategorySource, 1);
      cats.splice(target, 0, moved);
      state.dragCategorySource = null;
      renderCategories();
      markDirty();
      toast('分类顺序已调整', 'success');
    });

    dom.categoryList.appendChild(item);
  });

  // 若无选中，默认选第一个
  if (!state.currentCategoryId && cats.length) state.currentCategoryId = cats[0].id;
}

/* ══════════ 渲染：网站卡片 ══════════ */
function renderWebsiteGrid() {
  const category = getCurrentCategory();
  dom.websiteGrid.innerHTML = '';

  if (!state.data) {
    showEmpty('点击「读取导航」开始管理');
    return;
  }
  if (!category) {
    showEmpty('请先创建一个分类');
    return;
  }

  // 筛选
  const query = state.searchQuery.toLowerCase();
  const cards = (category.cards || []).filter(card =>
    !query || (card.title || '').toLowerCase().includes(query) ||
    (card.url || '').toLowerCase().includes(query) ||
    (card.description || '').toLowerCase().includes(query)
  );

  if (!cards.length) {
    showEmpty(query ? `未找到匹配「${state.searchQuery}」的网站` : '当前分类还没有网站，使用下方表单添加');
    return;
  }

  cards.forEach((card, i) => {
    const el = document.createElement('div');
    const isSelected = state.selectedWebsites.has(card.id || card.url || card.title);
    el.className = `website-card${isSelected ? ' selected' : ''}`;
    el.draggable = true;

    const favicon = getFavicon(card.url);

    el.innerHTML = `
      <div class="checkbox" title="选择"></div>
      <div class="favicon">${favicon ? `<img src="${favicon}" onerror="this.style.display='none'">` : '🌐'}</div>
      <div class="title">${escapeHtml(card.title || '未命名网站')}</div>
      <div class="url" title="${escapeHtml(card.url || '')}">${escapeHtml(card.url || '无地址')}</div>
      <div class="actions">
        <button class="btn-sm" onclick="void 0" data-action="visit">🔗</button>
        <button class="btn-sm" onclick="void 0" data-action="edit">✏️</button>
        <button class="btn-sm btn-danger" onclick="void 0" data-action="delete">🗑️</button>
      </div>
    `;

    // 选中复选框
    const checkbox = el.querySelector('.checkbox');
    checkbox.addEventListener('click', e => {
      e.stopPropagation();
      const key = card.id || card.url || card.title;
      if (state.selectedWebsites.has(key)) {
        state.selectedWebsites.delete(key);
        el.classList.remove('selected');
      } else {
        state.selectedWebsites.add(key);
        el.classList.add('selected');
      }
      updateBatchButton();
    });

    // 卡片点击 → 跳转
    el.addEventListener('click', e => {
      const action = e.target.closest('[data-action]')?.dataset.action;
      if (action === 'edit') {
        openWebsiteModal(i, card);
      } else if (action === 'delete') {
        deleteWebsite(card);
      } else if (action === 'visit' || e.target === el || e.target.closest('.favicon') || e.target.closest('.title') || e.target.closest('.url')) {
        if (card.url) window.open(card.url, '_blank');
      }
    });

    // 拖拽排序（仅非搜索状态）
    if (!query) {
      const originalIndex = category.cards.indexOf(card);
      el.addEventListener('dragstart', e => {
        state.dragSource = originalIndex;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      el.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
      el.addEventListener('drop', e => {
        e.preventDefault();
        const target = category.cards.indexOf(card);
        if (state.dragSource === null || state.dragSource === target) return;
        const [moved] = category.cards.splice(state.dragSource, 1);
        category.cards.splice(target, 0, moved);
        state.dragSource = null;
        renderWebsiteGrid();
        markDirty();
        toast('网站顺序已调整', 'success');
      });
    }

    dom.websiteGrid.appendChild(el);
  });
}

function showEmpty(text) {
  dom.websiteGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">${text}</div>`;
}

function updateBatchButton() {
  dom.batchDeleteBtn.style.display = state.selectedWebsites.size ? 'inline-flex' : 'none';
  if (state.selectedWebsites.size) {
    dom.batchDeleteBtn.textContent = `批量删除 (${state.selectedWebsites.size})`;
  }
}

/* ══════════ 数据处理 ══════════ */
function addWebsite() {
  const title = dom.newTitle.value.trim();
  const url = dom.newUrl.value.trim();
  const category = getCurrentCategory();

  if (!category) { toast('请先在左侧创建分类', 'warning'); return; }
  if (!title) { toast('请输入网站名称', 'warning'); dom.newTitle.focus(); return; }
  if (!url || !/^https?:\/\//i.test(url)) { toast('网址需以 http:// 或 https:// 开头', 'warning'); dom.newUrl.focus(); return; }

  category.cards = category.cards || [];
  category.cards.push({
    className: '', icon: 'bi-globe', title,
    description: '', url,
    id: 'card-' + Date.now()
  });

  dom.newTitle.value = '';
  dom.newUrl.value = '';
  renderWebsiteGrid();
  markDirty();
  toast('网站已添加', 'success');
}

function deleteWebsite(card) {
  const category = getCurrentCategory();
  if (!category) return;
  if (!confirm(`确定删除「${card.title}」吗？`)) return;

  category.cards = (category.cards || []).filter(c => c !== card);
  state.selectedWebsites.delete(card.id || card.url || card.title);
  renderWebsiteGrid();
  updateBatchButton();
  markDirty();
  toast('网站已删除', 'success');
}

function addCategory() {
  const name = prompt('输入新分类名称');
  if (!name?.trim()) return;
  const id = slugify(name);
  if (state.data?.categories?.some(c => c.id === id)) {
    toast('该分类已存在', 'warning');
    return;
  }
  state.data.categories.push({ id, title: name.trim(), cards: [] });
  state.currentCategoryId = id;
  renderCategories();
  renderWebsiteGrid();
  markDirty();
  toast('分类已创建', 'success');
}

/* ══════════ 弹窗管理 ══════════ */
function openModal(modal) { modal.classList.add('open'); }
function closeModal(modal) { modal.classList.remove('open'); }

function openWebsiteModal(index, card) {
  state.editingWebsiteIndex = index;
  dom.editTitle.value = card?.title || '';
  dom.editUrl.value = card?.url || '';
  dom.editDesc.value = card?.description || '';
  openModal(dom.websiteModal);
  setTimeout(() => dom.editTitle.focus(), 100);
}
function saveWebsiteModal() {
  const category = getCurrentCategory();
  const card = category?.cards?.[state.editingWebsiteIndex];
  if (!card) { closeModal(dom.websiteModal); return; }

  const title = dom.editTitle.value.trim();
  const url = dom.editUrl.value.trim();
  if (!title) { toast('请输入网站名称', 'warning'); return; }
  if (!url || !/^https?:\/\//i.test(url)) { toast('网址格式不正确', 'warning'); return; }

  card.title = title;
  card.url = url;
  card.description = dom.editDesc.value.trim();

  closeModal(dom.websiteModal);
  renderWebsiteGrid();
  markDirty();
  toast('网站已更新', 'success');
}

function openCategoryModal() {
  const cat = getCurrentCategory();
  if (!cat) { toast('请选择分类', 'warning'); return; }
  state.editingCategoryId = cat.id;
  dom.editCatTitle.value = cat.title || '';
  openModal(dom.categoryModal);
  setTimeout(() => dom.editCatTitle.focus(), 100);
}
function saveCategoryModal() {
  const cat = state.data?.categories?.find(c => c.id === state.editingCategoryId);
  if (!cat) { closeModal(dom.categoryModal); return; }
  const title = dom.editCatTitle.value.trim();
  if (!title) { toast('请输入分类名称', 'warning'); return; }

  const isDuplicate = state.data.categories.some(c => c.id !== cat.id && c.title === title);
  if (isDuplicate) { toast('已存在同名分类', 'warning'); return; }

  cat.title = title;
  closeModal(dom.categoryModal);
  renderCategories();
  markDirty();
  toast('分类已更新', 'success');
}

function deleteCategory() {
  const cat = getCurrentCategory();
  if (!cat) { toast('请选择分类', 'warning'); return; }

  const count = (cat.cards || []).length;
  if (!confirm(`确定删除分类「${cat.title}」吗？${count ? `\n其下 ${count} 个网站将被一并删除！` : ''}`)) return;

  state.data.categories = state.data.categories.filter(c => c.id !== cat.id);
  state.currentCategoryId = null;
  renderCategories();
  renderWebsiteGrid();
  markDirty();
  toast('分类已删除', 'success');
}

/* ══════════ 身份验证 / 数据读取 ══════════ */
function showAuthModal() {
  if (state.token) {
    readNavigation(state.token);
  } else {
    openModal(dom.authModal);
    setTimeout(() => dom.authToken.focus(), 100);
  }
}

async function readNavigation(token) {
  try {
    toast('正在读取导航配置...', 'info', 1500);
    const res = await fetch(`${API_BASE}/api/navigation?t=${Date.now()}`, {
      method: 'GET', headers: { 'Accept': 'application/json' }, cache: 'no-store'
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { throw new Error(`接口未返回 JSON (HTTP ${res.status})`); }
    if (!res.ok) throw new Error(data.error || data.message || `HTTP ${res.status}`);
    if (!data?.categories) throw new Error('数据格式错误');

    state.data = data;
    state.token = token;
    sessionStorage.setItem('admin_token', token);
    state.currentCategoryId = data.categories?.[0]?.id || null;
    state.isDirty = false;
    markClean();
    closeModal(dom.authModal);
    renderCategories();
    renderWebsiteGrid();
    state.searchQuery = '';
    dom.searchInput.value = '';
    toast('导航配置读取成功', 'success');
  } catch (err) {
    toast(`读取失败: ${err.message}`, 'error', 5000);
  }
}

async function saveData() {
  if (!state.data) { toast('请先读取导航配置', 'warning'); return; }
  if (!state.token) { toast('身份验证已过期，请重新读取', 'warning'); showAuthModal(); return; }

  try {
    dom.saveBtn.disabled = true;
    dom.saveBtn.textContent = '保存中...';
    toast('正在保存...', 'info', 1000);

    const res = await fetch(`${API_BASE}/api/admin/navigation`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
      body: JSON.stringify(state.data)
    });
    const text = await res.text();
    let result;
    try { result = JSON.parse(text); } catch { throw new Error(`接口未返回 JSON (HTTP ${res.status})`); }
    if (!res.ok) throw new Error(result.error || result.message || `HTTP ${res.status}`);

    markClean();
    toast('保存成功！所有修改已生效', 'success');
  } catch (err) {
    toast(`保存失败: ${err.message}`, 'error', 5000);
  } finally {
    dom.saveBtn.disabled = false;
    dom.saveBtn.textContent = '保存全部修改';
  }
}

/* ══════════ 导入 / 导出 ══════════ */
function exportData() {
  if (!state.data) { toast('没有可导出的数据', 'warning'); return; }
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `navigation-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 JSON 文件', 'success');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data?.categories || !Array.isArray(data.categories)) throw new Error('结构不正确');
      if (!confirm('导入将覆盖当前全部数据，确定继续？')) return;
      state.data = data;
      state.currentCategoryId = data.categories?.[0]?.id || null;
      state.selectedWebsites.clear();
      state.isDirty = true;
      markDirty();
      renderCategories();
      renderWebsiteGrid();
      toast('导入成功，请检查后保存', 'success');
    } catch (err) {
      toast(`导入失败: ${err.message}`, 'error');
    } finally {
      dom.importFile.value = '';
    }
  };
  reader.readAsText(file);
}

/* ══════════ 搜索 / 批量删除 ══════════ */
function handleSearch(query) {
  state.searchQuery = query.trim();
  dom.clearSearchBtn.style.display = query.trim() ? 'inline-flex' : 'none';
  renderWebsiteGrid();
}
function batchDelete() {
  const category = getCurrentCategory();
  if (!category || !state.selectedWebsites.size) return;
  if (!confirm(`确定删除选中的 ${state.selectedWebsites.size} 个网站？`)) return;

  category.cards = (category.cards || []).filter(card => !state.selectedWebsites.has(card.id || card.url || card.title));
  state.selectedWebsites.clear();
  renderWebsiteGrid();
  updateBatchButton();
  markDirty();
  toast('已删除选中网站', 'success');
}

/* ══════════ 事件绑定 ══════════ */
function bindEvents() {
  // 认证
  dom.confirmAuth.addEventListener('click', () => {
    const token = dom.authToken.value.trim();
    if (!token) { toast('请输入密码', 'warning'); return; }
    readNavigation(token);
  });
  dom.cancelAuth.addEventListener('click', () => closeModal(dom.authModal));
  dom.authToken.addEventListener('keydown', e => { if (e.key === 'Enter') dom.confirmAuth.click(); });
  // 遮罩点击关闭
  dom.websiteModal.addEventListener('click', e => { if (e.target === dom.websiteModal) closeModal(dom.websiteModal); });
  dom.categoryModal.addEventListener('click', e => { if (e.target === dom.categoryModal) closeModal(dom.categoryModal); });
  dom.authModal.addEventListener('click', e => { if (e.target === dom.authModal) closeModal(dom.authModal); });

  // 添加
  dom.addWebsiteBtn.addEventListener('click', addWebsite);
  dom.newUrl.addEventListener('keydown', e => { if (e.key === 'Enter') addWebsite(); });
  dom.addCategoryBtn.addEventListener('click', addCategory);

  // 分类操作
  dom.editCatBtn.addEventListener('click', openCategoryModal);
  dom.deleteCatBtn.addEventListener('click', deleteCategory);

  // 网站弹窗保存/取消
  dom.saveWebsite.addEventListener('click', saveWebsiteModal);
  dom.cancelWebsite.addEventListener('click', () => closeModal(dom.websiteModal));
  dom.editUrl.addEventListener('keydown', e => { if (e.key === 'Enter') saveWebsiteModal(); });

  // 分类弹窗
  dom.saveCategory.addEventListener('click', saveCategoryModal);
  dom.cancelCategory.addEventListener('click', () => closeModal(dom.categoryModal));
  dom.editCatTitle.addEventListener('keydown', e => { if (e.key === 'Enter') saveCategoryModal(); });

  // 保存 / Token 清除
  dom.saveBtn.addEventListener('click', saveData);
  dom.clearTokenBtn.addEventListener('click', () => {
    state.token = '';
    sessionStorage.removeItem('admin_token');
    toast('已清除管理员密码', 'info');
  });

  // 导入导出
  dom.importBtn.addEventListener('click', () => dom.importFile.click());
  dom.importFile.addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); });
  dom.exportBtn.addEventListener('click', exportData);

  // 搜索
  dom.searchInput.addEventListener('input', debounce(e => handleSearch(e.target.value), 250));
  dom.clearSearchBtn.addEventListener('click', () => {
    dom.searchInput.value = '';
    handleSearch('');
  });

  // 批量删除
  dom.batchDeleteBtn.addEventListener('click', batchDelete);

  // 快捷键
  document.addEventListener('keydown', e => {
    // Ctrl/Cmd + S 保存
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      saveData();
    }
    // Ctrl/Cmd + N 新分类
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
      e.preventDefault();
      addCategory();
    }
    // Esc 关闭弹窗
    if (e.key === 'Escape') {
      closeModal(dom.websiteModal);
      closeModal(dom.categoryModal);
      closeModal(dom.authModal);
    }
  });
}

/* ══════════ 初始化 ══════════ */
function init() {
  bindEvents();
  renderCategories();
  renderWebsiteGrid();
}

window.addEventListener('load', () => {
  init();
  // 若已存有 Token，自动读取
  if (state.token) {
    readNavigation(state.token).catch(() => showAuthModal());
  } else {
    showAuthModal();
  }
});

})();
</script>
</body>
</html>
