<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导航管理</title>

  <style>
    body {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 16px;
      font-family: Arial, sans-serif;
      color: #222;
    }

    h1 {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    textarea {
      min-height: 500px;
      resize: vertical;
      font-family: Consolas, monospace;
      line-height: 1.5;
    }

    button {
      margin-top: 16px;
      margin-right: 8px;
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      background: #1677ff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0958d9;
    }

    #message {
      margin-top: 18px;
      white-space: pre-wrap;
    }

    .tip {
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <h1>导航管理</h1>

  <div class="tip">
    输入 Cloudflare 中设置的 ADMIN_TOKEN，然后读取或保存导航数据。
    <br>
    注意：密码不会写入 GitHub 代码。
  </div>

  <label for="token">管理员密码 ADMIN_TOKEN</label>
  <input
    id="token"
    type="password"
    placeholder="请输入 ADMIN_TOKEN"
  >

  <button id="loadButton">
    读取当前导航
  </button>

  <button id="saveButton">
    保存导航
  </button>

  <label for="jsonData">导航 JSON</label>
  <textarea id="jsonData" spellcheck="false"></textarea>

  <div id="message"></div>

  <script>
    const API_BASE =
      "https://shuoce-navigation.2765414002jin.workers.dev";

    const tokenInput =
      document.getElementById("token");

    const jsonData =
      document.getElementById("jsonData");

    const message =
      document.getElementById("message");

    const loadButton =
      document.getElementById("loadButton");

    const saveButton =
      document.getElementById("saveButton");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? "green" : "crimson";
    }

    async function loadNavigation() {
      showMessage("正在读取导航数据……");

      try {
        const response = await fetch(
          API_BASE + "/api/navigation?time=" + Date.now()
        );

        const data = await response.json();

        if (!response.ok) {
          showMessage(
            "读取失败：" +
            (data.message || response.status)
          );
          return;
        }

        jsonData.value =
          JSON.stringify(data, null, 2);

        showMessage(
          "读取成功，可以修改下面的 JSON。",
          true
        );
      } catch (error) {
        showMessage(
          "读取失败：" + error.message
        );
      }
    }

    async function saveNavigation() {
      const token =
        tokenInput.value.trim();

      if (!token) {
        showMessage("请先输入 ADMIN_TOKEN。");
        return;
      }

      let data;

      try {
        data = JSON.parse(jsonData.value);
      } catch (error) {
        showMessage(
          "JSON 格式错误，请检查逗号、引号和括号。"
        );
        return;
      }

      if (
        !data ||
        !Array.isArray(data.categories)
      ) {
        showMessage(
          "格式错误：JSON 中必须包含 categories 数组。"
        );
        return;
      }

      showMessage("正在保存导航数据……");

      try {
        const response = await fetch(
          API_BASE + "/api/admin/navigation",
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token
            },
            body: JSON.stringify(data)
          }
        );

        const result = await response.json();

        if (!response.ok) {
          showMessage(
            "保存失败：" +
            (result.message || response.status)
          );
          return;
        }

        showMessage(
          "保存成功！",
          true
        );
      } catch (error) {
        showMessage(
          "保存失败：" + error.message
        );
      }
    }

    loadButton.addEventListener(
      "click",
      loadNavigation
    );

    saveButton.addEventListener(
      "click",
      saveNavigation
    );
  </script>
</body>
</html>
