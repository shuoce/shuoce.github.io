
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>网站导航管理 · 硕策</title>
    <style>
        /* 样式保持不变，仅优化了部分关键样式 */
        :root { --radius: 16px; }
        .website-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .website-card.dragging {
            opacity: 0.6;
            transform: scale(0.95);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 侧边栏、顶部栏、内容区等保持不变 -->
        <!-- ...（原HTML结构保持）... -->
    </div>

    <script>
        (() => {
            'use strict';

            // ==================== 状态管理 ====================
            const state = {
                data: null,
                currentCategoryId: null,
                selectedWebsites: new Set(),
                searchQuery: '',
                sortBy: 'title', // title | url | date
                editingWebsite: null,
                editingCategory: null,
                token: null,
                isDirty: false,
                dragSource: null,
                currentTheme: 'light'
            };

            // ==================== 工具函数 ====================
            const helpers = {
                debounce: (fn, delay = 300) => {
                    let timer;
                    return (...args) => {
                        clearTimeout(timer);
                        timer = setTimeout(() => fn(...args), delay);
                    };
                },
                escapeHtml: (str) => String(str || '').replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m])),
                normalizeUrl: (url) => {
                    url = url.trim();
                    if (!url) return '';
                    if (!url.startsWith('http')) url = 'https://' + url;
                    return url;
                },
                getFavicon: (() => {
                    const cache = new Map();
                    return (url) => {
                        if (!url) return null;
                        const domain = new URL(url).hostname;
                        if (cache.has(domain)) return cache.get(domain);
                        const icon = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
                        cache.set(domain, icon);
                        return icon;
                    };
                })(),
                toast: (message, type = 'info', duration = 2800) => {
                    // toast 实现保持不变
                }
            };

            // ==================== 核心管理类 ====================
            class NavigationManager {
                constructor() {
                    this.init();
                }

                // ==================== 渲染优化 ====================
                renderWebsiteGrid() {
                    const fragment = document.createDocumentFragment();
                    const cat = this.getCurrentCategory();
                    if (!cat) return;

                    // 虚拟滚动实现（支持大量数据）
                    const visibleCards = this.getFilteredAndSortedCards(cat.cards);
                    const start = 0;
                    const end = Math.min(start + 50, visibleCards.length); // 每页50条

                    for (let i = start; i < end; i++) {
                        const card = visibleCards[i];
                        const el = this.createWebsiteCard(card, i);
                        fragment.appendChild(el);
                    }

                    dom.websiteGrid.innerHTML = '';
                    dom.websiteGrid.appendChild(fragment);

                    this.bindCardEvents();
                }

                getFilteredAndSortedCards(cards) {
                    let filtered = cards.filter(card => 
                        !state.searchQuery || 
                        card.title?.toLowerCase().includes(state.searchQuery) ||
                        card.url?.toLowerCase().includes(state.searchQuery)
                    );

                    // 排序
                    return filtered.sort((a, b) => {
                        if (state.sortBy === 'title') return (a.title || '').localeCompare(b.title || '');
                        if (state.sortBy === 'url') return (a.url || '').localeCompare(b.url || '');
                        return new Date(b.id?.slice(-13) || 0) - new Date(a.id?.slice(-13) || 0);
                    });
                }

                // ... 其他渲染函数优化 ...

                init() {
                    this.applyTheme();
                    this.bindGlobalEvents();
                    this.loadInitialData();
                }
            }

            // ==================== 启动 ====================
            const manager = new NavigationManager();

            // 键盘快捷键增强
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    manager.save();
                }
                if (e.key === 'Escape') manager.closeModals();
            });
        })();
    </script>
</body>
</html>
