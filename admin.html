
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网站导航管理 · 硕策</title>

<style>
*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --primary: #5e6ad2;
    --primary-hover: #4f5bc4;
    --primary-soft: rgba(94, 106, 210, .12);
    --primary-border: rgba(94, 106, 210, .35);
    --success: #16866a;
    --danger: #d33b51;
    --danger-soft: rgba(211, 59, 81, .1);
    --warning: #b7791f;

    --bg: #f7f7f8;
    --bg-secondary: #fbfbfc;
    --card-bg: #ffffff;
    --input-bg: #f8f8fa;

    --text-1: #202124;
    --text-2: #6b6d75;
    --text-3: #a0a1a8;

    --border: #e7e7ea;
    --border-dark: #d7d7dc;

    --sidebar-bg: #fbfbfc;
    --sidebar-active: #eeedf8;
    --sidebar-hover: #f1f1f3;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .035);
    --shadow-md: 0 8px 25px rgba(0, 0, 0, .055);

    --radius: 10px;
    --radius-sm: 7px;
    --transition: .2s cubic-bezier(.4, 0, .2, 1);
}

[data-theme="dark"] {
    --bg: #111113;
    --bg-secondary: #151517;
    --card-bg: #19191c;
    --input-bg: #151517;

    --text-1: #f3f3f4;
    --text-2: #a3a3ac;
    --text-3: #686870;

    --border: #29292f;
    --border-dark: #3a3a42;

    --sidebar-bg: #151517;
    --sidebar-active: #292644;
    --sidebar-hover: #222226;

    --primary-soft: rgba(111, 124, 228, .16);
    --primary-border: rgba(111, 124, 228, .48);

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .25);
    --shadow-md: 0 10px 30px rgba(0, 0, 0, .25);
}

html,
body {
    min-height: 100%;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    color: var(--text-1);
    background: var(--bg);
    line-height: 1.5;
    transition: background var(--transition), color var(--transition);
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
    color: inherit;
    background: none;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

button:active {
    transform: scale(.97);
}

svg {
    width: 16px;
    height: 16px;
    vertical-align: middle;
}

.app-layout {
    display: flex;
    min-height: 100vh;
}

/* ==================== 侧边栏 ==================== */

.sidebar {
    position: sticky;
    top: 0;
    z-index: 50;
    width: 250px;
    height: 100vh;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    transition: width var(--transition), transform var(--transition);
}

.sidebar.collapsed {
    width: 68px;
}

.brand {
    height: 68px;
    padding: 0 17px;
    display: flex;
    align-items: center;
    gap: 11px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
}

.brand-logo {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: #fff;
    border-radius: 9px;
    background: var(--primary);
}

.brand-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.brand-name {
    font-size: 14px;
    font-weight: 650;
    letter-spacing: -.01em;
}

.brand-name small {
    display: block;
    margin-top: 1px;
    color: var(--text-3);
    font-size: 10px;
    font-weight: 450;
    letter-spacing: .08em;
}

.sidebar.collapsed .brand {
    justify-content: center;
}

.sidebar.collapsed .brand-name,
.sidebar.collapsed .sidebar-caption,
.sidebar.collapsed .category-name,
.sidebar.collapsed .category-count,
.sidebar.collapsed .category-move,
.sidebar.collapsed .footer-text {
    display: none;
}

.sidebar.collapsed .new-category {
    padding: 10px;
}

.sidebar.collapsed .category-item {
    justify-content: center;
}

.new-category {
    height: 36px;
    margin: 17px 12px 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: #fff;
    border-radius: var(--radius-sm);
    background: var(--primary);
    font-size: 13px;
    font-weight: 550;
}

.new-category:hover {
    background: var(--primary-hover);
}

.sidebar-content {
    min-height: 0;
    flex: 1;
    padding: 0 10px;
    overflow: hidden;
}

.sidebar-caption {
    height: 32px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-3);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
}

.sidebar-caption button {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    color: var(--text-3);
    border-radius: 6px;
}

.sidebar-caption button:hover {
    color: var(--text-1);
    background: var(--sidebar-hover);
}

.category-list {
    height: calc(100% - 32px);
    overflow: auto;
}

.category-list.collapsed {
    display: none;
}

.category-item {
    min-height: 38px;
    margin: 2px 0;
    padding: 8px 9px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-2);
    border: 1px solid transparent;
    border-radius: 8px;
    user-select: none;
    transition: background var(--transition), color var(--transition);
}

.category-item:hover {
    color: var(--text-1);
    background: var(--sidebar-hover);
}

.category-item.active {
    color: var(--primary);
    background: var(--sidebar-active);
    border-color: var(--primary-border);
}

.category-item.dragging {
    opacity: .4;
}

.category-icon {
    width: 18px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
}

.category-name {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
}

.category-count {
    color: var(--text-3);
    font-size: 11px;
}

.category-move {
    display: flex;
    gap: 1px;
    opacity: 0;
    transition: opacity var(--transition);
}

.category-item:hover .category-move,
.category-item.active .category-move {
    opacity: 1;
}

.category-move button {
    padding: 2px 3px;
    color: var(--text-3);
    border-radius: 4px;
    font-size: 11px;
}

.category-move button:hover {
    color: var(--primary);
    background: var(--sidebar-hover);
}

.sidebar-footer {
    padding: 12px;
    display: grid;
    gap: 6px;
    border-top: 1px solid var(--border);
}

.sidebar-footer button {
    min-height: 32px;
    padding: 0 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: 7px;
}

.sidebar-footer button:hover {
    color: var(--text-1);
    background: var(--sidebar-hover);
}

.sidebar-footer .danger:hover {
    color: var(--danger);
}

/* ==================== 主区域 ==================== */

.main {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    min-height: 68px;
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, .78);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(14px);
}

[data-theme="dark"] .topbar {
    background: rgba(25, 25, 28, .8);
}

.menu-button {
    display: none !important;
}

.search-wrap {
    position: relative;
    width: 100%;
    max-width: 430px;
}

.search-wrap svg {
    position: absolute;
    top: 50%;
    left: 11px;
    color: var(--text-3);
    transform: translateY(-50%);
}

.search-wrap input {
    width: 100%;
    height: 36px;
    padding: 0 68px 0 35px;
    color: var(--text-1);
    outline: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--input-bg);
    transition: border var(--transition), box-shadow var(--transition);
}

.search-wrap input:focus {
    border-color: var(--primary);
    background: var(--card-bg);
    box-shadow: 0 0 0 3px var(--primary-soft);
}

.search-wrap input::placeholder {
    color: var(--text-3);
}

.search-shortcut {
    position: absolute;
    top: 8px;
    right: 9px;
    padding: 1px 5px;
    color: var(--text-3);
    border: 1px solid var(--border-dark);
    border-radius: 4px;
    font-size: 10px;
}

.topbar-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
}

.btn {
    height: 34px;
    padding: 0 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card-bg);
    white-space: nowrap;
    transition: background var(--transition), color var(--transition), border var(--transition);
}

.btn:hover {
    color: var(--text-1);
    border-color: var(--border-dark);
    background: var(--bg-secondary);
}

.btn-primary {
    color: #fff;
    border-color: var(--primary);
    background: var(--primary);
}

.btn-primary:hover {
    color: #fff;
    border-color: var(--primary-hover);
    background: var(--primary-hover);
}

.btn-danger {
    color: var(--danger);
    border-color: transparent;
    background: var(--danger-soft);
}

.btn-danger:hover {
    color: var(--danger);
    background: var(--danger-soft);
}

.btn-small {
    height: 30px;
    padding: 0 9px;
    font-size: 12px;
}

.btn-icon {
    width: 34px;
    padding: 0;
}

.content {
    width: 100%;
    max-width: 1360px;
    margin: 0 auto;
    padding: 34px 32px 52px;
}

.page-header {
    margin-bottom: 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
}

.page-eyebrow {
    margin-bottom: 5px;
    color: var(--text-3);
    font-size: 11px;
    letter-spacing: .08em;
}

.page-title {
    color: var(--text-1);
    font-size: 24px;
    font-weight: 680;
    letter-spacing: -.035em;
    line-height: 1.2;
}

.page-meta {
    margin-top: 7px;
    color: var(--text-2);
    font-size: 13px;
}

.page-meta strong {
    color: var(--text-1);
    font-weight: 550;
}

.page-actions {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
}

.save-status {
    margin-right: 6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-3);
    font-size: 12px;
}

.save-status i {
    width: 6px;
    height: 6px;
    display: block;
    border-radius: 50%;
    background: var(--success);
}

.save-status.dirty i {
    background: var(--warning);
}

.view-switch {
    padding: 2px;
    display: flex;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card-bg);
}

.view-switch button {
    width: 29px;
    height: 27px;
    display: grid;
    place-items: center;
    color: var(--text-3);
    border-radius: 5px;
}

.view-switch button.active {
    color: var(--primary);
    background: var(--primary-soft);
}

.batch-bar {
    min-height: 44px;
    margin-bottom: 15px;
    padding: 7px 10px;
    display: none;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--primary-border);
    border-radius: 8px;
    background: var(--primary-soft);
}

.batch-bar.show {
    display: flex;
}

.batch-info {
    margin-right: auto;
    color: var(--primary);
    font-size: 13px;
    font-weight: 550;
}

/* ==================== 网站卡片 ==================== */

.website-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
    gap: 13px;
}

.website-grid.list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.website-card {
    position: relative;
    min-width: 0;
    padding: 16px;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
    user-select: none;
    transition: transform var(--transition), border var(--transition), box-shadow var(--transition);
}

.website-card:hover {
    border-color: var(--primary-border);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
}

.website-card.selected {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px var(--primary-soft);
}

.website-card.dragging {
    opacity: .4;
    transform: scale(.98);
}

.website-card.drag-over {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px var(--primary-soft);
}

.website-check {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 18px;
    height: 18px;
    display: grid;
    place-items: center;
    color: transparent;
    border: 1px solid var(--border-dark);
    border-radius: 5px;
    background: var(--card-bg);
    font-size: 11px;
    z-index: 2;
}

.website-card:hover .website-check {
    border-color: var(--primary);
}

.website-card.selected .website-check {
    color: #fff;
    border-color: var(--primary);
    background: var(--primary);
}

.card-main {
    min-width: 0;
    padding-right: 24px;
    display: flex;
    align-items: flex-start;
    gap: 11px;
}

.card-favicon {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    color: var(--text-3);
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--input-bg);
}

.card-favicon img {
    width: 22px;
    height: 22px;
    object-fit: contain;
}

.card-content {
    min-width: 0;
}

.card-title {
    color: var(--text-1);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    word-break: break-word;
}

.card-url {
    margin-top: 3px;
    overflow: hidden;
    color: var(--text-3);
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.card-description {
    margin-top: 12px;
    overflow: hidden;
    display: -webkit-box;
    color: var(--text-2);
    font-size: 12px;
    line-height: 1.45;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
}

.card-footer {
    min-height: 27px;
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.card-mark {
    display: inline-flex;
    color: #c58b22;
}

.card-actions {
    margin-left: auto;
    display: flex;
    gap: 3px;
    opacity: 0;
    transition: opacity var(--transition);
}

.website-card:hover .card-actions,
.website-card.selected .card-actions {
    opacity: 1;
}

.card-actions button {
    width: 27px;
    height: 27px;
    display: grid;
    place-items: center;
    color: var(--text-3);
    border-radius: 5px;
}

.card-actions button:hover {
    color: var(--text-1);
    background: var(--input-bg);
}

.card-actions button.active {
    color: #c58b22;
}

.website-grid.list .website-card {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 14px;
}

.website-grid.list .card-main {
    flex: 1;
    align-items: center;
}

.website-grid.list .card-description {
    width: 25%;
    margin: 0;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.website-grid.list .card-footer {
    min-width: 140px;
    margin: 0;
}

.empty-state {
    grid-column: 1 / -1;
    padding: 70px 20px;
    text-align: center;
    color: var(--text-3);
    border: 1px dashed var(--border-dark);
    border-radius: 10px;
    background: var(--card-bg);
}

.empty-state svg {
    width: 34px;
    height: 34px;
    margin-bottom: 12px;
}

.empty-state strong {
    display: block;
    margin-bottom: 4px;
    color: var(--text-2);
    font-weight: 550;
}

/* ==================== 快速添加 ==================== */

.quick-add {
    margin-top: 25px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    box-shadow: var(--shadow-sm);
}

.quick-add-header {
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.quick-add-header strong {
    font-size: 13px;
}

.quick-add-header span {
    color: var(--text-3);
    font-size: 12px;
}

.quick-form {
    display: flex;
    gap: 8px;
}

.input {
    height: 38px;
    min-width: 0;
    padding: 0 11px;
    color: var(--text-1);
    outline: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--input-bg);
    transition: border var(--transition), box-shadow var(--transition);
}

.input:focus {
    border-color: var(--primary);
    background: var(--card-bg);
    box-shadow: 0 0 0 3px var(--primary-soft);
}

.quick-title {
    width: 190px;
}

.quick-url {
    flex: 1;
}

.site-preview {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    color: var(--text-3);
    font-size: 12px;
}

.site-preview.show {
    display: flex;
}

.site-preview img {
    width: 18px;
    height: 18px;
}

/* ==================== 弹窗 ==================== */

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    padding: 20px;
    display: grid;
    place-items: center;
    visibility: hidden;
    opacity: 0;
    background: rgba(15, 15, 20, .48);
    backdrop-filter: blur(4px);
    transition: opacity var(--transition), visibility var(--transition);
}

.modal-overlay.open {
    visibility: visible;
    opacity: 1;
}

.modal {
    width: min(100%, 460px);
    max-height: 90vh;
    overflow: auto;
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card-bg);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .2);
    transform: translateY(12px) scale(.98);
    transition: transform var(--transition);
}

.modal-overlay.open .modal {
    transform: none;
}

.modal-header {
    margin-bottom: 19px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 650;
}

.modal-close {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    color: var(--text-3);
    border-radius: 6px;
}

.modal-close:hover {
    color: var(--text-1);
    background: var(--input-bg);
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    color: var(--text-2);
    font-size: 12px;
}

.form-control,
select.form-control {
    width: 100%;
    height: 38px;
    padding: 0 11px;
    color: var(--text-1);
    outline: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--input-bg);
}

.form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
}

.modal-hint {
    margin: -7px 0 15px;
    color: var(--text-2);
    font-size: 12px;
}

.modal-actions {
    margin-top: 22px;
    display: flex;
    justify-content: flex-end;
    gap: 7px;
}

/* ==================== Toast ==================== */

.toast-container {
    position: fixed;
    top: 80px;
    right: 20px;
    z-index: 2000;
    display: grid;
    gap: 8px;
}

.toast {
    min-width: 220px;
    padding: 11px 14px;
    color: var(--text-1);
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    border-radius: 8px;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    font-size: 13px;
    animation: toast-in .25s ease;
}

.toast.success {
    border-left-color: var(--success);
}

.toast.error {
    border-left-color: var(--danger);
}

.toast.warning {
    border-left-color: var(--warning);
}

@keyframes toast-in {
    from {
        opacity: 0;
        transform: translateX(18px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* ==================== 移动端 ==================== */

.mobile-mask {
    display: none;
}

@media (max-width: 900px) {
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 260px;
        transform: translateX(-100%);

<script>
(() => {
    'use strict';

    /*
     * ================================
     * 配置
     * ================================
     */

    const API_BASE =
        'https://proxyd.picpi.top/https://shuoce-navigation.2765414002jin.workers.dev';

    const STORAGE_KEY = 'shuoce_admin_token';
    const BACKUP_KEY = 'shuoce_navigation_backup';
    const THEME_KEY = 'shuoce_theme';
    const VIEW_KEY = 'shuoce_navigation_view';
    const SIDEBAR_KEY = 'shuoce_sidebar_collapsed';
    const CATEGORY_COLLAPSED_KEY = 'shuoce_category_collapsed';

    /*
     * 标题解析服务配置。
     *
     * 留空时：
     * 1. 自动补全 https://
     * 2. 自动使用域名作为网站标题
     * 3. 自动加载网站图标
     * 4. 不影响网站添加
     *
     * 如果填写接口地址，接口建议支持：
     *
     * GET /api/title?url=https%3A%2F%2Fexample.com
     *
     * 返回：
     *
     * {
     *   "title": "网站标题"
     * }
     */
    const TITLE_PARSER_URL = '';

    const TITLE_PARSER_TIMEOUT = 4500;

    const FAVICON_BASE =
        'https://www.google.com/s2/favicons?sz=64&domain=';

    /*
     * ================================
     * 状态
     * ================================
     */

    const state = {
        data: null,
        currentCategoryId: null,
        token: sessionStorage.getItem(STORAGE_KEY) || '',

        editingWebsite: null,
        editingCategoryId: null,

        selectedWebsites: new Set(),
        searchQuery: '',

        isDirty: false,
        currentTheme: localStorage.getItem(THEME_KEY) || 'light',
        viewMode: localStorage.getItem(VIEW_KEY) || 'grid',

        sidebarCollapsed:
            localStorage.getItem(SIDEBAR_KEY) === 'true',

        categoryCollapsed:
            localStorage.getItem(CATEGORY_COLLAPSED_KEY) === 'true',

        dragSource: null
    };

    /*
     * ================================
     * DOM 引用
     * ================================
     */

    const $ = id => document.getElementById(id);

    const dom = {
        sidebar: $('sidebar'),
        mobileMask: $('mobileMask'),

        categoryList: $('categoryList'),
        categoryCount: $('categoryCount'),
        collapseCategoryBtn: $('collapseCategoryBtn'),

        addCategorySidebarBtn: $('addCategorySidebarBtn'),
        editCategorySidebarBtn: $('editCategorySidebarBtn'),
        deleteCategorySidebarBtn: $('deleteCategorySidebarBtn'),

        sidebarToggleBtn: $('sidebarToggleBtn'),
        mobileMenuBtn: $('mobileMenuBtn'),

        searchInput: $('searchInput'),
        clearSearchBtn: $('clearSearchBtn'),

        importBtn: $('importBtn'),
        exportBtn: $('exportBtn'),
        importFile: $('importFile'),

        themeToggleBtn: $('themeToggleBtn'),
        clearTokenBtn: $('clearTokenBtn'),
        saveBtn: $('saveBtn'),

        currentCategoryTitle: $('currentCategoryTitle'),
        currentCategoryMeta: $('currentCategoryMeta'),
        saveStatus: $('saveStatus'),

        gridViewBtn: $('gridViewBtn'),
        listViewBtn: $('listViewBtn'),

        selectAllBtn: $('selectAllBtn'),
        batchBar: $('batchBar'),
        batchInfo: $('batchInfo'),
        clearSelectionBtn: $('clearSelectionBtn'),
        batchFavoriteBtn: $('batchFavoriteBtn'),
        batchPinBtn: $('batchPinBtn'),
        batchMoveBtn: $('batchMoveBtn'),
        batchDeleteBtn: $('batchDeleteBtn'),

        websiteGrid: $('websiteGrid'),

        newTitle: $('newTitle'),
        newUrl: $('newUrl'),
        addWebsiteBtn: $('addWebsiteBtn'),
        sitePreview: $('sitePreview'),
        sitePreviewIcon: $('sitePreviewIcon'),
        sitePreviewText: $('sitePreviewText'),

        websiteModal: $('websiteModal'),
        editTitle: $('editTitle'),
        editUrl: $('editUrl'),
        editDesc: $('editDesc'),
        saveWebsite: $('saveWebsite'),

        categoryModal: $('categoryModal'),
        categoryModalTitle: $('categoryModalTitle'),
        editCatTitle: $('editCatTitle'),
        saveCategory: $('saveCategory'),

        authModal: $('authModal'),
        authToken: $('authToken'),
        confirmAuth: $('confirmAuth'),

        moveModal: $('moveModal'),
        moveTargetCategory: $('moveTargetCategory'),
        moveCount: $('moveCount'),
        confirmMove: $('confirmMove')
    };

    /*
     * ================================
     * 基础工具
     * ================================
     */

    function toast(message, type = 'info', duration = 3000) {
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = message;

        $('toast-container').appendChild(el);

        setTimeout(() => {
            el.style.opacity = '0';
            el.style.transform = 'translateX(20px)';

            setTimeout(() => {
                el.remove();
            }, 250);
        }, duration);
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    function normalizeUrl(url) {
        url = String(url || '').trim();

        if (!url) {
            return '';
        }

        if (!/^https?:\/\//i.test(url)) {
            url = `https://${url}`;
        }

        return url;
    }

    function getHostname(url) {
        try {
            return new URL(normalizeUrl(url))
                .hostname
                .replace(/^www\./i, '');
        } catch {
            return '';
        }
    }

    function getFavicon(url) {
        const hostname = getHostname(url);

        if (!hostname) {
            return '';
        }

        return FAVICON_BASE + encodeURIComponent(hostname);
    }

    function slugify(value) {
        return String(value || '')
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '') ||
            `cat-${Date.now()}`;
    }

    function getCurrentCategory() {
        return state.data?.categories?.find(
            category => category.id === state.currentCategoryId
        ) || null;
    }

    function getCardKey(card) {
        return card.id || card.url || card.title;
    }

    function normalizeCard(card) {
        if (!card || typeof card !== 'object') {
            return card;
        }

        if (!card.id) {
            card.id = `card-${Date.now()}-${Math.random()
                .toString(36)
                .slice(2, 8)}`;
        }

        if (typeof card.favorite !== 'boolean') {
            card.favorite = false;
        }

        if (typeof card.pinned !== 'boolean') {
            card.pinned = false;
        }

        return card;
    }

    function normalizeData(data) {
        if (!data || !Array.isArray(data.categories)) {
            throw new Error('数据格式错误');
        }

        data.categories.forEach(category => {
            if (!Array.isArray(category.cards)) {
                category.cards = [];
            }

            category.cards.forEach(normalizeCard);
        });

        return data;
    }

    function debounce(fn, delay = 250) {
        let timer;

        return (...args) => {
            clearTimeout(timer);

            timer = setTimeout(() => {
                fn(...args);
            }, delay);
        };
    }

    /*
     * ================================
     * 未保存状态
     * ================================
     */

    function markDirty() {
        state.isDirty = true;

        dom.saveStatus.classList.add('dirty');
        dom.saveStatus.querySelector('span').textContent =
            '有未保存修改';

        backupToLocal();

        window.addEventListener(
            'beforeunload',
            beforeUnloadHandler
        );
    }

    function markClean() {
        state.isDirty = false;

        dom.saveStatus.classList.remove('dirty');
        dom.saveStatus.querySelector('span').textContent =
            '已保存';

        window.removeEventListener(
            'beforeunload',
            beforeUnloadHandler
        );
    }

    function beforeUnloadHandler(event) {
        if (!state.isDirty) {
            return;
        }

        event.preventDefault();
        event.returnValue = '';
    }

    /*
     * ================================
     * 本地备份
     * ================================
     */

    function backupToLocal() {
        if (!state.data) {
            return;
        }

        try {
            localStorage.setItem(
                BACKUP_KEY,
                JSON.stringify({
                    data: state.data,
                    time: Date.now()
                })
            );
        } catch {
            // 忽略本地存储异常
        }
    }

    function restoreFromLocal() {
        try {
            const raw = localStorage.getItem(BACKUP_KEY);

            if (!raw) {
                toast('没有找到本地备份', 'warning');
                return;
            }

            const backup = JSON.parse(raw);

            if (!backup?.data?.categories) {
                toast('备份数据格式无效', 'error');
                return;
            }

            const time = backup.time
                ? new Date(backup.time).toLocaleString()
                : '未知时间';

            if (!confirm(
                `确定从本地备份恢复吗？\n` +
                `备份时间：${time}\n` +
                `当前未保存的修改将丢失！`
            )) {
                return;
            }

            state.data = normalizeData(backup.data);
            state.currentCategoryId =
                state.data.categories[0]?.id || null;

            state.selectedWebsites.clear();

            renderCategories();
            renderWebsiteGrid();
            markDirty();

            toast('已从本地备份恢复，请保存', 'success');
        } catch (error) {
            toast(`备份恢复失败：${error.message}`, 'error');
        }
    }

    /*
     * ================================
     * 主题和布局
     * ================================
     */

    function applyTheme() {
        document.documentElement.setAttribute(
            'data-theme',
            state.currentTheme
        );

        dom.themeToggleBtn.textContent =
            state.currentTheme === 'dark' ? '☀' : '☾';

        localStorage.setItem(
            THEME_KEY,
            state.currentTheme
        );
    }

    function toggleTheme() {
        state.currentTheme =
            state.currentTheme === 'dark' ? 'light' : 'dark';

        applyTheme();

        toast(
            state.currentTheme === 'dark'
                ? '暗色主题已启用'
                : '亮色主题已启用',
            'info',
            1500
        );
    }

    function applySidebarState() {
        dom.sidebar.classList.toggle(
            'collapsed',
            state.sidebarCollapsed
        );

        dom.sidebarToggleBtn.textContent =
            state.sidebarCollapsed ? '›' : '‹';

        localStorage.setItem(
            SIDEBAR_KEY,
            String(state.sidebarCollapsed)
        );
    }

    function toggleSidebar() {
        state.sidebarCollapsed = !state.sidebarCollapsed;
        applySidebarState();
    }

    function toggleMobileSidebar(open) {
        dom.sidebar.classList.toggle('mobile-open', open);
        dom.mobileMask.classList.toggle('show', open);
    }

    function applyViewMode() {
        dom.websiteGrid.classList.toggle(
            'list-view',
            state.viewMode === 'list'
        );

        dom.gridViewBtn.classList.toggle(
            'active',
            state.viewMode === 'grid'
        );

        dom.listViewBtn.classList.toggle(
            'active',
            state.viewMode === 'list'
        );
    }

    function changeViewMode(mode) {
        state.viewMode = mode;

        localStorage.setItem(
            VIEW_KEY,
            mode
        );

        applyViewMode();
        renderWebsiteGrid();
    }

    /*
     * ================================
     * 分类渲染
     * ================================
     */

    function renderCategories() {
        const categories = state.data?.categories || [];

        dom.categoryList.innerHTML = '';
        dom.categoryCount.textContent = categories.length;

        dom.categoryList.classList.toggle(
            'is-collapsed',
            state.categoryCollapsed
        );

        dom.collapseCategoryBtn.textContent =
            state.categoryCollapsed ? '⌄' : '⌃';

        if (!categories.length) {
            dom.categoryList.innerHTML =
                '<div style="padding:20px;text-align:center;color:var(--text-3);font-size:12px">暂无分类</div>';
            return;
        }

        if (!state.currentCategoryId) {
            state.currentCategoryId = categories[0].id;
        }

        categories.forEach((category, index) => {
            const item = document.createElement('div');

            item.className =
                'category-item' +
                (category.id === state.currentCategoryId
                    ? ' active'
                    : '');

            item.draggable = true;
            item.dataset.id = category.id;

            item.innerHTML = `
                <span class="category-icon">▧</span>
                <span class="category-name">
                    ${escapeHtml(category.title || category.id)}
                </span>
                <span class="category-count">
                    ${(category.cards || []).length}
                </span>
                <span class="category-move">
                    <button data-direction="-1" title="上移">▲</button>
                    <button data-direction="1" title="下移">▼</button>
                </span>
            `;

            item.addEventListener('click', event => {
                const moveButton =
                    event.target.closest('[data-direction]');

                if (moveButton) {
                    event.stopPropagation();

                    moveCategory(
                        index,
                        Number(moveButton.dataset.direction)
                    );

                    return;
                }

                state.currentCategoryId = category.id;
                state.selectedWebsites.clear();

                renderCategories();
                renderWebsiteGrid();
                closeMobileSidebar();
            });

            item.addEventListener('dragstart', event => {
                state.dragSource = item;
                item.classList.add('dragging');

                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData(
                    'text/plain',
                    category.id
                );
            });

            item.addEventListener('dragover', event => {
                event.preventDefault();

                if (!state.dragSource || state.dragSource === item) {
                    return;
                }

                item.style.borderTop =
                    '2px solid var(--primary)';
            });

            item.addEventListener('dragleave', () => {
                item.style.borderTop = '';
            });

            item.addEventListener('drop', event => {
                event.preventDefault();
                item.style.borderTop = '';

                if (
                    !state.dragSource ||
                    state.dragSource === item
                ) {
                    return;
                }

                const fromId =
                    state.dragSource.dataset.id;

                const fromIndex =
                    categories.findIndex(
                        category => category.id === fromId
                    );

                const toIndex =
                    categories.findIndex(
                        category => category.id === category.id
                    );

                if (fromIndex < 0 || toIndex < 0) {
                    return;
                }

                const [moved] =
                    categories.splice(fromIndex, 1);

                categories.splice(toIndex, 0, moved);

                state.dragSource = null;

                renderCategories();
                markDirty();
                toast('分类顺序已更新', 'success');
            });

            item.addEventListener('dragend', () => {
                item.classList.remove('dragging');
                item.style.borderTop = '';
                state.dragSource = null;
            });

            dom.categoryList.appendChild(item);
        });
    }

    function moveCategory(index, direction) {
        const categories =
            state.data?.categories || [];

        const target = index + direction;

        if (
            target < 0 ||
            target >= categories.length
        ) {
            return;
        }

        const [moved] =
            categories.splice(index, 1);

        categories.splice(target, 0, moved);

        renderCategories();
        markDirty();
        toast('分类顺序已调整', 'success');
    }

    function addCategory() {
        if (!state.data) {
            toast('请先读取导航', 'warning');
            return;
        }

        state.editingCategoryId = null;
        dom.categoryModalTitle.textContent = '新建分类';
        dom.editCatTitle.value = '';

        openModal(dom.categoryModal);

        setTimeout(() => {
            dom.editCatTitle.focus();
        }, 100);
    }

    function editCategory() {
        const category = getCurrentCategory();

        if (!category) {
            toast('请选择分类', 'warning');
            return;
        }

        state.editingCategoryId = category.id;
        dom.categoryModalTitle.textContent = '编辑分类';
        dom.editCatTitle.value =
            category.title || '';

        openModal(dom.categoryModal);

        setTimeout(() => {
            dom.editCatTitle.focus();
        }, 100);
    }

    function saveCategoryModal() {
        const title =
            dom.editCatTitle.value.trim();

        if (!title) {
            toast('请输入分类名称', 'warning');
            return;
        }

        if (!state.editingCategoryId) {
            const id = slugify(title);

            if (
                state.data.categories.some(
                    category => category.id === id
                )
            ) {
                toast('该分类已存在', 'warning');
                return;
            }

            state.data.categories.push({
                id,
                title,
                cards: []
            });

            state.currentCategoryId = id;
            toast('分类已创建', 'success');
        } else {
            const category =
                state.data.categories.find(
                    item => item.id === state.editingCategoryId
                );

            if (!category) {
                return closeModal(dom.categoryModal);
            }

            if (
                state.data.categories.some(
                    item =>
                        item.id !== category.id &&
                        item.title === title
                )
            ) {
                toast('已存在同名分类', 'warning');
                return;
            }

            category.title = title;
            toast('分类已更新', 'success');
        }

        closeModal(dom.categoryModal);
        renderCategories();
        renderWebsiteGrid();
        markDirty();
    }

    function deleteCategory() {
        const category = getCurrentCategory();

        if (!category) {
            toast('请选择分类', 'warning');
            return;
        }

        const count =
            (category.cards || []).length;

        if (!confirm(
            `确定删除「${category.title}」吗？` +
            (count
                ? `\n其下 ${count} 个网站也会被删除！`
                : '')
        )) {
            return;
        }

        state.data.categories =
            state.data.categories.filter(
                item => item.id !== category.id
            );

        state.currentCategoryId =
            state.data.categories[0]?.id || null;

        state.selectedWebsites.clear();

        renderCategories();
        renderWebsiteGrid();
        markDirty();

        toast('分类已删除', 'success');
    }

    /*
     * ================================
     * 网站渲染
     * ================================
     */

    function getFilteredCards() {
        const category = getCurrentCategory();

        if (!category) {
            return [];
        }

        const query =
            state.searchQuery.toLowerCase();

        const cards =
            (category.cards || []).filter(card => {
                if (!query) {
                    return true;
                }

                return [
                    card.title,
                    card.url,
                    card.description
                ].some(value =>
                    String(value || '')
                        .toLowerCase()
                        .includes(query)
                );
            });

        return [...cards].sort((a, b) => {
            return Number(Boolean(b.pinned)) -
                Number(Boolean(a.pinned));
        });
    }

    function renderWebsiteGrid() {
        const category =
            getCurrentCategory();

        dom.websiteGrid.innerHTML = '';

        applyViewMode();

        if (!state.data) {
            dom.currentCategoryTitle.textContent =
                '请先读取导航';

            dom.currentCategoryMeta.textContent =
                '等待加载数据';

            showEmpty('🔐', '请点击「读取导航」加载数据');
            return;
        }

        if (!category) {
            dom.currentCategoryTitle.textContent =
                '请选择分类';

            dom.currentCategoryMeta.textContent =
                '共 0 个网站';

            showEmpty('🗂️', '请在左侧选择一个分类');
            return;
        }

        const allCards =
            category.cards || [];

        const cards =
            getFilteredCards();

        dom.currentCategoryTitle.textContent =
            category.title || category.id;

        dom.currentCategoryMeta.innerHTML =
            `共 <strong>${allCards.length}</strong> 个网站` +
            (state.searchQuery
                ? ` · 当前显示 <strong>${cards.length}</strong> 个`
                : '');

        if (!cards.length) {
            showEmpty(
                state.searchQuery ? '🔍' : '📭',
                state.searchQuery
                    ? `未找到「${escapeHtml(state.searchQuery)}」`
                    : '该分类暂无网站，请使用下方表单添加'
            );

            updateBatchButtons();
            return;
        }

        cards.forEach(card => {
            normalizeCard(card);
            renderWebsiteCard(card);
        });

        bindWebsiteDrag();
        updateBatchButtons();
    }

    function renderWebsiteCard(card) {
        const key =
            getCardKey(card);

        const selected =
            state.selectedWebsites.has(key);

        const favicon =
            getFavicon(card.url);

        const cardElement =
            document.createElement('div');

        cardElement.className =
            'website-card' +
            (selected ? ' selected' : '');

        cardElement.dataset.cardKey = key;
        cardElement.draggable =
            !state.searchQuery;

        cardElement.innerHTML = `
            <button class="website-check" type="button">
                ✓
            </button>

            <div class="card-main">
                <div class="card-favicon">
                    ${
                        favicon
                            ? `<img src="${favicon}" alt="" onerror="this.style.display='none'">`
                            : '🌐'
                    }
                </div>

                <div class="card-content">
                    <div class="card-title">
                        ${escapeHtml(card.title || '未命名')}
                    </div>

                    <div
                        class="card-url"
                        title="${escapeHtml(card.url || '')}"
                    >
                        ${escapeHtml(card.url || '无地址')}
                    </div>
                </div>
            </div>

            ${
                card.description
                    ? `<div class="card-description">
                        ${escapeHtml(card.description)}
                       </div>`
                    : ''
            }

            <div class="card-footer">
                ${
                    card.pinned
                        ? '<span class="card-mark" title="已置顶">⚑</span>'
                        : ''
                }
<!---->
                ${
                    card.favorite
                        ? '<span class="card-mark" title="已收藏">★</span>'
                        : ''
                }
<!---->
                <div class="card-actions">
                    <button data-action="favorite" title="收藏">
                        ${card.favorite ? '★' : '☆'}
                    </button>
<!---->
                    <button data-action="pin" title="置顶">
                        ${card.pinned ? '⚑' : '⚐'}
                    </button>
<!---->
                    <button data-action="copy" title="复制链接">
                        ⧉
                    </button>
<!---->
                    <button data-action="visit" title="打开网站">
                        ↗
                    </button>
<!---->
                    <button data-action="edit" title="编辑">
                        ✎
                    </button>
<!---->
                    <button data-action="delete" title="删除">
                        🗑
                    </button>
                
</div>


            </div>
        `;

        const check =
            cardElement.querySelector('.website-check');

        check.addEventListener('click', event => {
            event.stopPropagation();

            toggleWebsiteSelection(
                card,
                cardElement
            );
        });

        cardElement.addEventListener('click', event => {
            const action =
                event.target.closest('[data-action]')
                    ?.dataset.action;

            if (action === 'favorite') {
                event.stopPropagation();
                card.favorite = !card.favorite;
                markDirty();
                renderWebsiteGrid();
                return;
            }

            if (action === 'pin') {
                event.stopPropagation();
                card.pinned = !card.pinned;
                markDirty();
                renderWebsiteGrid();
                return;
            }

            if (action === 'copy') {
                event.stopPropagation();
                copyLink(card.url);
                return;
            }

            if (action === 'visit') {
                event.stopPropagation();

                if (card.url) {
                    window.open(
                        normalizeUrl(card.url),
                        '_blank',
                        'noopener'
                    );
                }

                return;
            }

            if (action === 'edit') {
                event.stopPropagation();
                openWebsiteModal(card);
                return;
            }

            if (action === 'delete') {
                event.stopPropagation();
                deleteWebsite(card);
                return;
            }

            if (
                event.target === cardElement ||
                event.target.closest('.card-main') ||
                event.target.closest('.card-title')
            ) {
                if (card.url) {
                    window.open(
                        normalizeUrl(card.url),
                        '_blank',
                        'noopener'
                    );
                }
            }
        });

        dom.websiteGrid.appendChild(cardElement);
