<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网站导航管理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 760px;
      margin: 30px auto;
      padding: 0 18px;
      color: #222;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    h1 {
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 30px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #1677ff;
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
    }

    button {
      margin-top: 15px;
      margin-right: 8px;
      padding: 10px 17px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: #1677ff;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #0958d9;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .danger {
      background: #d9363e;
    }

    .danger:hover {
      background: #a8071a;
    }

    .secondary {
      background: #666;
    }

    .secondary:hover {
      background: #444;
    }

    .tip {
      padding: 13px;
      border-radius: 6px;
      color: #555;
      background: #f5f5f5;
      line-height: 1.7;
      font-size: 14px;
    }

    .category-box {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    #message {
      margin-top: 20px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .website-list {
      margin-top: 20px;
    }

    .website-empty {
      padding: 16px;
      border-radius: 6px;
      color: #777;
      background: #f5f5f5;
      text-align: center;
      font-size: 14px;
    }

    .website-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }

    .website-info {
      min-width: 0;
      flex: 1;
    }

    .website-title {
      overflow: hidden;
      font-weight: bold;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .website-url {
      overflow: hidden;
      margin-top: 5px;
      color: #777;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .delete-website-button {
      flex: none;
      margin: 0;
      padding: 7px 12px;
      background: #d9363e;
    }

    .delete-website-button:hover {
      background: #a8071a;
    }

    @media (max-width: 520px) {
      .website-item {
        align-items: flex-start;
      }

      .delete-website-button {
        padding: 7px 9px;
      }
    }
  </style>
</head>

<body>
  <h1>网站导航管理</h1>

  <div class="tip">
    先输入管理员密码并读取导航，然后可以添加、删除分类和网站。
    删除或添加后，请点击“保存全部修改”。
  </div>

  <label for="token">
    管理员密码 ADMIN_TOKEN
  </label>

  <input
    id="token"
    type="password"
    placeholder="请输入 Cloudflare 中设置的 ADMIN_TOKEN"
  >

  <button id="loadButton">
    读取当前导航
  </button>

  <div class="category-box">
    <h2>分类管理</h2>
<!---->
    <label for="newCategoryTitle">
      新分类名称
    </label>
<!---->
    <input
      id="newCategoryTitle"
      type="text"
      placeholder="例如：影视资源"
    >
<!---->
    <button id="addCategoryButton">
      添加分类
    </button>
<!---->
    <label for="categorySelect">
      当前分类
    </label>
<!---->
    <select id="categorySelect">
      <option value="">
        请先读取导航
      </option>
    </select>
<!---->
    <button
      id="deleteCategoryButton"
      class="danger"
    >
      删除当前分类
    </button>
  
</div>



  <div class="category-box">
    <h2>添加网站</h2>
<!---->
    <label for="title">
      网站名称
    </label>
<!---->
    <input
      id="title"
      type="text"
      placeholder="例如：百度"
    >
<!---->
    <label for="url">
      网站地址
    </label>
<!---->
    <input
      id="url"
      type="url"
      placeholder="例如：https://www.baidu.com"
    >
<!---->
    <button id="addWebsiteButton">
      添加网站
    </button>
<!---->
    <h2>当前分类的网站</h2>
<!---->
    <div
      id="websiteList"
      class="website-list"
    >
      <div class="website-empty">
        请先读取导航并选择分类。
      
</div>


    </div>
  </div>

  <button
    id="saveButton"
    class="secondary"
  >
    保存全部修改
  </button>

  <div id="message"></div>

  <script>
    const API_BASE =
      "https://shuoce-navigation.2765414002jin.workers.dev";

    let navigationData = null;

    const tokenInput =
      document.getElementById("token");

    const loadButton =
      document.getElementById("loadButton");

    const newCategoryTitleInput =
      document.getElementById("newCategoryTitle");

    const addCategoryButton =
      document.getElementById("addCategoryButton");

    const categorySelect =
      document.getElementById("categorySelect");

    const deleteCategoryButton =
      document.getElementById("deleteCategoryButton");

    const titleInput =
      document.getElementById("title");

    const urlInput =
      document.getElementById("url");

    const addWebsiteButton =
      document.getElementById("addWebsiteButton");

    const websiteList =
      document.getElementById("websiteList");

    const saveButton =
      document.getElementById("saveButton");

    const message =
      document.getElementById("message");


    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color =
        success ? "green" : "crimson";
    }


    function createCategoryId(title) {
      const englishId = title
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");

      if (englishId) {
        return englishId;
      }

      return "category-" + Date.now();
    }


    function getCurrentCategory() {
      if (
        !navigationData ||
        !Array.isArray(navigationData.categories)
      ) {
        return null;
      }

      return navigationData.categories.find(
        category =>
          category.id === categorySelect.value
      );
    }


    function renderCategories(selectedId = "") {
      categorySelect.innerHTML = "";

      if (
        !navigationData ||
        !Array.isArray(navigationData.categories) ||
        navigationData.categories.length === 0
      ) {
        const option =
          document.createElement("option");

        option.value = "";
        option.textContent = "暂无分类";

        categorySelect.appendChild(option);
        renderWebsiteList();
        return;
      }

      navigationData.categories.forEach(category => {
        const option =
          document.createElement("option");

        option.value = category.id;
        option.textContent =
          category.title || category.id;

        categorySelect.appendChild(option);
      });

      if (selectedId) {
        categorySelect.value = selectedId;
      }

      if (!categorySelect.value) {
        categorySelect.selectedIndex = 0;
      }

      renderWebsiteList();
    }


    function renderWebsiteList() {
      websiteList.innerHTML = "";

      if (!navigationData) {
        websiteList.innerHTML =
          '<div class="website-empty">请先读取当前导航。</div>';
        return;
      }

      const category =
        getCurrentCategory();

      if (!category) {
        websiteList.innerHTML =
          '<div class="website-empty">请选择一个分类。</div>';
        return;
      }

      if (!Array.isArray(category.cards)) {
        category.cards = [];
      }

      if (category.cards.length === 0) {
        websiteList.innerHTML =
          '<div class="website-empty">当前分类还没有网站。</div>';
        return;
      }

      category.cards.forEach((card, index) => {
        const item =
          document.createElement("div");

        item.className = "website-item";

        const info =
          document.createElement("div");

        info.className = "website-info";

        const title =
          document.createElement("div");

        title.className = "website-title";
        title.textContent =
          card.title || "未命名网站";

        const url =
          document.createElement("div");

        url.className = "website-url";
        url.textContent =
          card.url || "没有网址";

        const deleteButton =
          document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className =
          "delete-website-button";

        deleteButton.textContent = "删除";

        deleteButton.addEventListener(
          "click",
          () => deleteWebsite(index)
        );

        info.appendChild(title);
        info.appendChild(url);

        item.appendChild(info);
        item.appendChild(deleteButton);

        websiteList.appendChild(item);
      });
    }


    function deleteWebsite(index) {
      if (!navigationData) {
        showMessage("请先读取当前导航。");
        return;
      }

      const category =
        getCurrentCategory();

      if (
        !category ||
        !Array.isArray(category.cards) ||
        !category.cards[index]
      ) {
        showMessage("找不到要删除的网站。");
        return;
      }

      const card =
        category.cards[index];

      const confirmed = confirm(
        "确定要删除网站“" +
        (card.title || "未命名网站") +
        "”吗？"
      );

      if (!confirmed) {
        return;
      }

      category.cards.splice(index, 1);

      renderWebsiteList();

      showMessage(
        "网站已删除，请点击“保存全部修改”正式保存。",
        true
      );
    }


    async function loadNavigation() {
      loadButton.disabled = true;
      showMessage("正在读取导航……");

      try {
        const response = await fetch(
          API_BASE +
          "/api/navigation?time=" +
          Date.now(),
          {
            method: "GET",
            headers: {
              "Accept": "application/json"
            },
            cache: "no-store"
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.message || response.status
          );
        }

        if (
          !data ||
          !Array.isArray(data.categories)
        ) {
          throw new Error(
            "导航数据格式错误。"
          );
        }

        navigationData = data;
        renderCategories();

        showMessage(
          "读取成功，可以管理分类和网站。",
          true
        );
      } catch (error) {
        showMessage(
          "读取失败：" + error.message
        );
      } finally {
        loadButton.disabled = false;
      }
    }


    function addCategory() {
      if (!navigationData) {
        showMessage(
          "请先点击“读取当前导航”。"
        );
        return;
      }

      const title =
        newCategoryTitleInput.value.trim();

      if (!title) {
        showMessage("请输入分类名称。");
        return;
      }

      const id =
        createCategoryId(title);

      const sameCategory =
        navigationData.categories.some(
          category =>
            category.id === id ||
            category.title === title
        );

      if (sameCategory) {
        showMessage("这个分类已经存在。");
        return;
      }

      navigationData.categories.push({
        id: id,
        title: title,
        cards: []
      });

      renderCategories(id);

      newCategoryTitleInput.value = "";

      showMessage(
        "分类已添加，请点击“保存全部修改”正式保存。",
        true
      );
    }


    function deleteCategory() {
      if (!navigationData) {
        showMessage(
          "请先点击“读取当前导航”。"
        );
        return;
      }

      const categoryId =
        categorySelect.value;

      const index =
        navigationData.categories.findIndex(
          category =>
            category.id === categoryId
        );

      if (index === -1) {
        showMessage("请选择要删除的分类。");
        return;
      }

      const category =
        navigationData.categories[index];

      const websiteCount =
        Array.isArray(category.cards)
          ? category.cards.length
          : 0;

      const confirmed = confirm(
        "确定要删除分类“" +
        (category.title || category.id) +
        "”吗？\n\n" +
        "该分类下有 " +
        websiteCount +
        " 个网站，也会一起删除。"
      );

      if (!confirmed) {
        return;
      }

      navigationData.categories.splice(index, 1);

      renderCategories();

      showMessage(
        "分类已删除，请点击“保存全部修改”正式保存。",
        true
      );
    }


    function addWebsite() {
      if (!navigationData) {
        showMessage(
          "请先点击“读取当前导航”。"
        );
        return;
      }

      const category =
        getCurrentCategory();

      const title =
        titleInput.value.trim();

      const websiteUrl =
        urlInput.value.trim();

      if (!category) {
        showMessage("请选择一个分类。");
        return;
      }

      if (!title) {
        showMessage("请输入网站名称。");
        return;
      }

      if (!websiteUrl) {
        showMessage("请输入网站地址。");
        return;
      }

      let parsedUrl;

      try {
        parsedUrl =
          new URL(websiteUrl);
      } catch {
        showMessage(
          "网址格式不正确，例如：https://www.baidu.com"
        );
        return;
      }

      if (
        parsedUrl.protocol !== "http:" &&
        parsedUrl.protocol !== "https:"
      ) {
        showMessage(
          "网站地址必须以 http:// 或 https:// 开头。"
        );
        return;
      }

      if (!Array.isArray(category.cards)) {
        category.cards = [];
      }

      category.cards.push({
        className: "",
        icon: "bi-globe",
        title: title,
        description: "",
        url: websiteUrl
      });

      titleInput.value = "";
      urlInput.value = "";

      renderWebsiteList();

      showMessage(
        "网站已添加，请点击“保存全部修改”。",
        true
      );
    }


    async function saveNavigation() {
      if (!navigationData) {
        showMessage(
          "请先点击“读取当前导航”。"
        );
        return;
      }

      const token =
        tokenInput.value.trim();

      if (!token) {
        showMessage("请输入管理员密码。");
        return;
      }

      saveButton.disabled = true;
      showMessage("正在保存全部修改……");

      try {
        const response = await fetch(
          API_BASE +
          "/api/admin/navigation",
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "Authorization":
                "Bearer " + token
            },
            body:
              JSON.stringify(navigationData)
          }
        );

        const result =
          await response.json();

        if (!response.ok) {
          throw new Error(
            result.message || response.status
          );
        }

        showMessage(
          "保存成功！分类和网站修改已经生效。",
          true
        );
      } catch (error) {
        showMessage(
          "保存失败：" + error.message
        );
      } finally {
        saveButton.disabled = false;
      }
    }


    loadButton.addEventListener(
      "click",
      loadNavigation
    );

    categorySelect.addEventListener(
      "change",
      renderWebsiteList
    );

    addCategoryButton.addEventListener(
      "click",
      addCategory
    );

    deleteCategoryButton.addEventListener(
      "click",
      deleteCategory
    );

    addWebsiteButton.addEventListener(
      "click",
      addWebsite
    );

    saveButton.addEventListener(
      "click",
      saveNavigation
    );
  </script>
</body>
</html>
