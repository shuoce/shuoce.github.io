

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07111f">
    <title>硕策导航 · 云端管理控制台</title>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --bg: #07111f;
            --panel: rgba(12, 27, 45, 0.75);
            --panel-solid: #0b182b;
            --panel-card: rgba(255, 255, 255, 0.04);
            --panel-card-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.12);
            --border-focus: rgba(86, 214, 255, 0.45);
            --primary: #56d6ff;
            --primary-glow: rgba(86, 214, 255, 0.28);
            --secondary: #8d7cff;
            --danger: #ff5e7e;
            --danger-soft: rgba(255, 94, 126, 0.15);
            --success: #00f0aa;
            --text: #f5f9ff;
            --text-muted: #8aa0ba;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 8px;
            --trans: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background: 
                radial-gradient(circle at 10% 20%, rgba(86, 214, 255, 0.08), transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(141, 124, 255, 0.08), transparent 35%);
            pointer-events: none;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(86, 214, 255, 0.35); }

        .app-layout {
            display: grid;
            grid-template-columns: 290px 1fr;
            min-height: 100vh;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            background: rgba(8, 19, 34, 0.92);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            z-index: 50;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
        }

        .brand-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--border);
            object-fit: cover;
            box-shadow: 0 0 20px rgba(86, 214, 255, 0.25);
        }

        .brand-title h1 {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-title span {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            display: block;
        }

        .sidebar-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 0 8px;
            margin-bottom: 10px;
        }

        .category-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .cat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--trans);
            user-select: none;
        }

        .cat-item:hover {
            color: var(--text);
            background: var(--panel-card);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .cat-item.active {
            color: #fff;
            background: rgba(86, 214, 255, 0.12);
            border-color: var(--border-focus);
            box-shadow: 0 4px 18px rgba(86, 214, 255, 0.15);
        }

        .cat-item .cat-icon {
            font-size: 15px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .cat-item .cat-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cat-item .cat-badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .cat-item.active .cat-badge {
            background: rgba(86, 214, 255, 0.25);
            color: #fff;
        }

        /* 分类移动按钮组 */
        .cat-item-actions {
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: var(--trans);
            flex-shrink: 0;
        }

        .cat-item:hover .cat-item-actions,
        .cat-item.active .cat-item-actions {
            opacity: 1;
        }

        .cat-move-btn {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            display: grid;
            place-items: center;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            padding: 0;
            transition: var(--trans);
        }

        .cat-move-btn:hover {
            color: #fff;
            background: var(--primary);
            color: #07111f;
        }

        .cat-item.dragging {
            opacity: 0.3;
            transform: scale(0.96);
        }

        .sidebar-footer {
            padding-top: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ===== 按钮通用 ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--trans);
            white-space: nowrap;
            text-decoration: none;
            background: transparent;
            color: var(--text);
        }

        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #48b8ea);
            color: #051322;
            font-weight: 700;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .btn-primary:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-glass {
            background: var(--panel-card);
            border-color: var(--border);
            color: var(--text);
        }

        .btn-glass:hover:not(:disabled) {
            background: var(--panel-card-hover);
            border-color: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        .btn-danger-glass {
            background: var(--danger-soft);
            border-color: rgba(255, 94, 126, 0.3);
            color: var(--danger);
        }

        .btn-danger-glass:hover:not(:disabled) {
            background: rgba(255, 94, 126, 0.25);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: var(--radius-sm);
        }

        .btn-icon {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 8px;
        }

        /* ===== 主内容区 ===== */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            padding: 14px 28px;
            background: rgba(7, 17, 31, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 380px;
        }

        .search-container i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-container input {
            width: 100%;
            padding: 9px 14px 9px 38px;
            border-radius: 99px;
            border: 1px solid var(--border);
            background: var(--panel-card);
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: var(--trans);
        }

        .search-container input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(86, 214, 255, 0.15);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-pill.online .status-dot {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .status-pill.dirty {
            border-color: rgba(255, 184, 77, 0.4);
            color: #ffb84d;
        }

        .status-pill.dirty .status-dot {
            background: #ffb84d;
            box-shadow: 0 0 8px #ffb84d;
        }

        .workspace {
            flex: 1;
            padding: 24px 28px;
            max-width: 1380px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .category-header {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .cat-hero-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .cat-hero-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(86, 214, 255, 0.12);
            color: var(--primary);
            display: grid;
            place-items: center;
            font-size: 20px;
            border: 1px solid rgba(86, 214, 255, 0.2);
        }

        .cat-hero-text h2 {
            font-size: 17px;
            font-weight: 800;
        }

        .cat-hero-text p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .cat-hero-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .batch-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            background: rgba(86, 214, 255, 0.12);
            border: 1px solid var(--border-focus);
            font-size: 13px;
        }

        .batch-bar.show { display: flex; }

        /* ===== 卡片网格 ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
        }

        .site-card {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: var(--trans);
            cursor: pointer;
            overflow: hidden;
            user-select: none;
        }

        .site-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: var(--trans);
        }

        .site-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-focus);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .site-card:hover::after { opacity: 1; }

        .site-card.selected {
            border-color: var(--primary);
            background: rgba(86, 214, 255, 0.08);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .site-card.dragging {
            opacity: 0.35;
            transform: scale(0.97);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .card-avatar img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .card-checkbox {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: grid;
            place-items: center;
            color: transparent;
            font-size: 11px;
            transition: var(--trans);
        }

        .site-card:hover .card-checkbox { border-color: var(--primary); }
        .site-card.selected .card-checkbox {
            background: var(--primary);
            border-color: var(--primary);
            color: #07111f;
        }

        .card-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 44px;
        }

        .card-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-url-pill {
            font-size: 10px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 3px 6px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            margin-top: 4px;
        }

        /* 悬浮操作栏（带位移与管理） */
        .card-hover-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            opacity: 0;
            transition: var(--trans);
        }

        .site-card:hover .card-hover-actions { opacity: 1; }

        .empty-box {
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
            background: var(--panel);
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            color: var(--text-muted);
        }

        .empty-box i {
            font-size: 38px;
            color: var(--primary);
            margin-bottom: 12px;
            display: block;
        }

        .quick-dock {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .quick-dock-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-dock-form {
            display: grid;
            grid-template-columns: 1fr 1.6fr auto;
            gap: 12px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: var(--trans);
        }

        .form-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(86, 214, 255, 0.15);
        }

        /* 弹窗系统 */
        .modal-mask {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(4, 11, 20, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: var(--trans);
        }

        .modal-mask.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            width: 100%;
            max-width: 450px;
            background: rgba(13, 29, 49, 0.96);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            padding: 24px;
            transform: translateY(15px) scale(0.96);
            transition: var(--trans);
        }

        .modal-mask.open .modal-window {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .modal-header h3 {
            font-size: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        /* Toast 消息提示 */
        #toast-box {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast-item {
            background: rgba(13, 29, 49, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: var(--radius-md);
            padding: 12px 18px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            animation: toastIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast-item.success { border-left-color: var(--success); }
        .toast-item.error { border-left-color: var(--danger); }
        .toast-item.warning { border-left-color: #ffb84d; }

        @keyframes toastIn {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 900px) {
            .app-layout { grid-template-columns: 1fr; }
            .sidebar {
                height: auto;
                position: static;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .category-list {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 8px;
            }
            .cat-item { flex-shrink: 0; }
            .cat-item-actions { opacity: 1; }
            .card-hover-actions { opacity: 1; }
            .sidebar-footer { flex-direction: row; }
            .workspace { padding: 16px; }
            .quick-dock-form { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- 左侧分类与快捷操作 -->
        <aside class="sidebar">
            <div class="brand-box">
                <img class="brand-avatar" src="https://img.baidu.re/i/2026/08/swgwn4.jpg" alt="Logo">
                <div class="brand-title">
                    <h1>硕策控制台</h1>
                    <span>CLOUD NAVIGATION</span>
                </div>
            </div>

            <button id="addCategoryBtn" class="btn btn-primary" style="margin-bottom: 16px; width: 100%;">
                <i class="bi bi-plus-lg"></i> 新建分类
            </button>

            <div class="sidebar-section-title">
                <span>分类管理 (可拖拽/可按键)</span>
                <span id="categoryCount" style="color: var(--primary);">0</span>
            </div>

            <div id="categoryList" class="category-list"></div>

            <div class="sidebar-footer">
                <button id="restoreBtn" class="btn btn-glass btn-sm" title="从本地缓存恢复">
                    <i class="bi bi-arrow-counterclockwise"></i> 恢复备份
                </button>
                <button id="backupBtn" class="btn btn-glass btn-sm" title="备份到浏览器本地">
                    <i class="bi bi-cloud-arrow-down"></i> 本地备份
                </button>
            </div>
        </aside>

        <!-- 右侧主控制区 -->
        <main class="main-wrapper">
            <!-- 顶部工具条 -->
            <header class="topbar">
                <div class="search-container">
                    <i class="bi bi-search"></i>
                    <input id="searchInput" type="text" placeholder="全局检索网站标题、网址、描述..." autocomplete="off">
                </div>

                <div class="topbar-actions">
                    <div id="statusPill" class="status-pill">
                        <span class="status-dot"></span>
                        <span id="statusText">正在检查...</span>
                    </div>

                    <a href="index.html" target="_blank" class="btn btn-glass btn-sm" title="打开前台页面预览">
                        <i class="bi bi-box-arrow-up-right"></i> 前台
                    </a>

                    <button id="importBtn" class="btn btn-glass btn-sm">

            <!-- 工作台 -->
            <div class="workspace">
                <!-- 分类面板控制栏 -->
                <div class="category-header">

                    <div class="cat-hero-actions">

                <!-- 批量操作通知条 -->
                <div id="batchBar" class="batch-bar">
                    <span>已选择 <strong id="selectedCount" style="color:var(--primary)">0</strong> 个网站卡片</span>
                    <div style="display:flex; gap:8px;">
                        <button id="batchMoveBtn" class="btn btn-glass btn-sm">
                            <i class="bi bi-folder-symlink"></i> 移动到其他分类

                <!-- 网站卡片瀑布流网格 -->

                <!-- 快速录入栏 -->

    <div id="authModal" class="modal-mask">
        <div class="modal-window">

    <!-- 弹窗：批量移动 -->
    <div id="moveModal" class="modal-mask">
        <div class="modal-window">
            <div class="modal-header">
                <h3><i class="bi bi-folder-symlink" style="color: var(--primary);"></i> 批量移动网站</h3>
                <button class="btn btn-icon btn-glass btn-sm close-modal"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>请选择目标分类</label>
                    <select id="moveTargetSelect" class="form-input" style="background:var(--panel-solid)"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-glass close-modal">取消</button>
                <button id="confirmMoveBtn" class="btn btn-primary">确认转移</button>
            </div>
        </div>
    </div>

    <div id="toast-box"></div>

    <script>
        (() => {
            'use strict';

            const API_BASE = "https://proxyd.picpi.top/https://shuoce-navigation.2765414002jin.workers.dev";
            const STORAGE_KEY = 'shuoce_admin_token';
            const BACKUP_KEY = 'shuoce_navigation_backup';

            const state = {
                data: null,
                currentCatId: null,
                token: sessionStorage.getItem(STORAGE_KEY) || '',
                editingCardId: null,
                selectedCards: new Set(),
                searchKey: '',
                isDirty: false,
                dragNode: null
            };

            const $ = sel => document.querySelector(sel);
            const dom = {
                categoryList: $('#categoryList'),
                categoryCount: $('#categoryCount'),
                cardsGrid: $('#cardsGrid'),
                catHeroTitle: $('#catHeroTitle'),
                catHeroMeta: $('#catHeroMeta'),
                catHeroIcon: $('#catHeroIcon'),
                statusPill: $('#statusPill'),
                statusText: $('#statusText'),
                saveBtn: $('#saveBtn'),
                authBtn: $('#authBtn'),
                authBtnText: $('#authBtnText'),
                batchBar: $('#batchBar'),
                selectedCount: $('#selectedCount'),
                searchInput: $('#searchInput')
            };

            function notify(msg, type = 'info', timeout = 2500) {
                const box = $('#toast-box');
                const el = document.createElement('div');
                el.className = `toast-item ${type}`;
                const icons = {
                    success: 'bi-check-circle-fill',
                    error: 'bi-exclamation-triangle-fill',
                    warning: 'bi-exclamation-circle-fill',
                    info: 'bi-info-circle-fill'
                };
                el.innerHTML = `<i class="bi ${icons[type] || icons.info}"></i> <span>${msg}</span>`;
                box.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(-10px)';
                    el.style.transition = 'all .3s';
                    setTimeout(() => el.remove(), 300);
                }, timeout);
            }

            function setDirty(dirty) {
                state.isDirty = dirty;
                if (dirty) {
                    dom.statusPill.className = 'status-pill dirty';
                    dom.statusText.textContent = '有未同步改动';
                    saveLocalBackup();
                    window.onbeforeunload = () => true;
                } else {
                    dom.statusPill.className = 'status-pill online';
                    dom.statusText.textContent = '已同步至KV';
                    window.onbeforeunload = null;
                }
            }

            function normalizeUrl(url) {
                url = String(url || '').trim();
                if (!url) return '';
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                return url;
            }

            function normalizeIconClass(icon, fallback = 'bi-globe') {
    const raw = String(icon || '').trim();

    // 支持 bi-robot、robot、bi bi-robot 等写法
    const matched = raw.match(/(?:^|\s)(bi-[a-z0-9-]+)/i);

    if (matched) {
        return `bi ${matched[1]}`;
    }

    const cleaned = raw
        .replace(/^bi-/, '')
        .replace(/[^a-z0-9-]/gi, '');

    return cleaned
        ? `bi bi-${cleaned}`
        : `bi ${fallback}`;
}

            function getFavicon(url) {
    try {
        const target = new URL(normalizeUrl(url));

        return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(target.hostname)}&sz=64`;
    } catch {
        return null;
    }
}

            const getCurrentCategory = () => state.data?.categories?.find(c => c.id === state.currentCatId) || null;

            function saveLocalBackup() {
                if (!state.data) return;
                try {
                    localStorage.setItem(BACKUP_KEY, JSON.stringify({ data: state.data, time: Date.now() }));
                } catch {}
            }

            /* ==========================================================
               分类位置调整逻辑（支持按键移动与拖拽）
               ========================================================== */
            function moveCategory(index, delta) {
                const cats = state.data?.categories;
                if (!cats) return;
                const target = index + delta;
                if (target < 0 || target >= cats.length) return;

                const [moved] = cats.splice(index, 1);
                cats.splice(target, 0, moved);
                renderCategories();
                setDirty(true);
                notify('分类顺序已调整', 'success');
            }

            function renderCategories() {
                const cats = state.data?.categories || [];
                dom.categoryList.innerHTML = '';
                dom.categoryCount.textContent = cats.length;

                cats.forEach((cat, index) => {
                    const item = document.createElement('div');
                    item.className = `cat-item ${cat.id === state.currentCatId ? 'active' : ''}`;
                    item.draggable = true;
                    item.dataset.id = cat.id;

                    const iconCls = normalizeIconClass(cat.icon, 'bi-folder2');
                    item.innerHTML = `
                        <i class="${iconCls} cat-icon"></i>
                        <span class="cat-name">${cat.title || cat.name || cat.id}</span>
                        <span class="cat-badge">${(cat.cards || []).length}</span>
                        <div class="cat-item-actions">
                            <button type="button" class="cat-move-btn move-up" title="上移分类"><i class="bi bi-chevron-up"></i></button>
                            <button type="button" class="cat-move-btn move-down" title="下移分类"><i class="bi bi-chevron-down"></i></button>
                        </div>
                    `;

                    // 上下移动按键响应
                    item.querySelector('.move-up').addEventListener('click', e => {
                        e.stopPropagation();
                        moveCategory(index, -1);
                    });

                    item.querySelector('.move-down').addEventListener('click', e => {
                        e.stopPropagation();
                        moveCategory(index, 1);
                    });

                    // 点击切换当前分类
                    item.addEventListener('click', () => {
                        state.currentCatId = cat.id;
                        state.selectedCards.clear();
                        renderCategories();
                        renderCards();
                    });

                    // 拖拽
                    item.addEventListener('dragstart', e => {
                        state.dragNode = item;
                        item.classList.add('dragging');
                        e.dataTransfer.setData('text/plain', cat.id);
                    });

                    item.addEventListener('dragover', e => {
                        e.preventDefault();
                        if (state.dragNode === item) return;
                        item.style.borderColor = 'var(--primary)';
                    });

                    item.addEventListener('dragleave', () => {
                        item.style.borderColor = 'transparent';
                    });

                    item.addEventListener('drop', e => {
                        e.preventDefault();
                        item.style.borderColor = 'transparent';
                        const sourceId = state.dragNode?.dataset.id;
                        if (!sourceId || sourceId === cat.id) return;

                        const from = cats.findIndex(c => c.id === sourceId);
                        const to = cats.findIndex(c => c.id === cat.id);
                        if (from < 0 || to < 0) return;

                        const [moved] = cats.splice(from, 1);
                        cats.splice(to, 0, moved);
                        renderCategories();
                        setDirty(true);
                        notify('分类顺序已调整', 'success');
                    });

                    item.addEventListener('dragend', () => {
                        item.classList.remove('dragging');
                        state.dragNode = null;
                    });

                    dom.categoryList.appendChild(item);
                });
            }

            /* ==========================================================
               卡片位置调整逻辑（支持按键前移/后移与拖拽）
               ========================================================== */
            function moveCard(card, delta) {
                const cat = getCurrentCategory();
                if (!cat) return;
                const index = (cat.cards || []).indexOf(card);
                if (index < 0) return;
                const target = index + delta;
                if (target < 0 || target >= cat.cards.length) return;

                const [moved] = cat.cards.splice(index, 1);
                cat.cards.splice(target, 0, moved);
                renderCards();
                setDirty(true);
                notify('卡片顺序已调整', 'success');
            }

            function renderCards() {
                const cat = getCurrentCategory();
                dom.cardsGrid.innerHTML = '';
                updateBatchBar();

                if (!state.data) {
                    dom.catHeroTitle.textContent = '未读取数据';
                    dom.catHeroMeta.textContent = '请先点击右上角输入 Token 验证';
                    dom.cardsGrid.innerHTML = `
                        <div class="empty-box">
                            <i class="bi bi-shield-lock"></i>
                            <p>尚未载入导航配置，请点击右上角「Token」从云端拉取</p>
                        </div>
                    `;
                    return;
                }

                if (!cat) {
                    dom.catHeroTitle.textContent = '请选择或创建分类';
                    dom.catHeroMeta.textContent = '在左侧点击一个分类进行管理';
                    dom.cardsGrid.innerHTML = `
                        <div class="empty-box">
                            <i class="bi bi-folder-plus"></i>
                            <p>当前无活动分类，请在左侧新建分类</p>
                        </div>
                    `;
                    return;
                }

                const catIconCls = cat.icon ? (cat.icon.startsWith('bi-') ? cat.icon : 'bi-' + cat.icon) : 'bi-folder2-open';
                dom.catHeroIcon.innerHTML = `<i class="bi ${catIconCls}"></i>`;
                dom.catHeroTitle.textContent = cat.title || cat.name || cat.id;

                const q = state.searchKey.toLowerCase();
                const cards = (cat.cards || []).filter(c =>
                    !q ||
                    (c.title || '').toLowerCase().includes(q) ||
                    (c.url || '').toLowerCase().includes(q) ||
                    (c.description || '').toLowerCase().includes(q)
                );

                dom.catHeroMeta.textContent = `共 ${cat.cards.length} 个网站` + (q ? ` · 检索出 ${cards.length} 项` : '');

                if (!cards.length) {
                    dom.cardsGrid.innerHTML = `
                        <div class="empty-box">
                            <i class="bi bi-inbox"></i>
                            <p>${q ? `未匹配到与「${state.searchKey}」相关的网站` : '该分类暂无网站，可在下方快速录入'}</p>
                        </div>
                    `;
                    return;
                }

                cards.forEach(card => {
                    const cardKey = card.id || card.url || card.title;
                    const isSelected = state.selectedCards.has(cardKey);
                    const faviconUrl = getFavicon(card.url);
const fallbackIconClass = normalizeIconClass(card.icon, 'bi-globe');

const el = document.createElement('div');
                    el.className = `site-card ${isSelected ? 'selected' : ''}`;
                    el.draggable = !q;
                    el.dataset.key = cardKey;

                    el.innerHTML = `
                        <div class="card-top">
                            <div class="card-avatar"></div>
                            <div class="card-checkbox"><i class="bi bi-check-lg"></i></div>
                        </div>

                        <div class="card-main">
                            <span class="card-title" title="${card.title || ''}">${card.title || '未命名'}</span>
                            <span class="card-desc">${card.description || '暂无描述'}</span>
                            <span class="card-url-pill">${card.url || '无链接'}</span>
                        </div>

                        <div class="card-hover-actions">
                            <button class="btn btn-icon btn-glass btn-sm action-prev" title="向左前移"><i class="bi bi-arrow-left-short"></i></button>
                            <button class="btn btn-icon btn-glass btn-sm action-next" title="向右后移"><i class="bi bi-arrow-right-short"></i></button>
                            <button class="btn btn-icon btn-glass btn-sm action-visit" title="打开网址"><i class="bi bi-arrow-up-right"></i></button>
                            <button class="btn btn-icon btn-glass btn-sm action-copy" title="复制链接"><i class="bi bi-copy"></i></button>
                            <button class="btn btn-icon btn-glass btn-sm action-edit" title="编辑与换分类"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-icon btn-danger-glass btn-sm action-delete" title="删除"><i class="bi bi-trash"></i></button>
                        </div>
                    `;

const avatar = el.querySelector('.card-avatar');

function renderFallbackIcon() {
    const icon = document.createElement('i');
    icon.className = fallbackIconClass;
    avatar.replaceChildren(icon);
}

if (faviconUrl) {
    const image = document.createElement('img');

    image.src = faviconUrl;
    image.alt = '';
    image.loading = 'lazy';
    image.decoding = 'async';
    image.referrerPolicy = 'no-referrer';

    image.addEventListener('error', () => {
        renderFallbackIcon();
    }, { once: true });

    avatar.appendChild(image);
} else {
    renderFallbackIcon();
}

                    // 移动前置/后置
                    el.querySelector('.action-prev').addEventListener('click', e => {
                        e.stopPropagation();
                        moveCard(card, -1);
                    });

                    el.querySelector('.action-next').addEventListener('click', e => {
                        e.stopPropagation();
                        moveCard(card, 1);
                    });

                    // 选中
                    el.querySelector('.card-checkbox').addEventListener('click', e => {
                        e.stopPropagation();
                        toggleSelectCard(cardKey, el);
                    });

                    el.querySelector('.action-visit').addEventListener('click', e => {
                        e.stopPropagation();
                        card.url && window.open(card.url, '_blank');
                    });

                    el.querySelector('.action-copy').addEventListener('click', async e => {
                        e.stopPropagation();
                        if (!card.url) return;
                        await navigator.clipboard.writeText(card.url);
                        notify('链接已复制到剪贴板', 'success');
                    });

                    el.querySelector('.action-edit').addEventListener('click', e => {
                        e.stopPropagation();
                        openEditSiteModal(card);
                    });

                    el.querySelector('.action-delete').addEventListener('click', e => {
                        e.stopPropagation();
                        deleteSingleCard(card);
                    });

                    el.addEventListener('click', () => {
                        card.url && window.open(card.url, '_blank');
                    });

                    // 拖拽排序
                    el.addEventListener('dragstart', e => {
                        state.dragNode = el;
                        el.classList.add('dragging');
                        e.dataTransfer.setData('text/plain', cardKey);
                    });

                    el.addEventListener('dragover', e => {
                        e.preventDefault();
                        if (state.dragNode === el) return;
                        dom.cardsGrid.insertBefore(state.dragNode, el);
                    });

                    el.addEventListener('dragend', () => {
                        el.classList.remove('dragging');
                        state.dragNode = null;
                        
                        const currentElements = Array.from(dom.cardsGrid.querySelectorAll('.site-card'));
                        const keyMap = new Map((cat.cards || []).map(c => [c.id || c.url || c.title, c]));
                        cat.cards = currentElements.map(node => keyMap.get(node.dataset.key)).filter(Boolean);
                        setDirty(true);
                        notify('网站卡片排序已同步', 'success');
                    });

                    dom.cardsGrid.appendChild(el);
                });
            }

            // 多选批量操作
            function toggleSelectCard(key, el) {
                if (state.selectedCards.has(key)) {
                    state.selectedCards.delete(key);
                    el.classList.remove('selected');
                } else {
                    state.selectedCards.add(key);
                    el.classList.add('selected');
                }
                updateBatchBar();
            }

            function updateBatchBar() {
                const count = state.selectedCards.size;
                dom.selectedCount.textContent = count;
                dom.batchBar.classList.toggle('show', count > 0);
            }

            $('#cancelSelectBtn').addEventListener('click', () => {
                state.selectedCards.clear();
                renderCards();
            });

            $('#batchDeleteBtn').addEventListener('click', () => {
                const cat = getCurrentCategory();
                if (!cat || !state.selectedCards.size) return;
                if (!confirm(`确定彻底删除选中的 ${state.selectedCards.size} 个网站吗？`)) return;

                cat.cards = cat.cards.filter(c => !state.selectedCards.has(c.id || c.url || c.title));
                state.selectedCards.clear();
                renderCategories();
                renderCards();
                setDirty(true);
                notify('已批量删除所选卡片', 'success');
            });

            $('#batchMoveBtn').addEventListener('click', () => {
                if (!state.selectedCards.size) return;
                const select = $('#moveTargetSelect');
                select.innerHTML = '';

                (state.data?.categories || []).forEach(c => {
                    if (c.id === state.currentCatId) return;
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.title || c.id;
                    select.appendChild(opt);
                });

                if (!select.children.length) return notify('没有可供迁入的其他分类', 'warning');
                openModal('#moveModal');
            });

            $('#confirmMoveBtn').addEventListener('click', () => {
                const targetId = $('#moveTargetSelect').value;
                const cat = getCurrentCategory();
                const targetCat = state.data?.categories?.find(c => c.id === targetId);

                if (!cat || !targetCat) return closeModal('#moveModal');

                const movingCards = cat.cards.filter(c => state.selectedCards.has(c.id || c.url || c.title));
                cat.cards = cat.cards.filter(c => !state.selectedCards.has(c.id || c.url || c.title));
                targetCat.cards = targetCat.cards || [];
                targetCat.cards.push(...movingCards);

                state.selectedCards.clear();
                closeModal('#moveModal');
                renderCategories();
                renderCards();
                setDirty(true);
                notify(`已将 ${movingCards.length} 个网站转移至「${targetCat.title}」`, 'success');
            });

            // 网站单项操作与单卡片跨分类转移
            function deleteSingleCard(card) {
                const cat = getCurrentCategory();
                if (!cat) return;
                if (!confirm(`确定删除网站「${card.title}」吗？`)) return;

                cat.cards = cat.cards.filter(c => c !== card);
                state.selectedCards.delete(card.id || card.url || card.title);
                renderCategories();
                renderCards();
                setDirty(true);
                notify('网站已删除', 'success');
            }

            function openEditSiteModal(card) {
                state.editingCardId = card.id || card.url || card.title;
                $('#modalSiteTitle').value = card.title || '';
                $('#modalSiteUrl').value = card.url || '';
                $('#modalSiteDesc').value = card.description || '';
                $('#modalSiteIcon').value = card.icon || '';

                // 填充分类下拉框
                const catSelect = $('#modalSiteCategory');
                catSelect.innerHTML = '';
                (state.data?.categories || []).forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.title || c.id;
                    if (c.id === state.currentCatId) opt.selected = true;
                    catSelect.appendChild(opt);
                });

                openModal('#websiteModal');
            }

            $('#saveWebsiteBtn').addEventListener('click', () => {
                const currentCat = getCurrentCategory();
                const card = currentCat?.cards?.find(c => (c.id || c.url || c.title) === state.editingCardId);
                if (!card) return closeModal('#websiteModal');

                const title = $('#modalSiteTitle').value.trim();
                const url = normalizeUrl($('#modalSiteUrl').value);
                const targetCatId = $('#modalSiteCategory').value;

                if (!title) return notify('请填写网站名称', 'warning');
                if (!url) return notify('请填写有效网址', 'warning');

                card.title = title;
                card.url = url;
                card.description = $('#modalSiteDesc').value.trim();
                card.icon = $('#modalSiteIcon').value.trim() || 'bi-globe';

                // 判断是否切换了分类
                if (targetCatId && targetCatId !== state.currentCatId) {
                    const targetCat = state.data?.categories?.find(c => c.id === targetCatId);
                    if (targetCat) {
                        currentCat.cards = currentCat.cards.filter(c => c !== card);
                        targetCat.cards = targetCat.cards || [];
                        targetCat.cards.push(card);
                        notify(`已更新并转移至分类「${targetCat.title}」`, 'success');
                    }
                } else {
                    notify('网站信息已更新', 'success');
                }

                closeModal('#websiteModal');
                renderCategories();
                renderCards();
                setDirty(true);
            });

            // 快捷添加
            $('#quickAddForm').addEventListener('submit', e => {
                e.preventDefault();
                const cat = getCurrentCategory();
                if (!cat) return notify('请先在左侧选择分类', 'warning');

                let title = $('#quickTitle').value.trim();
                let url = normalizeUrl($('#quickUrl').value);

                if (!url) return notify('请输入网站地址', 'warning');

                if (!title) {
                    try {
                        title = new URL(url).hostname.replace(/^www\./, '');
                    } catch {
                        return notify('请输入网站名称', 'warning');
                    }
                }

                cat.cards = cat.cards || [];
                cat.cards.push({
                    id: 'card-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                    title,
                    url,
                    description: '',
                    icon: 'bi-globe'
                });

                $('#quickTitle').value = '';
                $('#quickUrl').value = '';
                renderCategories();
                renderCards();
                setDirty(true);
                notify('网站已添加', 'success');
            });

            // 分类增改删
            $('#addCategoryBtn').addEventListener('click', () => {
                if (!state.data) return notify('请先完成鉴权加载数据', 'warning');
                const title = prompt('请输入新分类名称：');
                if (!title?.trim()) return;

                const id = 'cat-' + Date.now();
                state.data.categories.push({
                    id,
                    title: title.trim(),
                    icon: 'bi-folder2',
                    cards: []
                });

                state.currentCatId = id;
                renderCategories();
                renderCards();
                setDirty(true);
                notify('分类已创建', 'success');
            });

            $('#editCatBtn').addEventListener('click', () => {
                const cat = getCurrentCategory();
                if (!cat) return;
                $('#modalCatTitle').value = cat.title || '';
                $('#modalCatIcon').value = cat.icon || 'bi-folder2';
                openModal('#categoryModal');
            });

            $('#saveCategoryBtn').addEventListener('click', () => {
                const cat = getCurrentCategory();
                if (!cat) return;

                const title = $('#modalCatTitle').value.trim();
                if (!title) return notify('分类名称不能为空', 'warning');

                cat.title = title;
                cat.icon = $('#modalCatIcon').value.trim() || 'bi-folder2';

                closeModal('#categoryModal');
                renderCategories();
                renderCards();
                setDirty(true);
                notify('分类属性已更新', 'success');
            });

            $('#deleteCatBtn').addEventListener('click', () => {
                const cat = getCurrentCategory();
                if (!cat) return;
                if (!confirm(`确定彻底删除分类「${cat.title}」及其下的全部网站吗？`)) return;

                state.data.categories = state.data.categories.filter(c => c.id !== cat.id);
                state.currentCatId = state.data.categories[0]?.id || null;
                renderCategories();
                renderCards();
                setDirty(true);
                notify('分类已删除', 'success');
            });

            // 模态弹窗系统
            function openModal(sel) { $(sel).classList.add('open'); }
            function closeModal(sel) { $(sel).classList.remove('open'); }

            document.querySelectorAll('.close-modal').forEach(btn => {
                btn.addEventListener('click', e => {
                    const mask = e.target.closest('.modal-mask');
                    if (mask) mask.classList.remove('open');
                });
            });

            document.querySelectorAll('.modal-mask').forEach(mask => {
                mask.addEventListener('mousedown', e => {
                    if (e.target === mask) mask.classList.remove('open');
                });
            });

            // 云端请求与同步
            async function fetchCloudData(token) {
                try {
                    notify('正在同步云端数据...', 'info', 1000);
                    const res = await fetch(`${API_BASE}/api/navigation?t=${Date.now()}`, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                        },
                        cache: 'no-store'
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    if (!data?.categories) throw new Error('数据结构异常');

                    state.data = data;
                    state.currentCatId = data.categories[0]?.id || null;
                    setDirty(false);
                    closeModal('#authModal');
                    renderCategories();
                    renderCards();
                    notify('导航配置拉取成功', 'success');
                } catch (err) {
                    notify(`拉取失败: ${err.message}`, 'error');
                    openModal('#authModal');
                }
            }

            async function saveToCloudKV() {
                if (!state.data) return notify('无数据可保存', 'warning');
                if (!state.token) {
                    notify('保存需要管理员权限，请先输入 Token', 'warning');
                    openModal('#authModal');
                    return;
                }

                dom.saveBtn.disabled = true;
                dom.saveBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> 同步中...';

                try {
                    const res = await fetch(`${API_BASE}/api/admin/navigation`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${state.token}`
                        },
                        body: JSON.stringify(state.data)
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    setDirty(false);
                    notify('🎉 保存成功！所有修改已即时同步至KV', 'success');
                } catch (err) {
                    notify(`保存失败: ${err.message}`, 'error', 4000);
                    if (err.message.includes('401')) openModal('#authModal');
                } finally {
                    dom.saveBtn.disabled = false;
                    dom.saveBtn.innerHTML = '<i class="bi bi-cloud-check-fill"></i> 同步到KV';
                }
            }

            dom.saveBtn.addEventListener('click', saveToCloudKV);

            dom.authBtn.addEventListener('click', () => {
                $('#modalTokenInput').value = state.token || '';
                openModal('#authModal');
            });

            $('#confirmAuthBtn').addEventListener('click', () => {
                const token = $('#modalTokenInput').value.trim();
                if (!token) return notify('请输入管理员密码', 'warning');
                state.token = token;
                sessionStorage.setItem(STORAGE_KEY, token);
                dom.authBtnText.textContent = 'Token已存';
                fetchCloudData(token);
            });

            $('#clearSavedTokenBtn').addEventListener('click', () => {
                state.token = '';
                sessionStorage.removeItem(STORAGE_KEY);
                dom.authBtnText.textContent = 'Token';
                closeModal('#authModal');
                notify('已清除会话密码', 'info');
            });

            dom.searchInput.addEventListener('input', e => {
                state.searchKey = e.target.value.trim();
                renderCards();
            });

            $('#exportBtn').addEventListener('click', () => {
                if (!state.data) return notify('没有可导出的数据', 'warning');
                const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `shuoce-navigation-${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
                notify('配置已导出为 JSON', 'success');
            });

            $('#importBtn').addEventListener('click', () => $('#importFileInput').click());
            $('#importFileInput').addEventListener('change', e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = evt => {
                    try {
                        const json = JSON.parse(evt.target.result);
                        if (!json.categories) throw new Error('缺少 categories 字段');
                        if (!confirm('导入将覆盖当前未保存的内容，是否继续？')) return;
                        state.data = json;
                        state.currentCatId = json.categories[0]?.id || null;
                        renderCategories();
                        renderCards();
                        setDirty(true);
                        notify('数据导入成功，请核对并同步到KV', 'success');
                    } catch (err) {
                        notify(`导入失败: ${err.message}`, 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            });

            $('#backupBtn').addEventListener('click', () => {
                if (!state.data) return notify('没有数据可备份', 'warning');
                saveLocalBackup();
                notify('已完整备份至浏览器本地', 'success');
            });

            $('#restoreBtn').addEventListener('click', () => {
                const raw = localStorage.getItem(BACKUP_KEY);
                if (!raw) return notify('本地未发现备份记录', 'warning');
                try {
                    const backup = JSON.parse(raw);
                    if (!confirm(`确定载入本地备份吗？\n时间: ${new Date(backup.time).toLocaleString()}`)) return;
                    state.data = backup.data;
                    state.currentCatId = backup.data.categories[0]?.id || null;
                    renderCategories();
                    renderCards();
                    setDirty(true);
                    notify('已从本地缓存恢复', 'success');
                } catch {
                    notify('备份解析失败', 'error');
                }
            });

            function init() {
                if (state.token) {
                    dom.authBtnText.textContent = 'Token已存';
                    fetchCloudData(state.token);
                } else {
                    const raw = localStorage.getItem(BACKUP_KEY);
                    if (raw) {
                        try {
                            const b = JSON.parse(raw);
                            state.data = b.data;
                            state.currentCatId = b.data.categories[0]?.id || null;
                            renderCategories();
                            renderCards();
                            dom.statusPill.className = 'status-pill dirty';
                            dom.statusText.textContent = '本地暂存模式';
                            notify('已载入本地暂存，点击右上角Token可登录同步', 'info', 3500);
                            return;
                        } catch {}
                    }
                    openModal('#authModal');
                }
            }

            init();
        })();
    </script>
</body>
</html>
