<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网站管理</title>

  <style>
    body {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      color: #222;
    }

    h1 {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      margin-top: 25px;
      padding: 12px 22px;
      border: 0;
      border-radius: 6px;
      background: #1677ff;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #0958d9;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .tip {
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      line-height: 1.6;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>添加网站</h1>

  <div class="tip">
    只需要填写网站名称和网址，然后点击保存即可。
  </div>

  <label for="token">管理员密码</label>
  <input
    id="token"
    type="password"
    placeholder="请输入 ADMIN_TOKEN"
  >

  <label for="category">选择分类</label>
  <select id="category">
    <option value="">请先读取导航</option>
  </select>

  <label for="title">网站名称</label>
  <input
    id="title"
    type="text"
    placeholder="例如：百度"
  >

  <label for="url">网站地址</label>
  <input
    id="url"
    type="url"
    placeholder="例如：https://www.baidu.com"
  >

  <button id="loadButton">
    读取分类
  </button>

  <button id="saveButton">
    添加并保存
  </button>

  <div id="message"></div>

  <script>
    const API_BASE =
      "https://shuoce-navigation.2765414002jin.workers.dev";

    let navigationData = null;

    const tokenInput =
      document.getElementById("token");

    const categorySelect =
      document.getElementById("category");

    const titleInput =
      document.getElementById("title");

    const urlInput =
      document.getElementById("url");

    const loadButton =
      document.getElementById("loadButton");

    const saveButton =
      document.getElementById("saveButton");

    const message =
      document.getElementById("message");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success
        ? "green"
        : "crimson";
    }

    async function loadNavigation() {
      showMessage("正在读取分类……");

      loadButton.disabled = true;

      try {
        const response = await fetch(
          API_BASE + "/api/navigation?time=" + Date.now()
        );

        const data = await response.json();

        if (!response.ok) {
          showMessage(
            "读取失败：" +
            (data.message || response.status)
          );
          return;
        }

        if (
          !data ||
          !Array.isArray(data.categories)
        ) {
          showMessage(
            "导航数据格式错误，没有找到 categories。"
          );
          return;
        }

        navigationData = data;

        categorySelect.innerHTML = "";

        data.categories.forEach(category => {
          const option =
            document.createElement("option");

          option.value = category.id;
          option.textContent =
            category.title || category.id;

          categorySelect.appendChild(option);
        });

        if (data.categories.length === 0) {
          showMessage("当前没有可用分类。");
          return;
        }

        showMessage(
          "读取成功，现在可以填写网站名称和地址。",
          true
        );
      } catch (error) {
        showMessage(
          "读取失败：" + error.message
        );
      } finally {
        loadButton.disabled = false;
      }
    }

    async function saveNavigation() {
      const token =
        tokenInput.value.trim();

      const title =
        titleInput.value.trim();

      const websiteUrl =
        urlInput.value.trim();

      const categoryId =
        categorySelect.value;

      if (!token) {
        showMessage("请输入管理员密码。");
        return;
      }

      if (!navigationData) {
        showMessage("请先点击“读取分类”。");
        return;
      }

      if (!title) {
        showMessage("请输入网站名称。");
        return;
      }

      if (!websiteUrl) {
        showMessage("请输入网站地址。");
        return;
      }

      let parsedUrl;

      try {
        parsedUrl = new URL(websiteUrl);
      } catch {
        showMessage(
          "网站地址格式不正确，例如：https://www.baidu.com"
        );
        return;
      }

      if (
        parsedUrl.protocol !== "http:" &&
        parsedUrl.protocol !== "https:"
      ) {
        showMessage(
          "网站地址必须以 http:// 或 https:// 开头。"
        );
        return;
      }

      const category =
        navigationData.categories.find(
          item => item.id === categoryId
        );

      if (!category) {
        showMessage("请选择一个有效分类。");
        return;
      }

      if (!Array.isArray(category.cards)) {
        category.cards = [];
      }

      category.cards.push({
        className: "",
        icon: "bi-globe",
        title: title,
        description: "",
        url: websiteUrl
      });

      saveButton.disabled = true;
      showMessage("正在保存……");

      try {
        const response = await fetch(
          API_BASE + "/api/admin/navigation",
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token
            },
            body: JSON.stringify(navigationData)
          }
        );

        const result = await response.json();

        if (!response.ok) {
          // 保存失败时撤销刚才添加的项目
          category.cards.pop();

          showMessage(
            "保存失败：" +
            (result.message || response.status)
          );
          return;
        }

        showMessage(
          "保存成功！网站已经添加到导航中。",
          true
        );

        titleInput.value = "";
        urlInput.value = "";
      } catch (error) {
        // 网络失败时撤销刚才添加的项目
        category.cards.pop();

        showMessage(
          "保存失败：" + error.message
        );
      } finally {
        saveButton.disabled = false;
      }
    }

    loadButton.addEventListener(
      "click",
      loadNavigation
    );

    saveButton.addEventListener(
      "click",
      saveNavigation
    );
  </script>
</body>
</html>
