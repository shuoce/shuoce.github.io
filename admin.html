
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>网站导航管理 · 硕策</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f4f6fb;
            --card-bg: #ffffff;
            --text-1: #0f172a;
            --radius: 16px;
        }
        [data-theme="dark"] {
            --bg: #0b1120;
            --card-bg: #151e2e;
            --text-1: #e2e8f0;
        }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-1);
            line-height: 1.6;
        }
        .website-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .website-card.dragging {
            opacity: 0.65;
            transform: scale(0.96);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }
        .stats-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: all 0.2s;
            z-index: 2;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .website-card:hover .stats-btn {
            opacity: 1;
        }
        .stats-btn:hover {
            background: #6366f1;
            color: white;
            transform: scale(1.1);
        }
        .stats-modal {
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .stats-modal.open {
            display: flex;
        }
        .stats-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            width: 100%;
            max-width: 920px;
            max-height: 92vh;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
        }
        .stats-header {
            padding: 20px 28px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
        }
        .stats-title {
            font-size: 1.25rem;
            font-weight: 700;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background: #f8fafc;
            font-weight: 600;
            color: #64748b;
        }
        .dark th {
            background: #1e2a3a;
            color: #94a3b8;
        }
        .stats-content .btn-row {
            padding: 20px 28px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
        }
    </style>
</head>
<body>

<div class="layout">
    <!-- 侧边栏、顶部栏、内容区等保持原样 -->
    <aside class="sidebar">
        <!-- 原侧边栏代码保持不变 -->
        <div class="brand">...（原品牌区域）...</div>
        <button id="addCategorySidebarBtn" class="btn-primary btn-block">＋ 新建分类</button>
        <div class="sidebar-title">分类列表 · <span id="categoryCount">0</span></div>
        <div id="categoryList" class="category-list"></div>
        <div class="sidebar-footer">
            <!-- 原按钮保持不变 -->
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="search-wrap">
                <input id="searchInput" placeholder="搜索标题 / 地址 / 描述…">
            </div>
            <div class="topbar-actions">
                <button id="statsBtn" class="btn-outline btn-sm">📈 访问统计</button>
                <button id="importBtn" class="btn-outline btn-sm">📥 导入</button>
                <button id="exportBtn" class="btn-outline btn-sm">📤 导出</button>
                <button id="themeToggleBtn" class="icon-btn btn-outline">🌙</button>
                <button id="saveBtn" class="btn-primary btn-sm">💾 保存修改</button>
            </div>
        </header>
<!---->
        <div class="content">
            <div class="page-header">
                <div>
                    <h2 id="currentCategoryTitle">请选择分类</h2>
                    <p id="currentCategoryMeta" class="meta">共 0 个网站</p>
                </div>
            </div>
            <div id="websiteGrid" class="website-grid"></div>
        </div>
    
</main>


</div>

<!-- 访问统计弹窗 -->
<div id="statsModal" class="stats-modal">
    <div class="stats-content">
        <div class="stats-header">
            <h3 class="stats-title">📊 访问统计</h3>
            <button id="closeStatsBtn" class="btn-outline btn-sm">关闭</button>
        </div>
        <div style="padding:24px;overflow-y:auto;max-height:calc(92vh - 80px);">
            <div style="margin-bottom:32px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <h4>全局访问量</h4>
                    <span id="totalVisits" style="font-size:2rem;font-weight:700;color:var(--primary);">0</span>
                </div>
                <div id="categoryStatsList"></div>
            </div>

            <h4 style="margin:24px 0 12px;">访问排行榜</h4>
            <table id="rankTable">
                <thead>
                    <tr>
                        <th>排名</th>
                        <th>网站</th>
                        <th>访问次数</th>
                    </tr>
                </thead>
                <tbody id="rankBody"></tbody>
            </table>
        </div>
        <div class="stats-content .btn-row">
            <button id="resetStatsBtn" class="btn-danger-soft" style="flex:1;">🗑️ 重置所有统计</button>
        </div>
    </div>
</div>

<script>
    (() => {
        'use strict';

        const API_BASE = "https://proxyd.picpi.top/https://shuoce-navigation.2765414002jin.workers.dev";
        const STORAGE_KEY = 'shuoce_admin_token';
        const STATS_KEY = 'shuoce_visit_stats';
        const BACKUP_KEY = 'shuoce_navigation_backup';

        let state = {
            data: null,
            currentCategoryId: null,
            selectedWebsites: new Set(),
            searchQuery: '',
            stats: JSON.parse(localStorage.getItem(STATS_KEY)) || { total: 0, categoryStats: {}, websiteStats: {} },
            editingWebsite: null,
            token: null
        };

        const dom = {
            categoryList: document.getElementById('categoryList'),
            websiteGrid: document.getElementById('websiteGrid'),
            searchInput: document.getElementById('searchInput'),
            currentCategoryTitle: document.getElementById('currentCategoryTitle'),
            currentCategoryMeta: document.getElementById('currentCategoryMeta'),
            statsModal: document.getElementById('statsModal'),
            totalVisits: document.getElementById('totalVisits'),
            categoryStatsList: document.getElementById('categoryStatsList'),
            rankBody: document.getElementById('rankBody'),
            resetStatsBtn: document.getElementById('resetStatsBtn'),
            closeStatsBtn: document.getElementById('closeStatsBtn')
        };

        // ==================== 统计相关 ====================
        function loadStats() {
            const saved = localStorage.getItem(STATS_KEY);
            if (saved) state.stats = JSON.parse(saved);
        }

        function saveStats() {
            localStorage.setItem(STATS_KEY, JSON.stringify(state.stats));
        }

        function incrementVisit(url) {
            if (!state.stats.websiteStats[url]) {
                state.stats.websiteStats[url] = 0;
            }
            state.stats.websiteStats[url]++;
            state.stats.total++;
            saveStats();
            renderWebsiteGrid();
        }

        function getTop10Websites() {
            return Object.entries(state.stats.websiteStats)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10)
                .map(([url, count], index) => ({
                    url: url.replace(/^https?:\/\//, ''),
                    count: count
                }));
        }

        function renderStats() {
            dom.totalVisits.textContent = state.stats.total;

            // 分类统计
            dom.categoryStatsList.innerHTML = '';
            const cats = state.data?.categories || [];
            const catStats = state.stats.categoryStats;

            cats.forEach(cat => {
                const visits = catStats[cat.id] || 0;
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.padding = '8px 0';
                div.innerHTML = `
                    <span>${cat.title}</span>
                    <strong style="color:var(--primary);">${visits}</strong>
                `;
                dom.categoryStatsList.appendChild(div);
            });

            // 排行榜
            dom.rankBody.innerHTML = '';
            const top10 = getTop10Websites();

            top10.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${index+1}</strong></td>
                    <td style="color:#64748b;">${item.url}</td>
                    <td><span style="background:#6366f1;color:white;padding:4px 10px;border-radius:9999px;font-size:0.85rem;">${item.count}</span></td>
                `;
                dom.rankBody.appendChild(tr);
            });
        }

        // ==================== 网站卡片渲染优化 ====================
        function renderWebsiteGrid() {
            const cat = state.data?.categories?.find(c => c.id === state.currentCategoryId);
            if (!cat) return;

            dom.websiteGrid.innerHTML = '';

            const filtered = (cat.cards || []).filter(card => {
                const q = state.searchQuery.toLowerCase();
                return !q || card.title?.toLowerCase().includes(q) || card.url?.toLowerCase().includes(q);
            });

            filtered.forEach((card, index) => {
                const el = document.createElement('div');
                el.className = 'website-card';
                el.draggable = true;
                const visits = state.stats.websiteStats[card.url] || 0;

                el.innerHTML = `
                    <div class="check">✓</div>
                    <div class="card-favicon"></div>
                    <div class="card-title">${card.title || ''}</div>
                    <div class="card-url" style="color:#64748b;">${card.url || ''}</div>
                    ${card.description ? `<div class="card-desc">${card.description}</div>` : ''}
                    <div class="card-actions">
                        <button class="stats-btn" data-url="${card.url}" title="访问统计">📊<span style="margin-left:4px;">${visits}</span></button>
                        <!-- 其他按钮保持不变 -->
                    </div>
                `;

                // 统计按钮事件
                const statsBtn = el.querySelector('.stats-btn');
                statsBtn.addEventListener('click', (e) => {
                    e.stopImmediatePropagation();
                    incrementVisit(card.url);
                    openStatsPage();
                });

                dom.websiteGrid.appendChild(el);
            });

            // 绑定其他事件（拖拽、点击等）保持原样
        }

        function openStatsPage() {
            renderStats();
            dom.statsModal.classList.add('open');
        }

        // ==================== 初始化 ====================
        function init() {
            loadStats();
            renderWebsiteGrid();
            // 其他初始化代码...
        }

        // 事件绑定...
        document.addEventListener('DOMContentLoaded', () => {
            init();
        });

        dom.resetStatsBtn.addEventListener('click', () => {
            if (confirm('确定重置所有访问统计吗？此操作不可恢复。')) {
                state.stats = { total: 0, categoryStats: {}, websiteStats: {} };
                saveStats();
                renderStats();
                renderWebsiteGrid();
                toast('统计已重置', 'warning');
            }
        });

        dom.closeStatsBtn.addEventListener('click', () => {
            dom.statsModal.classList.remove('open');
        });
    })();
</script>
</body>
</html>
